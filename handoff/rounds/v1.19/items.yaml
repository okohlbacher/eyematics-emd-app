      expect: "Options read \"Alle Patienten (N=…)\" first and the saved search \"<name> (N=…)\"; after choosing it, the band/median shape in the Visus/CRT chart changes. For a patient in no saved search the select is absent."
    promotes_to: "UIR-CASE-013"
