# Round items — worked example, retro-filled 2026-10-08 from .planning/v1.19-UAT-TRIAGE.md and
# .planning/v1.19-DEV-RESPONSE-TO-UAT.md (tester round 7, shipped as v1.19 + v1.19.1). Read by requirements-check --round.
# Tester quotes are verbatim from the triage; acceptance lines are distilled from the dev response ("What changed" / "How to verify");
# tests/browser are copied from the registry entries that cite each item (promotes_to), so this file is the shape a live round should reach.
round: v1.19
tested_version: v1.18
source: "EMD-v1.18-UAT-User-Response_2026-06-16.docx"
items:
  - id: N1
    title: "Line hover emphasis along the whole line, not only at points"
    area: TRAJ
    tester_quote: "highlighting should work whenever I hover over a line, not only when I hit an actual measurement."
    diagnosis: "Plotly hovermode 'closest' fires plotly_hover only near a data point; emphasising mid-segment would need hundreds of synthetic in-between points per line, which undoes the Verläufe performance gain and would show made-up (non-measured) values in the tooltip of a clinical view."
    decision: by_design
    owner_decision: ""
    acceptance:
      - "Hovering a per-patient line near a measurement point (vertex) thickens the line and shows that patient's tooltip."
      - "Hovering the empty stretch between two visits of a line does nothing (no thickening, no tooltip, no synthetic values)."
    tests: []
    browser:
      route: "/analysis?tab=trajectories"
      steps:
        - "Open Analyse → \"Verläufe\" on a cohort ≤100 patients; untick \"Streupunkte\", tick \"Individuelle Kurven\"."
        - "Hover the middle of a long straight segment between two visits of a line."
        - "Move the cursor onto a vertex (visit) of the same line."
      expect: "Step 2: no line thickening and no tooltip. Step 3: the line thickens and the patient tooltip appears."
    promotes_to: "UIR-TRAJ-027"

  - id: N2
    title: "Highlight the hovered scatter point, not only its tooltip"
    area: TRAJ
    tester_quote: "Scatter plots should also be highlighted when I hover over them; right now there are tooltips only, no highlighting."
    diagnosis: "The scattergl hover shows the tooltip but does not emphasise the hovered marker; add an imperative highlight on plotly_hover over the scatter (an enlarged, ringed overlay marker at the hovered point, restored on unhover), mirroring the line-emphasis approach."
    decision: fix
    owner_decision: ""
    acceptance:
      - "Hovering a point in the Verläufe scatter draws an enlarged, ringed marker at that point in addition to the single detailed tooltip."
      - "The ring follows the cursor to the neighbouring point and disappears when the mouse leaves the plot."
    tests: []
    browser:
      route: "/analysis?tab=trajectories"
      steps:
        - "Open Analyse → \"Verläufe\"; tick \"Streupunkte\" in \"Diagramm-Anzeige\"."
        - "Hover a dot inside a cluster of dots at the same x; move to the neighbouring dot above/below it."
        - "Move the mouse out of the plot."
      expect: "The hovered dot is drawn with a larger hollow ring (dark ring in light mode, light ring in dark mode) and the ring jumps to the neighbour when the mouse moves; the tooltip pseudonym matches the ringed dot. Step 3: the ring vanishes."
    promotes_to: "UIR-TRAJ-025"

  - id: N3
    title: "Header cluster: warnings left, cohort-reference toggle far right"
    area: CASE
    tester_quote: "It should be aligned to the right and the implausible-data warnings should appear next to the toggle on the left (both are top-right, but the toggle is the outer-right one)."
    diagnosis: "In PatientHeader the toggle and the warning badges both sit top-right in the wrong order; the tester wants [warnings] then [toggle] with the toggle as the rightmost element. Reorder the header's top-right cluster."
    decision: fix
    owner_decision: ""
    acceptance:
      - "In the case header's top-right cluster the warning badges (adverse events, critical values) sit to the left and the \"Kohorten-Referenz anzeigen\" toggle is the rightmost element."
    tests:
      - file: tests/CaseDetailRound5.test.tsx
        name: "M4: renders the cohort-reference toggle when onToggleCohortReference is provided"
      - file: tests/CaseDetailRound5.test.tsx
        name: "M4: fires onToggleCohortReference with the new value when toggled"
      - file: tests/CaseDetailRound7.test.tsx
        name: "orders the cluster [adverse events] → [critical warnings] → [cohort toggle]"
    browser:
      route: "/case/:caseId"
      steps:
        - "1. Open a case that shows an orange or red warning badge in the header."
        - "2. Confirm the checkbox \"Kohorten-Referenz anzeigen\" is unchecked and is the rightmost element of the header's top-right cluster, badges to its left."
        - "3. Tick the checkbox; inspect Visus/CRT, Veränderung zum Ausgangswert, Visus-/CRT-Verteilung, Visus vs. CRT and IOD."
        - "4. Untick it."
      expect: "Step 3: dashed median lines/bands (Visus/CRT, baseline, IOD), grouped % bars (distributions) and grey cloud (scatter) appear. Step 4: all of them vanish and the count histograms return."
    promotes_to: "UIR-CASE-012"

  - id: N4
    title: "IOD relative axis must fully replace the calendar dates"
    area: CASE
    tester_quote: "For some patients the IOD axis does switch, but the individual dates are not removed → fix (e.g. EM-UKT-0027)."
    diagnosis: "When the IOD axis switches to relative months, residual calendar-date ticks/rows remain for some patients (patient IOP series still keyed on date while the axis is relMonths, or duplicate rows). Re-key the patient series to relMonths, collapse duplicate buckets, remount the axis on mode change. Repro on EM-UKT-0027."
    decision: fix
    owner_decision: ""
    acceptance:
      - "With the overlay on, the IOD plot switches cleanly to the relative \"Monate seit Erstvisite\" axis with no residual calendar-date ticks (verified on EM-UKT-0027)."
      - "The cohort reference on the IOD plot stays a dashed median line plus IQR band (no bars)."
    tests:
      - file: tests/CaseDetailRound7.test.tsx
        name: "keys the X axis purely on relMonths (numeric) — no date-keyed axis remains"
      - file: tests/CaseDetailRound7.test.tsx
        name: "collapses duplicate relMonths buckets and sorts ascending (no leftover rows)"
      - file: tests/CaseDetailRound5.test.tsx
        name: "renders the cohort median as a Line and the IQR as an Area band"
      - file: tests/CaseDetailRound5.test.tsx
        name: "M7: keys the IOD X axis on relMonths (numeric) when the overlay is ON"
    browser:
      route: "/case/:caseId"
      steps:
        - "1. On /cohort Detailansicht open the case with pseudonym EM-UKT-0027."
        - "2. Tick \"Kohorten-Referenz anzeigen\" and inspect \"Augeninnendruck (IOD)\"."
      expect: "X axis shows only integer month ticks with title 'Monate seit Erstvisite' (no dd.mm. / MM/YY labels); a dashed light-indigo median line and a translucent indigo band appear with legend entries 'Kohorten-Median IOD' and 'Kohorten-IQR IOD (25.–75. Perz.)'; no bars."
    promotes_to: "UIR-CASE-045"

  # N5 — tester re-raised only the tooltip in round 8 ("tooltips were removed -> add tooltips again"); shipped as v1.19.1
  # (commit 8502a87, styled cursor-following tooltip on the CSS bars) and thereby confirmed. The template has no field for
  # "confirmed in <version>" — see the promotion in UIR-CASE-041, whose sources cite v1.19 N5.
  - id: N5
    title: "Distribution plots: paired patient/cohort %-bars when the overlay is on"
    area: CASE
    tester_quote: "the patient bars are not aligned with the percentage y-axis, so patient vs cohort isn't comparable → useless. When the cohort overlay is active, change the bar plots to: (1) y-axis fully percentage; (2) one bar = patient % per measurement range; (3) one bar = cohort median % per measurement range; (4) tooltips with absolute counts (cohort median + patient actual); (5) add a tooltip explanation."
    diagnosis: "The distribution charts plot patient counts and cohort % on mismatched scales, so the bars are not comparable. With the overlay on, draw both series as percentage of their own total per bin as grouped bars (patient % vs cohort-median %) on one shared % axis, with tooltips carrying the absolute counts and an explanation; overlay off keeps the count histogram. Largest item this round; drawn with a lightweight grouped-bar renderer because the charting library's native bars were unreliable for this view."
    decision: fix
    owner_decision: ""
    acceptance:
      - "With the overlay on, each Visus/CRT distribution shows, per measurement range, two bars on one shared percentage axis: the patient's % of their own measurements and the cohort-median %."
      - "Hovering a bar shows the absolute counts (patient actual count and cohort-median count) in a styled tooltip, and an ℹ note explains the plot."
      - "With the overlay off the simple count histogram returns."
    tests:
      - file: tests/DistributionChartsLabels.test.tsx
        name: "renders the CSS grouped patient% + cohort-median% bars + the cloud when the overlay is on"
      - file: tests/DistributionChartsLabels.test.tsx
        name: "falls back to the single count bar (no %-bars / cloud) when the overlay is off"
      - file: tests/VisusCrtChartReference.test.tsx
        name: "N5: computes per-bin cohort MEDIAN percentages excluding the index patient"
      - file: tests/CaseDetailRound7.test.tsx
        name: "computes patient %, cohort median %, and cohort median count per bin"
    browser:
      route: "/case/pat-uka-003"
      steps:
        - "1. Tick \"Kohorten-Referenz anzeigen\"; look at \"Visus-Verteilung\" and \"CRT-Verteilung (µm)\"."
        - "2. Hover a bin column."
        - "3. Untick the toggle."
      expect: "Step 1: two bars per bin (coloured patient bar + grey cohort bar) on a 0–N% axis, legend 'Patient (% der eigenen Messungen)' / 'Kohorten-Median (% pro Bin)', ℹ next to the title. Step 2: tooltip with both percentages and absolute counts in parentheses ('… Messungen'). Step 3: single count bars with visible heights return."
    promotes_to: "UIR-CASE-041"

  - id: N6
    title: "Dark mode: finish the remaining light surfaces"
    area: THEME
    tester_quote: "Tester lists: (1) \"Show raw data\" collapsibles in trajectories; (2) trajectory plots Behandlungsintervall + Responder; (3) OCT Images view in the Data-Quality case; (4) Anamnese, Befunde, adverse events, medication, and OCT Images in the case view."
    diagnosis: "OutcomesDataPreview.tsx, AnamnesisFindings.tsx, MedicationCard.tsx and OctViewer.tsx carry no theme refs at all (fully light); IntervalHistogram.tsx and ResponderView.tsx theme the Recharts internals but their card chrome/labels are still light. OCT in the Data-Quality case reuses OctViewer, so fixing it covers both."
    decision: fix
    owner_decision: ""
    acceptance:
      - "In dark mode the Verläufe \"Rohdaten anzeigen\" preview table and the Behandlungsintervall + Responder plots render dark (background, grid, ticks, tooltip, table header/rows)."
      - "In dark mode the case view's Anamnese, Befunde, adverse-events and Medikation cards and the OCT-image viewer render dark."
      - "In dark mode the Datenqualität case detail incl. its \"OCT-Aufnahmen\" section renders dark."
    tests:
      - file: tests/rechartsDarkTheme.test.tsx
        name: "returns distinct dark vs light tokens"
      - file: tests/rechartsDarkTheme.test.tsx
        name: "IntervalHistogram renders inside a dark ThemeProvider"
      - file: tests/rechartsDarkTheme.test.tsx
        name: "ResponderView renders inside a dark ThemeProvider"
      - file: tests/OutcomesPage.test.tsx
        name: "13. <details> data preview renders collapsed by default"
      - file: tests/OutcomesPage.test.tsx
        name: "14. expanding <details> shows 8 column headers and row-count caption"
      - file: tests/OutcomesPage.test.tsx
        name: "15. Export CSV button calls downloadCsv with 8 D-28 column headers in order"
      - file: tests/OutcomesPage.test.tsx
        name: "17. CSV filename matches outcomes-cohort-YYYY-MM-DD.csv shape"
    browser:
      route: "/analysis?tab=trajectories"
      steps:
        - "Open the sidebar \"Design\" menu and click \"Dunkel\"."
        - "Go to Analyse → tab \"Aggregiert\": inspect the distribution charts and the IOD chart (grid lines, axis ticks, tooltip on hover)."
        - "Switch to tab \"Verläufe\": inspect the Visus/CRT trajectory panels and enable the display layer \"Streuband (IQR)\" to see the band."
        - "Open the metrics tabs \"Behandlungsintervall\" and \"Responder\"."
        - "Expand \"Rohdaten anzeigen\" at the bottom of the Verläufe tab."
        - "From Kohortenbildung open any case (route /case/<caseId>); scroll to the \"Anamnese\", \"Befunde\", \"Unerwünschte Ereignisse\", \"Medikation\" and \"OCT-Aufnahmen\" cards."
        - "Go to Datenqualität (/quality), open a flagged case and scroll to its \"OCT-Aufnahmen\" section."
      expect: "Every figure has a dark background with light grey grid/ticks/legend and dark tooltip boxes; the Rohdaten table has a dark header and rows; all listed case cards and both OCT viewers are dark. No chart, tooltip, table or card keeps a white/light background."
    promotes_to: "UIR-THEME-007, UIR-THEME-008, UIR-THEME-009, UIR-TRAJ-040"

  - id: N7
    title: "Theme selection as a collapsible 3-option menu"
    area: THEME
    tester_quote: "make the theme selection a collapsible menu with the three options to toggle."
    diagnosis: "Replace the cycling button (ThemeToggle.tsx) with a small dropdown/popover listing Hell / Dunkel / System, each directly selectable (the direct selector offered in round 6). Retires the cycle entirely; themeCycle.ts can go."
    decision: fix
    owner_decision: ""
    acceptance:
      - "The sidebar \"Design\" button opens a menu with exactly three directly selectable entries Hell, Dunkel, System; the active one is marked."
      - "Selecting an entry applies the theme immediately and closes the menu; there is no cycling button any more."
      - "Clicking outside the open menu or pressing Escape closes it without changing the theme."
    tests:
      - file: tests/themeToggleCycle.test.tsx
        name: "opens the menu listing all three options when the trigger is clicked"
      - file: tests/themeToggleCycle.test.tsx
        name: "marks the active option (System by default) as checked"
      - file: tests/themeToggleCycle.test.tsx
        name: "selecting Light persists light, marks it active, and closes the menu"
      - file: tests/themeToggleCycle.test.tsx
        name: "starts closed (no menu in the DOM)"
      - file: tests/themeToggleCycle.test.tsx
        name: "closes on Escape"
      - file: tests/themeToggleCycle.test.tsx
        name: "closes on outside click"
    browser:
      route: "/"
      steps:
        - "Log in and stay on the Startseite."
        - "In the sidebar footer (below the \"English\" language button) click the \"Design\" button; it shows a chevron and the current mode name."
        - "Observe the popover that opens above the button."
        - "Click \"Dunkel\"."
        - "Click the \"Design\" trigger again and inspect the entries."
      expect: "The popover lists exactly three entries \"Hell\", \"Dunkel\", \"System\" (each a menuitemradio). After clicking \"Dunkel\" the page turns dark immediately, the menu closes, the trigger label reads \"Dunkel\" with a moon icon, and on reopening only \"Dunkel\" carries a check icon (aria-checked=true). There is no cycling button."
    promotes_to: "UIR-THEME-001, UIR-THEME-002"

  - id: N8
    title: "Vollzähligkeit denominator follows the time-range filter"
    area: DOCQ
    tester_quote: "The denominator should be adapted to the registered total in the time range."
    diagnosis: "Reverses the round-6 owner decision (M14: count restricts, % keeps the full registered denominator). The tester wants count and % to both reflect the range for consistency; with an activity-derived window numerator ≈ denominator, so the windowed % reads ≈100 % by construction — the trade-off the round-6 decision avoided. Owner confirmation required before changing."
    decision: fix
    owner_decision: "Follow the tester: the denominator follows the time-range filter too (count and % both reflect the selected period; with no filter the full registered total, matching the Startseite). Accepts the ≈100 % windowed reading. Supersedes v1.18 M14."
    acceptance:
      - "On Dokumentationsqualität with a Zeitraum filter active, both the Vollzähligkeit patient count and the percentage reflect the selected period."
      - "With \"Gesamter Zeitraum\" the card equals the Startseite figure (full registered total as denominator)."
    tests:
      - file: tests/qualityMetrics.test.ts
        name: "aggregate matches the landing definition when unfiltered (active==registered)"
      - file: tests/stubIsolation.test.ts
        name: "returns total Patient count including stubs (denominator)"
    browser:
      route: "/doc-quality"
      steps:
        - "Log in as admin, open / (Startseite) and note the DATENVOLLZÄHLIGKEIT percentage and its \"n / m Patienten\" sub-label."
        - "Open /doc-quality with \"Gesamter Zeitraum\"; read the \"Vollzähligkeit\" card percentage and its \"… Patienten\" count."
        - "Click \"Zeitraum\" → \"Letztes Jahr\" and read the card again; hover its ℹ icon."
      expect: "Step 2 percentage equals the landing percentage and the Patienten count equals the landing n; after step 3 the Patienten count is ≤ the step-2 count and the percentage rises to (about) 100 % because numerator and denominator are both the in-window active population; the tooltip states that Zähler und Nenner follow the time filter."
    promotes_to: "UIR-DOCQ-011"

  - id: N9
    title: "Y-axis label naming the active metric on every trajectory panel"
    area: TRAJ
    tester_quote: "it must be self-evident what y-metric settings are used without opening the settings. Add a y-axis label."
    diagnosis: "The Plotly panels have no visible y-axis title; add an axis title reflecting the active metric (logMAR / Δ logMAR / Δ % · CRT µm / Δ / Δ %)."
    decision: fix
    owner_decision: ""
    acceptance:
      - "Every Verläufe panel shows a y-axis title for the active metric and mode (e.g. \"Δ logMAR\", \"Visus (logMAR)\", \"Netzhautdicke (µm)\"), so the plotted quantity is clear without opening Diagramm-Anzeige."
      - "The y-axis title changes when the Y radio or the metric tab changes."
    tests: []
    browser:
      route: "/analysis?tab=trajectories"
      steps:
        - "Open Analyse → \"Verläufe\" (Visus); open \"Diagramm-Anzeige\"."
        - "Select Y radio \"Δ % (prozentuale Änderung)\"; then X radio \"Anzahl Behandlungen\"."
        - "Click metric tab \"CRT\" (resets to Δ/days: 'Δ µm' / 'Tag'); then select Y radio \"Absolut (µm)\"."
        - "In DevTools inspect [data-testid=outcomes-panel-od-ylabel]."
      expect: "Step 2: all three panels' y-axis title becomes 'Δ logMAR %' and x-axis title 'Behandlung #'. Step 3: y-axis title 'Netzhautdicke (µm)' and x-axis 'Tag'. Step 4: data-ylabel equals the visible y-axis title."
    promotes_to: "UIR-TRAJ-007"

  - id: N10
    title: "Name the cohort the overlay represents"
    area: CASE
    tester_quote: "Include information on the currently selected cohort in the cohort overlay view of the patient."
    diagnosis: "The patient cohort overlay aggregates a peer group but does not name it; surface the active cohort's label + N near the overlay toggle / legend."
    decision: fix
    owner_decision: ""
    acceptance:
      - "With the overlay on, the patient header names the active overlay cohort as \"Vergleichskohorte: <name> (N=…)\"."
      - "The label updates when a different cohort is chosen and is hidden when the overlay is off."
    tests:
      - file: tests/CaseDetailRound7.test.tsx
        name: "N10: shows the active cohort label + N only when the overlay is ON"
    browser:
      route: "/case/:caseId"
      steps:
        - "1. Open a case page and tick \"Kohorten-Referenz anzeigen\"."
        - "2. Read the indigo badge below the control cluster."
        - "3. If a selector is present, choose a saved cohort."
      expect: "Step 2: \"Vergleichskohorte: Alle Patienten (N=<total cases>)\". Step 3: the badge changes to the saved search name and its N. Unticking hides the badge."
    promotes_to: "UIR-CASE-014"

  - id: N11
    title: "Select which patient-containing cohort the overlay compares against"
    area: CASE
    tester_quote: "Add the option to select a cohort, containing the patient, for the cohort overlay."
    diagnosis: "Add a selector listing the cohorts that include this patient (from the saved searches), driving the overlay aggregation in useCaseData; pairs with N10 (the selector shows the current choice)."
    decision: fix
    owner_decision: ""
    acceptance:
      - "Next to the overlay toggle a \"Vergleichskohorte wählen\" selector lists \"Alle Patienten\" plus the saved searches that contain this patient; it defaults to all patients."
      - "Choosing a cohort changes the overlay aggregation (band/median shape) and the header label; the selector is absent when there is only one option."
    tests:
      - file: tests/CaseDetailRound7.test.tsx
        name: "N11: renders a selector listing the patient-containing cohorts"
      - file: tests/CaseDetailRound7.test.tsx
        name: "N11: omits the selector when there is no real choice (single cohort)"
    browser:
      route: "/case/:caseId"
      steps:
        - "1. On /cohort create and save a search (e.g. centre = the case's centre) so it contains the target patient."
        - "2. Open that patient's case page; tick \"Kohorten-Referenz anzeigen\"."
        - "3. Open the select left of the checkbox (aria-label \"Vergleichskohorte wählen\")."
