  - id: UIR-TRAJ-008
    title: "Drag-to-zoom and Brush with \"Zoom zurücksetzen\" (Plotly modebar removed)"
    statement: "The user can zoom each Verläufe panel by dragging across the plot or with the Brush below it and restore the full extent with \"Zoom zurücksetzen\"; pan, box-select and lasso are not offered (Z0-P23, C8 a, Q21 a; supersedes the Plotly modebar)."
    status: implemented
    sources: ["UAT v1.17 L12; confirmed v1.18", "code: src/components/outcomes/OutcomesPanel.tsx:331-373"]
    evidence:
      - "src/components/outcomes/OutcomesPanel.tsx:342 — dragmode 'zoom'; 343-344 legend orientation h, y -0.2 (below plot); 365-373 config displaylogo false, modeBarButtonsToRemove ['toImage'], modeBarButtons zoom2d/pan2d/select2d/lasso2d/zoomIn2d/zoomOut2d/autoScale2d/resetScale2d"
      - "src/components/outcomes/PlotlyChart.tsx:124-128 — Plotly.react with displaylogo:false + config"
      - "src/components/outcomes/plotlyTraces.ts:144-155 — median trace showlegend true, name 'Median'"
    tests: []
    browser:
      route: "/analysis?tab=trajectories"
      steps:
        - "Open Analyse → \"Verläufe\" (Visus) and wait for the panels."
        - "Hover the top-right corner of the \"Rechtes Auge (OD)\" panel to reveal the modebar."
        - "Drag a rectangle inside the plot area."
        - "Click the modebar 'Reset axes' (home) icon."
        - "Click the pan (hand) icon and drag; click the box-select and lasso icons."
      expect: "Dragging across a panel zooms the x-range to the dragged span and the Brush handles follow; dragging the Brush handles narrows the range; \"Zoom zurücksetzen\" restores the full extent with the complete median line and IQR band; changing x-axis, y-mode or cohort also resets the zoom. No Plotly modebar or logo."
    notes: "Rewritten for Z0-P23 (C8 a, Q21 a, NF 2026-11-18/19). The Brush index range is derived from the zoom (re-review fix in c8d3cbd, tests/acceptance/Z0/Z0-P23.test.tsx). The zoom reset on a y-mode change is not specified by the feature/PLAN (open, severity 1). Browser check pending."
