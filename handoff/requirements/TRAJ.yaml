    status: implemented
    sources: ["spec: EMDREQ-ANL-002 / N02.08", "code: src/components/outcomes/OutcomesSummaryCards.tsx:63-95", "code: src/components/outcomes/VisusMetricContainer.tsx:86-146"]
    evidence:
      - "src/components/outcomes/OutcomesSummaryCards.tsx:35-96 — aria-live=polite grid; cards outcomes-card-patients/-total/-od/-os; excluded hints via outcomesCardExcluded"
      - "src/components/outcomes/VisusMetricContainer.tsx:86-146 — summary cards then 3-column grid of OutcomesPanel od/os/combined with titleKey outcomesPanelOd/Os/Combined"
      - "src/components/outcomes/OutcomesPanel.tsx:131,547-548 — subtitle `${patientCount} · ${measurementCount}`"
      - "src/i18n/translations.ts:840-851 — DE card labels 'Patient:innen', 'Messungen gesamt', 'Messungen OD', 'Messungen OS'; panel titles 'Rechtes Auge (OD)', 'Linkes Auge (OS)', 'OD + OS kombiniert'"
    tests:
      - file: tests/OutcomesPage.test.tsx
        name: "8. OD panel renders and its subtree contains the chart fallback"
      - file: tests/OutcomesPage.test.tsx
        name: "12. summary cards display values matching the aggregate for all-OD cohort"
    browser:
      route: "/analysis?tab=trajectories"
      steps:
        - "Open Analyse → \"Verläufe\" with the \"Visus\" tab active."
        - "Wait until 'Verläufe werden berechnet…' disappears."
        - "Count the cards in the first row and the chart panels below."
      expect: "Four cards labelled \"Patient:innen\", \"Messungen gesamt\", \"Messungen OD\", \"Messungen OS\" (OD/OS cards may show '<n> ausgeschlossen'); below them three panels titled \"Rechtes Auge (OD)\", \"Linkes Auge (OS)\", \"OD + OS kombiniert\", each with a grey subtitle of the form '<patients> · <measurements>' (numbers only)."
    notes: "The panel subtitle is '<n> · <m>' (two numbers, no words). Test 12 asserts card values; test 8 asserts only the OD panel — the OS/combined panels and the four card labels are not asserted."
  - id: UIR-TRAJ-004
    title: "Computing status shown; no blank cards; controls stay responsive"
    statement: "The Verläufe tab shows a role=status 'Verläufe werden berechnet…' label before panels mount for cohorts >50 cases, never blank white cards, and layer toggles stay responsive meanwhile."
    status: implemented
    sources: ["UAT v1.14 I2; v1.15 J2; v1.17 L1/L2; confirmed v1.18", "code: src/components/outcomes/OutcomesView.tsx:41-90,142-194"]
    evidence:
      - "src/components/outcomes/OutcomesView.tsx:46 — CLIENT_RENDER_STATUS_THRESHOLD_CASES=50; 61-89 setTimeout(0)-armed deferral keyed on cohort|metric|layers; 164-176 role=status data-testid outcomes-client-computing while !clientRenderReady || clientWorkerPending"
      - "src/components/outcomes/useOutcomesAggregation.ts:96-99,420 — client path for ad-hoc / below-threshold cohorts; clientWorkerPending keeps the status up until the Web Worker aggregate lands"
      - "src/components/outcomes/OutcomesPanelProgressive.tsx:16-42 — PanelPlaceholder with role=status instead of a blank card"
      - "src/i18n/translations.ts:820 — 'Verläufe werden berechnet…'"
    tests:
      - file: tests/OutcomesPerfI2.test.tsx
        name: "shows a role=\"status\" client-computing indicator on first paint of a large client-side cohort"
      - file: tests/OutcomesPerfI2.test.tsx
        name: "clears the client-computing indicator once the deferred render arms (no permanent spinner)"
      - file: tests/OutcomesPerfI2.test.tsx
        name: "does NOT show the client-computing indicator for a small cohort (no flash)"
    browser:
      route: "/analysis?tab=trajectories"
      steps:
        - "Open Analyse → \"Verläufe\" with no ?cohort= (all 245 cases)."
        - "Immediately watch the area below the tab strip."
        - "While charts are still building, click \"Diagramm-Anzeige\" and untick \"Streuband (IQR)\"."
      expect: "Step 2: an italic grey text 'Verläufe werden berechnet…' appears first (element role=status), then the three panels replace it; no empty white card is shown. Step 3: the drawer opens and the checkbox unticks immediately (no multi-second freeze)."
    notes: "Responsiveness during build is not asserted by tests (jsdom cannot measure it). The status is the client path; a saved cohort above the serverAggregationThresholdPatients (config/settings.yaml, default 1000) shows 'Berechnung auf Server…' instead."
  - id: UIR-TRAJ-005
