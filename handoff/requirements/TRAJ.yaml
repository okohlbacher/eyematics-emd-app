        name: "mounts one panel first, then stages the rest on later macrotasks"
      - file: tests/useProgressivePanels.test.tsx
        name: "re-arms staging (drops back to 1) when the stage key changes"
      - file: tests/useProgressivePanels.test.tsx
        name: "mounts all panels at once when staging is inactive"
    browser:
      route: "/analysis?tab=trajectories"
      steps:
        - "Open Analyse → \"Verläufe\" on all 245 cases."
        - "Open \"Diagramm-Anzeige\", tick \"Streupunkte\" and \"Individuelle Kurven\" (heavy render)."
        - "Watch the three panel slots immediately after the toggle."
      expect: "The \"Rechtes Auge (OD)\" panel draws first while the \"Linkes Auge (OS)\" and \"OD + OS kombiniert\" slots show a card with the title and the text 'Verläufe werden berechnet…'; they fill in one after another."
    notes: "Tests cover the hook only; the container wiring (placeholder cards) is verified by code reading."
