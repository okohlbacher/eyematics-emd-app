    sources: ["UAT v1.15 J2; v1.16 K7", "code: src/components/outcomes/VisusMetricContainer.tsx:45-65,95-145"]
    evidence:
      - "src/components/outcomes/VisusMetricContainer.tsx:56-65 — progressiveActive when cases > PROGRESSIVE_PANEL_THRESHOLD_CASES; stageKey includes layers so a toggle re-arms staging; 95-145 mountedPanels >= 1/2/3 else PanelPlaceholder"
      - "src/components/outcomes/CrtMetricContainer.tsx:49-58,66-119 — same staging for CRT"
      - "src/components/outcomes/useProgressivePanels.ts:28-57 — setTimeout(0) staged mount, re-arm on key change"
      - "src/components/outcomes/OutcomesPanelProgressive.tsx:14,16-42 — threshold 50; placeholder testid outcomes-panel-placeholder-<eye> with role=status and the panel title"
    tests:
