# UI requirements registry — area TRAJ. Generated 2026-10-08 by the ui-requirements-registry workflow;
# maintained by the uat-triage skill (promotion and amendment of tester-confirmed behaviour; see handoff/HANDOFF.md §4).
area: TRAJ
requirements:
  - id: UIR-TRAJ-001
    title: "Metric tablist Visus/CRT/Behandlungsintervall/Responder via ?metric="
    statement: "The Verläufe tab shows a metric tablist \"Visus\", \"CRT\", \"Behandlungsintervall\", \"Responder\" driven by ?metric= (default visus), and ArrowLeft/ArrowRight move between tabs."
    status: implemented
    sources: ["spec: EMDREQ-ANL-002 / N02.08", "code: src/components/outcomes/OutcomesView.tsx:99-134", "code: src/components/outcomes/useOutcomesRouteState.ts:58-60,273-277,488-507"]
    evidence:
      - "src/components/outcomes/OutcomesView.tsx:99-135 — role=tablist nav, role=tab buttons, data-testid metric-tab-<m>, onKeyDown → handleMetricKeyDown; non-active tabs tabIndex -1"
      - "src/components/outcomes/useOutcomesRouteState.ts:58-67 — VALID_METRICS, METRIC_TAB_ORDER; 273-277 activeMetric from ?metric=, invalid → visus; 488-507 handleMetricChange sets ?metric=, handleMetricKeyDown ArrowLeft/Right with wrap"
      - "src/components/outcomes/useOutcomesRouteState.ts:416-442 — resetToMetricDefaults: a metric-tab switch to visus/crt resets Y to delta and X to days (layers keep explicit overrides)"
      - "src/i18n/translations.ts:941-944 — metricsVisus/Crt/Interval/Responder DE labels 'Visus', 'CRT', 'Behandlungsintervall', 'Responder'"
      - "src/components/outcomes/OutcomesPanel.tsx:138-145 — CRT y-axis title 'Netzhautdicke (µm)' / 'Δ µm'"
    tests:
      - file: tests/metricSelector.test.tsx
        name: "renders visus by default when no ?metric= param"
      - file: tests/metricSelector.test.tsx
        name: "reads ?metric=crt on mount and preselects CRT tab"
      - file: tests/metricSelector.test.tsx
        name: "writes ?metric=interval when Treatment Interval tab is clicked"
      - file: tests/metricSelector.test.tsx
        name: "defaults to visus when ?metric=invalidvalue"
      - file: tests/metricSelector.test.tsx
        name: "ArrowRight advances metric and updates URL"
      - file: tests/metricSelector.test.tsx
        name: "ArrowLeft retreats to previous metric"
      - file: tests/metricSelector.test.tsx
        name: "ArrowRight wraps from responder back to visus"
      - file: tests/metricSelector.test.tsx
        name: "ArrowLeft wraps from visus back to responder"
    browser:
      route: "/analysis?tab=trajectories"
      steps:
        - "Log in and open Analyse → tab \"Verläufe\" (URL /analysis?tab=trajectories)."
        - "Observe the tab strip under the header: \"Visus\" (underlined/active), \"CRT\", \"Behandlungsintervall\", \"Responder\"."
        - "Click \"CRT\"."
        - "Click into the \"CRT\" tab to focus it and press ArrowRight; then press ArrowLeft once."
      expect: "After step 3 the URL contains metric=crt and the OD panel y-axis title reads 'Δ µm' (default Δ/days; since Z0-P06 a metric switch keeps the current x-axis/y-mode/layers instead of resetting them, see UIR-TRAJ-020). After ArrowRight the \"Behandlungsintervall\" tab is active (metric=interval) and is document.activeElement with tabIndex 0; after the single ArrowLeft the \"CRT\" tab is active again (metric=crt) and is document.activeElement with tabIndex 0."
    notes: "The keyboard handler fires on the focused tab button; non-active tabs have tabIndex -1, so Tab-key focus lands only on the active tab. Since Z0-P06 (C7, Q24 b, 2026-11-19) switching the metric tab no longer resets the Y-metric to Δ and the X-axis to days; all chart settings survive (UIR-TRAJ-019/-020). Known deviation (backlog, found 2026-10-08): focus does not follow the selection — after ArrowRight document.activeElement stays on the previously focused tab (tabIndex -1) and handleMetricKeyDown (useOutcomesRouteState.ts:531-539) computes the next tab from the focused one, so a second press is off by one (CRT → ArrowRight → ArrowLeft lands on Visus, not CRT; ArrowRight twice stays on Behandlungsintervall). The focus check in expect fails until this is fixed; tests/metricSelector.test.tsx:122-147 fire a single keyDown only."
  - id: UIR-TRAJ-002
    title: "Header buttons Kohorten vergleichen and Diagramm-Anzeige"
    statement: "The Verläufe header has a \"Kohorten vergleichen\" button and a \"Diagramm-Anzeige\" button with a tooltip listing the drawn layers and axes, aria-expanded and aria-controls=outcomes-settings-drawer."
    status: implemented
    sources: ["UAT v1.16 K1d; confirmed v1.17", "code: src/components/outcomes/OutcomesView.tsx:311-336"]
    evidence:
      - "src/components/outcomes/OutcomesView.tsx:311-336 — compare button aria-label outcomesCompareOpenDrawer; settings button title=outcomesSettingsButtonTooltip, aria-expanded={drawerOpen}, aria-controls=outcomes-settings-drawer"
      - "src/components/outcomes/OutcomesSettingsDrawer.tsx:100-103 — aside id=outcomes-settings-drawer, translate-x toggle; 105-108 title 'Einstellungen'"
      - "src/components/outcomes/CohortCompareDrawer.tsx:99-107 — aside id=outcomes-compare-drawer titled outcomesCompareDrawerTitle"
      - "src/i18n/translations.ts:828-831,919 — DE 'Diagramm-Anzeige', tooltip 'Anzeigeebenen & Achsen einstellen (Median, Einzelverläufe, Streupunkte, IQR-Band, Zeitachse)', 'Kohorten vergleichen'"
    tests:
      - file: tests/OutcomesPage.test.tsx
        name: "9. toggling x-axis to treatments in drawer causes axis label to appear"
      - file: tests/OutcomesViewRouting.test.tsx
        name: "after deselecting all pre-selected sub-cohorts, a fresh pick registers (no lock)"
    browser:
      route: "/analysis?tab=trajectories"
      steps:
        - "Open Analyse → \"Verläufe\"."
        - "Hover the \"Diagramm-Anzeige\" button (gear icon) in the header for ~1 s."
        - "Click \"Diagramm-Anzeige\"; inspect the button in DevTools."
        - "Click \"Kohorten vergleichen\"."
      expect: "Step 2: native tooltip 'Anzeigeebenen & Achsen einstellen (Median, Einzelverläufe, Streupunkte, IQR-Band, Zeitachse)'. Step 3: a right-hand drawer titled \"Einstellungen\" slides in; the button has aria-expanded=\"true\" and aria-controls=\"outcomes-settings-drawer\". Step 4: a drawer titled \"Kohorten vergleichen\" slides in."
    notes: "The cited tests only click the two buttons by their accessible name and then interact with the opened drawer (existence + opens). The tooltip text, aria-expanded and aria-controls attributes are not asserted by any test. Both drawers are always in the DOM and slide in via translate-x."
