  - id: UIR-CASE-009
    title: "Kritische Überschreitungen badge with per-metric counts"
    statement: "The patient header shows a red \"Kritische Überschreitungen\" badge with per-metric counts (N× CRT > 400 µm, N× Visus < 0.1, N× IOD > 21 mmHg) whenever at least one CRT or Visus value is critical."
    status: implemented
    sources: ["spec: EMDREQ-FALL-005 / N05.33", "manual: Benutzerhandbuch §6.1", "code: src/components/case-detail/PatientHeader.tsx:198-206"]
    evidence:
      - "src/components/case-detail/PatientHeader.tsx:198-206 (hasCriticalValues → red badge with criticalCrtCount/criticalVisusCount/criticalIopCount, each only when > 0)"
      - "src/hooks/useCaseData.ts:520-532 (hasCriticalValues = any CRT > threshold OR any Visus < threshold; the three counts via CRITICAL_*_THRESHOLD())"
      - "src/i18n/translations.ts:741-744 (criticalExceedances 'Kritische Überschreitungen'; '{0}× CRT > 400 µm', '{0}× Visus < 0.1', '{0}× IOD > 21 mmHg')"
    tests: []
    browser:
      route: "/case/:caseId"
      steps:
        - "Open a case whose Visus/CRT chart has CRT points above the red 400 line."
        - "Read the red header badge."
        - "Open a case with all CRT < 400, Visus ≥ 0.1 and IOD ≤ 21."
      expect: "Step 2: badge \"Kritische Überschreitungen: N× CRT > 400 µm\" (plus Visus/IOD parts if applicable), N equal to the number of CRT points above the line. Step 3: no red badge."
    notes: "hasCriticalValues only considers CRT and Visus (useCaseData.ts:520-522): an IOD-only exceedance shows NO badge even though criticalIopCount > 0. The badge label texts hard-code '400 µm', '0.1', '21 mmHg' and do not follow changed settings (see UIR-CASE-010). The previously cited test 'CRT > 400 µm is critical' compares local literals only — mapping removed."
  - id: UIR-CASE-010
    title: "Critical marking follows Einstellungen thresholds"
    statement: "The case page marks measurements beyond the critical thresholds in the charts, and marking and header counts follow the thresholds set under \"Klinische Schwellenwerte\" in Einstellungen."
    status: partial
    sources: ["spec: EMDREQ-FALL-005 / N05.28", "manual: Benutzerhandbuch §6.1, §6.3"]
    evidence:
      - "src/config/clinicalThresholds.ts:15-27 (CRITICAL_CRT/VISUS/IOP_THRESHOLD() read getSettings().thresholds)"
      - "src/hooks/useCaseData.ts:520-532 (header counts use the accessors)"
      - "src/components/case-detail/VisusCrtChart.tsx:302-308 (red CRT threshold ReferenceLine at CRITICAL_CRT_THRESHOLD())"
      - "src/components/case-detail/ClinicalParametersRow.tsx:225 (red IOP line at CRITICAL_IOP_THRESHOLD())"
      - "src/components/case-detail/VisusCrtChart.tsx:400-419 (dot renderers draw every point in the series colour — no per-point critical marking)"
      - "src/components/case-detail/DistributionCharts.tsx:170-175,202 (the '>400' CRT bin is red regardless of the setting)"
      - "src/i18n/translations.ts:742-744 (badge labels hard-code 400/0.1/21)"
      - "src/pages/SettingsPage.tsx:666-689 (section t('settingsThresholdTitle') 'Klinische Schwellenwerte', input t('settingsThresholdCriticalCrtUm')); src/App.tsx:64 (/settings is AdminRoute)"
    tests: []
    browser:
      route: "/case/:caseId"
      steps:
        - "Log in as admin. On /cohort set \"Netzhautdicke (µm)\" Min 300 / Max 400, open \"Detailansicht\" and click a row whose \"CRT (µm)\" column shows a value between 300 and 400; note the red line position and the header badge text."
        - "Go to /settings, scroll to the card \"Klinische Schwellenwerte\", set \"CRT kritischer Schwellenwert (µm)\" to 300 and click the \"Speichern\" button at the bottom of THAT card; a green banner \"Einstellungen gespeichert\" appears at the top of the page."
        - "Return to the same case page (reload if needed)."
      expect: "The red dashed line now sits at 300 on the right axis and the header count rises to include points > 300. Expected gap: individual points above the line are NOT coloured differently, and the badge still reads '… CRT > 400 µm'; the CRT histogram still colours only the '>400' bin red."
    notes: "Only the threshold reference lines and the counts follow the settings; there is no per-point visual marking of exceedances, the badge label text is static and the histogram's red bin is fixed at >400. /settings requires the admin role. tests/ui-requirements.test.ts \"clinical thresholds are imported from config, not hardcoded\" only asserts the accessor defaults (400/0.1/0.3) and does not exercise the case page; no test covers the threshold-follows-settings behaviour. No reload is needed after saving (updateSettings updates the in-memory cache, settingsService.ts:139-142), but a reload confirms persistence. /settings has four \"Speichern\" buttons, one per card — only the one in \"Klinische Schwellenwerte\" saves thresholds. Record the case id used in step 1 here once chosen so later rounds reuse it."
  - id: UIR-CASE-011
    title: "Exclusion state and include/exclude toggle"
    statement: "The case page shows the analysis-exclusion state and offers \"Von Analysen ausschließen\" / \"In Analysen einschließen\"; toggling changes the badge."
    status: not_implemented
    sources: ["uat: v1.19 N6; v1.13 C1 UI-SPEC §6"]
    evidence:
      - "src/pages/CaseDetailPage.tsx (no exclusion badge or toggle rendered; no use of excludeFromAnalysis/includeInAnalysis/excludedCase)"
      - "src/components/quality/QualityCaseDetail.tsx:360-412 (the 'Ausgeschlossen' badge and the exclude/include button live in the Datenqualität detail panel instead)"
      - "src/i18n/translations.ts:494-496 (excludeFromAnalysis 'Von Analysen ausschließen', includeInAnalysis 'In Analysen einschließen', excludedCase 'Ausgeschlossen')"
    tests: []
    browser:
      route: "/case/:caseId"
      steps:
        - "Open any case page via /cohort Detailansicht."
        - "Search the page for \"Von Analysen ausschließen\" / \"In Analysen einschließen\" / \"Ausgeschlossen\"."
        - "For comparison open /quality, select the same case and look at the detail panel."
      expect: "Step 2: none of these controls exists on /case/<id>. Step 3: the button and the \"Ausgeschlossen\" badge are present on the Datenqualität panel only."
    notes: "The behaviour exists, but on /quality (QualityCaseDetail), not on the Fallansicht. Either move/duplicate the control to the case page or reassign this requirement to area QUAL. The previously cited test 'exclusion is togglable' manipulates a local array and touches no UI — mapping removed."
  - id: UIR-CASE-012
    title: "Kohorten-Referenz toggle in header, off by default"
    statement: "The header shows a \"Kohorten-Referenz anzeigen\" checkbox (aria-label, off by default) as the rightmost element, right of the AE/critical badges, and it governs the cohort overlay on all case plots."
    status: implemented
    sources: ["spec: EMDREQ-FALL-006 / N05.23", "uat: v1.18 M4; v1.19 N3", "code: src/components/case-detail/PatientHeader.tsx:191-254; src/pages/CaseDetailPage.tsx:55,247-248", "manual: Benutzerhandbuch §6.3"]
    evidence:
      - "src/components/case-detail/PatientHeader.tsx:191-254 (cluster order: AE badge → critical badge → selector+checkbox; input aria-label={t('cohortReferenceToggle')})"
      - "src/pages/CaseDetailPage.tsx:55 (useState(false)), 247-248, 271 (VisusCrtChart), 490 (DistributionCharts), 499 (ClinicalParametersRow), 443 (baseline chart)"
      - "src/i18n/translations.ts:1184 (cohortReferenceToggle: 'Kohorten-Referenz anzeigen')"
    tests:
      - file: tests/CaseDetailRound5.test.tsx
        name: "M4: renders the cohort-reference toggle when onToggleCohortReference is provided"
      - file: tests/CaseDetailRound5.test.tsx
        name: "M4: fires onToggleCohortReference with the new value when toggled"
      - file: tests/CaseDetailRound7.test.tsx
        name: "orders the cluster [adverse events] → [critical warnings] → [cohort toggle]"
    browser:
      route: "/case/:caseId"
      steps:
        - "Open a case that shows an orange or red warning badge in the header."
        - "Confirm the checkbox \"Kohorten-Referenz anzeigen\" is unchecked and is the rightmost element of the header's top-right cluster, badges to its left."
        - "Tick the checkbox; inspect Visus/CRT, Veränderung von Visus und CRT zum Ausgangswert (jeweils erste Messung), Visus-/CRT-Verteilung, Visus vs. CRT and IOD."
        - "Untick it."
      expect: "Step 3: dashed median lines/bands (Visus/CRT, baseline, IOD), grouped % bars (distributions) and grey cloud (scatter) appear. Step 4: all of them vanish and the count histograms return."
    notes: "Statement corrected: PatientHeader renders no 'implausible-data' warning — only the adverse-event and critical-value badges sit left of the toggle. The toggle does NOT govern the always-visible grey 'Visus Ø' / 'CRT Ø' average lines (see UIR-CASE-056)."
  - id: UIR-CASE-013
    title: "Kohorten vergleichen button with the Vergleichskohorte wählen panel"
    statement: "The user chooses the overlay cohort via the always-visible button \"Kohorten vergleichen\", which opens the radio panel \"Vergleichskohorte wählen\" with exactly one selectable cohort: \"Alle Patienten\" first, then the saved searches containing the patient by name (Z0-P23, C11, Q22, Q32; supersedes the select)."
    status: implemented
    sources: ["spec: EMDREQ-FALL-006 / N05.23", "uat: v1.19 N11", "code: src/components/case-detail/PatientHeader.tsx:217-233"]
    evidence:
      - "src/components/case-detail/PatientHeader.tsx:217-233 (select aria-label t('overlayCohortSelectorLabel'), rendered only when overlayCohortOptions.length > 1; options '<label> (N=<count>)')"
      - "src/pages/CaseDetailPage.tsx:87-107 (overlayCohorts = [all patients, ...savedSearches whose applyFilters() set contains the case]), 249-251"
      - "src/i18n/translations.ts:1244 (overlayCohortSelectorLabel 'Vergleichskohorte wählen'), :1247 (overlayCohortAllPatients 'Alle Patienten')"
    tests:
      - file: tests/CaseDetailRound7.test.tsx
        name: "N11: the button opens a panel listing the patient-containing cohorts (Z0-P23)"
      - file: tests/CaseDetailRound7.test.tsx
        name: "N11: shows the button even with a single option (\"Alle Patienten\" only, Z0-P23)"
    browser:
      route: "/case/:caseId"
      steps:
        - "On /cohort create and save a search (e.g. centre = the case's centre) so it contains the target patient."
        - "Open that patient's case page; tick \"Kohorten-Referenz anzeigen\"."
        - "Open the select left of the checkbox (aria-label \"Vergleichskohorte wählen\")."
        - "Choose the saved search."
      expect: "The button is present for every case; the panel lists \"Alle Patienten (N=<n> Patient:innen)\" first and the saved search \"<name> (N=<n> Patient:innen)\" as radios; after choosing it the band/median shape in the Visus/CRT chart changes. For a patient in no saved search only \"Alle Patienten\" is listed."
    notes: "Rewritten for Z0-P23. The panel closes on a new case view. Saved searches are materialised against activeCases (excluded cases are never members). N10 label still shows (N=n) without the unit (observed in P23, not changed)."
