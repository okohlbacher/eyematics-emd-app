# UI requirements registry — area CASE. Generated 2026-10-08 by the ui-requirements-registry workflow;
# maintained by the uat-triage skill (promotion and amendment of tester-confirmed behaviour; see handoff/HANDOFF.md §4).
# Short name: "Visus/CRT chart" in titles/statements means the case-page card headed "Visusverlauf und Netzhautdicke (CRT)" (its real heading, used in steps/expect).
area: CASE
requirements:
  - id: UIR-CASE-001
    title: "Open case from Kohortenbildung Detailansicht row"
    statement: "The user can open a case detail page by clicking a row in the \"Detailansicht\" table on Kohortenbildung; the URL becomes /case/<id> and \"Zurück\" returns to the cohort page."
    status: implemented
    sources: ["spec: EMDREQ-FALL-001 / N05.03"]
    evidence:
      - "src/pages/CohortBuilderPage.tsx:1078-1081 (<tr onClick={() => navigate(`/case/${c.id}`)}>)"
      - "src/App.tsx:58 (<Route path=\"/case/:caseId\">)"
      - "src/pages/CaseDetailPage.tsx:216-221 (Zurück button → navigate(-1))"
      - "src/i18n/translations.ts:207 (detailedView: 'Detailansicht'), :5 (back: 'Zurück')"
    tests: []
    browser:
      route: "/cohort"
      steps:
        - "Log in and open Kohortenbildung (/cohort)."
        - "Switch the result view to \"Detailansicht\"."
        - "Click any row of the table (note its Pseudonym)."
        - "On the case page click \"Zurück\"."
      expect: "Step 3: URL changes to /case/<id> and the header h1 shows the same pseudonym. Step 4: the browser returns to /cohort with the Detailansicht still shown."
    notes: "\"Zurück\" is navigate(-1) (history back), so it returns to whatever page opened the case. No test renders the row click or the route."
  - id: UIR-CASE-002
    title: "Open case from Datenqualität detail panel"
    statement: "The user can open the full case page from the Datenqualität detail panel via \"Vollständige Fallansicht\"."
    status: implemented
    sources: ["spec: EMDREQ-FALL-001 / N03.07"]
    evidence:
      - "src/components/quality/QualityCaseDetail.tsx:363-374 (button t('fullCaseView') in the header row next to the pseudonym, tooltip fullCaseViewHint → onNavigateToCase; Z0-P14)"
      - "src/pages/QualityPage.tsx:461 (onNavigateToCase={(id) => navigate(`/case/${id}`)})"
      - "src/i18n/translations.ts:326 (fullCaseView: 'Vollständige Fallansicht')"
    tests: []
    browser:
      route: "/quality"
      steps:
        - "Open Datenqualität (/quality)."
        - "Click a case in the case list so the detail panel opens; note its Pseudonym."
        - "Click the button \"Vollständige Fallansicht\" in the header row next to the pseudonym."
      expect: "URL becomes /case/<id> and the case page header shows the same pseudonym."
    notes: "Since Z0-P14 (6ae8cf9, C10/Q13) the single control sits as a button in the header row next to the pseudonym (moved, not duplicated; AT-QUAL-006-01 unchanged); hover/focus tooltip 'Einzelfallansicht mit Verläufen und Vergleich mit einer Kohorte öffnen'. tests/acceptance/Z0/Z0-P14.spec.ts asserts position, tooltip and navigation."
  - id: UIR-CASE-003
    title: "Unknown case id shows not-found message"
    statement: "The case page shows \"Fall nicht gefunden.\" with a \"Zurück\" button for an unknown or inaccessible case id, without crashing."
    status: implemented
    sources: ["spec: EMDREQ-FALL-001 / N05.03"]
    evidence:
      - "src/pages/CaseDetailPage.tsx:77 (cases.find by caseId)"
      - "src/pages/CaseDetailPage.tsx:203-212 (early return with t('caseNotFound') + t('back') button)"
      - "src/i18n/translations.ts:245 (caseNotFound: 'Fall nicht gefunden.')"
    tests: []
    browser:
      route: "/case/does-not-exist"
      steps:
        - "While logged in, open /case/does-not-exist directly in the address bar."
        - "Observe the page."
        - "Click \"Zurück\"."
      expect: "Text \"Fall nicht gefunden.\" and a \"Zurück\" link-button are shown; no error boundary / blank page; \"Zurück\" navigates back in history."
    notes: "When the page was opened directly (no history entry) navigate(-1) may leave the page unchanged; open it from an in-app page first to see the back navigation."
  - id: UIR-CASE-004
    title: "Patient header fields and Zurück button"
    statement: "The case page shows a \"Zurück\" button and a patient header with the pseudonym as heading under a small caption \"Pseudonym\" (Z0-P09, Q35 a), age (\"Alter: N Jahre\"), gender, centre, eye badge (OD/OS) and contact count (\"N Kontakte\")."
    status: implemented
    sources: ["spec: EMDREQ-FALL-002 / N05.01", "code: src/pages/CaseDetailPage.tsx:216-254; src/components/case-detail/PatientHeader.tsx:152-184", "manual: Benutzerhandbuch §6.1"]
    evidence:
      - "src/pages/CaseDetailPage.tsx:216-221 (Zurück), 224-254 (PatientHeader props)"
      - "src/components/case-detail/PatientHeader.tsx:172-177 (caption t('pseudonym') 'Pseudonym' above the h1 pseudonym, Z0-P09); 160-190 ( '{t('age')}: {getAge(birthDate)} {t('years')}'; t('female')/t('male'); centerName; eye badge t('rightEye')/t('leftEye'); '{totalEncounters} {t('contacts')}')"
      - "src/i18n/translations.ts:34-44 (female 'Weiblich', male 'Männlich', age 'Alter', years 'Jahre', contacts 'Kontakte'), :271-272 (rightEye 'Rechtes Auge (OD)', leftEye 'Linkes Auge (OS)')"
      - "src/hooks/useCaseData.ts:517-518 (totalEncounters = observations + procedures), :227 (eyeLaterality from the first visus observation's bodySite)"
    tests: []
    browser:
      route: "/case/pat-uka-003"
      steps:
        - "Open /cohort, switch to \"Detailansicht\", click any row (or open /case/pat-uka-003 directly)."
        - "Inspect the top white card."
      expect: "A \"Zurück\" button sits above the card; the card shows the caption \"Pseudonym\" and below it the pseudonym (EM-UKA-0003 for pat-uka-003) as heading, \"Alter: N Jahre\", 'Weiblich' or 'Männlich', the centre name, a badge \"Rechtes Auge (OD)\" or \"Linkes Auge (OS)\", and a badge \"N Kontakte\"."
    notes: "The eye badge is shown only when the first visus observation carries a body site. 'N Kontakte' counts observations + procedures, not encounters. The previously cited test 'calculates age from birthDate' (tests/ui-requirements.test.ts:276) exercises a local copy of getAge, not the component or fhirLoader — mapping removed."
  - id: UIR-CASE-005
    title: "No identifying data anywhere on the case page"
    statement: "The case page displays no patient name, birth date or other identifying data anywhere; only the pseudonym identifies the patient."
    status: implemented
    sources: ["spec: EMDREQ-FALL-002 / N05.01 (Abgleich: Abweichend)"]
    evidence:
      - "src/components/case-detail/PatientHeader.tsx:160-166 (only pseudonym rendered; birthDate used solely via getAge())"
      - "src/pages/CaseDetailPage.tsx:224-254 (no name field passed; birthDate only for age)"
      - "src/components/quality/QualityCaseDetail.tsx:359,373 (Datenqualität panel likewise shows pseudonym + age only)"
    tests: []
    browser:
      route: "/case/pat-uka-003"
      steps:
        - "Open any case page."
        - "Use the browser find (Ctrl/Cmd+F) for a date in the past that could be a birth date (e.g. '19' followed by two digits and a dot) and scan the header and all cards."
        - "Check the OCT caption, medication, anamnesis and findings cards."
      expect: "Only the pseudonym (e.g. EM-UKA-0003) identifies the patient; no name, no birth date (only \"Alter: N Jahre\") appears anywhere."
    notes: "The previously cited test 'case uses pseudonym, never real patient name' (tests/ui-requirements.test.ts:225) only inspects a hand-built mock object and never renders the page — mapping removed; there is no render-level assertion."
  - id: UIR-CASE-006
    title: "Diagnosis pills with short label and full-term tooltip"
    statement: "The patient header shows primary diagnoses as purple pills with a short label (short name for SNOMED, raw ICD-10 code otherwise) and a hover tooltip with the written-out diagnosis and code."
    status: implemented
    sources: ["code: src/components/case-detail/PatientHeader.tsx:87-119,272-281", "manual: Benutzerhandbuch §6.1, §14"]
    evidence:
      - "src/components/case-detail/PatientHeader.tsx:87-119 (DiagnosisPill: useDiagnosisDisplay → label + title={fullText}, cursor-help; optional (OD)/(OS) and 'seit <Datum>')"
      - "src/components/case-detail/PatientHeader.tsx:272-281 (primaryDiagnoses.map → DiagnosisPill)"
      - "src/services/terminology.ts:41-154 (seed map: SNOMED 267718000 → label 'AMD'; 312903003 → 'Diabetisches Makulaödem (DMÖ)'; ICD-10 codes keep the raw code as label, e.g. 'E11.9')"
      - "src/hooks/useCaseData.ts:217-220 (primaryDiagnoses = conditions without category)"
    tests:
      - file: tests/terminology.test.ts
        name: "SNOMED 312903003 — DME (label + fullText, de + en)"
    browser:
      route: "/case/pat-uka-003"
      steps:
        - "Open /case/pat-uka-003 (primary diagnosis SNOMED 267718000, AMD)."
        - "In the header, hover the purple diagnosis pill for about one second."
      expect: "The pill reads 'AMD seit 12.11.2023' (short label, no raw SNOMED code); the native tooltip shows the written-out term with the code, e.g. 'Altersbedingte Makuladegeneration (267718000)'. On a DMÖ case the pill reads 'Diabetisches Makulaödem (DMÖ)'."
    notes: "Statement corrected: the pill does NOT always show an ICD-10 code — SNOMED diagnoses show a short clinical name and only ICD-10 conditions show the bare code. The terminology test covers the label/fullText resolver, not the pill DOM."
  - id: UIR-CASE-007
    title: "Behandlungsindikation in header"
    statement: "The patient header shows a teal pill \"Behandlungsindikation: <text>\" for a case whose first injection carries a reason code, and no such pill otherwise."
    status: implemented
    sources: ["spec: EMDREQ-FALL-004 / N05.13", "manual: Benutzerhandbuch §6.1", "code: src/components/case-detail/PatientHeader.tsx:282-287"]
    evidence:
      - "src/components/case-detail/PatientHeader.tsx:282-287 ({treatmentIndication && ... t('treatmentIndication')}: {treatmentIndication})"
      - "src/hooks/useCaseData.ts:222-225 (treatmentIndication = injections[0].reasonCode[0].coding[0].display, translated)"
      - "src/pages/CaseDetailPage.tsx:125,232"
      - "src/i18n/translations.ts:289 (treatmentIndication: 'Behandlungsindikation')"
    tests: []
    browser:
      route: "/case/:caseId"
      steps:
        - "Open a case from /cohort Detailansicht."
        - "Look at the pill row under the pseudonym/age line in the header."
