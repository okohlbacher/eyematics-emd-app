  - id: UIR-DEPLOY-004
    title: "/healthz answers 200 without login or audit row"
    statement: "The production server answers GET /healthz with 200 {\"status\":\"ok\"} outside /api, without a JWT and without writing an audit row."
    status: implemented
    sources: ["uat: v1.20 Phase 1 (.planning/v1.20-ROADMAP.md:8)", "code: server/index.ts:209-213", "manual: docs/Deployment.md:29,39"]
    evidence:
      - "server/index.ts:209-213 (app.get('/healthz') mounted before cookieParser/audit/auth)"
      - "server/index.ts:240-243 (auditMiddleware and authMiddleware are mounted on '/api' only)"
      - "deploy/healthcheck.mjs:3 (probe fetches http://127.0.0.1:3000/healthz)"
      - "deploy/EMD.container:23-26 (HealthCmd + Notify=healthy)"
      - "Containerfile:45 (HEALTHCHECK for Docker)"
      - "scripts/container-smoke.sh:30,40 (wait_healthy polls /healthz)"
    tests:
      - file: tests/auditMiddleware.test.ts
        name: "skips non-/api/ requests"
    browser:
      route: "/healthz"
      steps:
        - "While logged out, open http://<host>:3000/healthz in the browser (or curl -i)."
        - "Log in as admin and open \"Protokoll\" in the sidebar; look at the newest rows."
        - "On the host run: podman ps (or docker ps)."
      expect: "The response is HTTP 200 with body {\"status\":\"ok\"}; Protokoll shows no row with path /healthz; the container shows status healthy."
    notes: "The cited audit test proves the middleware ignores non-/api paths generally (it uses /index.html); no test targets /healthz itself."
  - id: UIR-DEPLOY-005
