      expect: "Verwaltung lists 7 users (admin, forscher1, forscher2, epidemiologe, kliniker, diz_manager, klinikleitung); Startseite shows 6 centre cards; ~/EMD contains users.json, centers.json, settings.yaml, jwt-secret.txt, audit.db and feedback/."
