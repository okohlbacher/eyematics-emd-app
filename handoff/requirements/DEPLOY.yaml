        - "Enter \"Benutzername\" admin and \"Passwort\", click \"Anmelden\"."
        - "Watch the Network tab for /api/auth/login and /api/fhir/centers."
      expect: "The login page loads, login succeeds and the Startseite shows centre cards; all requests go to http://<host>:3000/...; the console shows no CORS error."
