  - id: UIR-DEPLOY-011
    title: "Refresh cookie is httpOnly/Strict with single-flight refresh"
    statement: "The refresh token is an httpOnly SameSite=strict cookie scoped to /api/auth/refresh, the emd-csrf cookie is readable for double-submit, and a 401 triggers one refresh before redirecting to /login."
    status: implemented
    sources: ["code: server/auth/authHelpers.ts:141-154; src/services/authHeaders.ts:43-47,104-131"]
    evidence:
      - "server/auth/authHelpers.ts:141-154 (emd-refresh: httpOnly true, sameSite strict, path /api/auth/refresh; emd-csrf: httpOnly false, path /)"
      - "src/services/authHeaders.ts:43-47 (getCsrfFromCookie reads emd-csrf from document.cookie)"
      - "src/services/authHeaders.ts:104-124 (refreshAccessToken single-flight via refreshPromise; X-CSRF-Token header)"
      - "src/services/authHeaders.ts:127-131 (handleAuthFailure clears the token and redirects to /login)"
      - "server/index.ts:217 (cookieParser mounted before auth)"
    tests:
      - file: tests/authRefresh.test.ts
        name: "sets emd-refresh (HttpOnly, SameSite=Strict, Path=/api/auth/refresh) AND emd-csrf"
      - file: tests/authFetchRefresh.test.ts
        name: "Test 1 — silently refreshes on 401 and retries original request once"
      - file: tests/authFetchRefresh.test.ts
        name: "Test 2 — single-flight: 5 concurrent 401s trigger ONLY 1 refresh call"
      - file: tests/authFetchRefresh.test.ts
        name: "Test 4 — refresh failure: refresh 401 → no retry, falls through to logout"
      - file: tests/authFetchRefreshSuite.test.ts
        name: "UAT-AUTO-01: silent refresh — 401 triggers refresh and retries original request once"
    browser:
      route: "/"
      steps:
        - "Log in at http://<host>:3000/login, then open DevTools → Application → Cookies → http://<host>:3000."
        - "Inspect emd-refresh and emd-csrf."
        - "In DevTools → Application → Session Storage, set emd-token to an invalid value (e.g. append x), then click \"Startseite\" in the sidebar and watch Network."
      expect: "emd-refresh has HttpOnly ✓, SameSite Strict, Path /api/auth/refresh; emd-csrf has HttpOnly ✗ and Path /; after the invalid token exactly one POST /api/auth/refresh (200) appears, the page keeps working and no redirect to /login happens."
    notes: ""
  - id: UIR-DEPLOY-012
    title: "Session survives >10 min active use over plain HTTP"
    statement: "The deployed UI keeps a user logged in through active use beyond 10 minutes on a plain-HTTP host when auth.refreshCookieSecure is false (the container default)."
    status: implemented
    sources: ["uat: v1.20 Phases 2–3 (refresh cookie not Secure by default)", "manual: docs/Deployment.md:71,124"]
    evidence:
      - "deploy/settings.yaml:42-44 (refreshTokenTtlMs 8h rolling, refreshAbsoluteCapMs 12h, refreshCookieSecure: false)"
      - "server/auth/authHelpers.ts:141-154 (secure: settings.refreshCookieSecure on both cookies)"
      - "src/services/authHeaders.ts:104-124 (silent refresh on 401 keeps the access token fresh)"
      - "src/context/AuthContext.tsx:228-231 (mouse/keyboard activity resets the 10-min idle timer)"
      - "docs/Deployment.md:71,124"
    tests:
      - file: tests/deploySettings.test.ts
        name: "carries exactly the container-specific values"
      - file: tests/sessionRotation.test.ts
        name: "rolling rotation: first refresh marks old jti revoked and inserts a new row"
    browser:
      route: "/"
      steps:
        - "Confirm ~/EMD/settings.yaml has auth.refreshCookieSecure: false; open http://<host>:3000 (plain http, non-localhost) and log in."
        - "Keep using the UI for 12 minutes (switch between \"Startseite\", \"Kohortenbildung\", \"Analyse\" at least every 2 minutes)."
        - "Optionally set refreshCookieSecure: true, restart the container, log in again and repeat."
      expect: "With false: still logged in after 12 min, Network shows successful POST /api/auth/refresh calls. With true over http: the session ends at about 10 min with a redirect to /login (documented failure mode)."
    notes: "The previously cited settingsAuthSchema test 'rejects non-boolean refreshCookieSecure' was dropped: it asserts a 400 on invalid YAML, not that the session survives; the setting's wiring is proven by deploySettings + authHelpers.ts:143,150. On 127.0.0.1 (the verify container) the browser treats the origin as a secure context, so the Secure flag is honoured over plain http and only the 'false' path is observable there; the 'true' failure mode (logout at ~10 min) needs a LAN hostname — record it as BLOCKED locally unless a non-localhost host is available."
