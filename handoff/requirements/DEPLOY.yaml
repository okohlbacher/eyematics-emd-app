      - "server/index.ts:337 (app.listen(PORT, HOST))"
      - "deploy/settings.yaml:8-11 (host 0.0.0.0, port 3000, serveFrontend: true)"
      - "server/index.ts:181,198 (connectSrc 'self' — the UI may only call its own origin)"
      - "deploy/EMD.container:12 (PublishPort=3000:3000)"
      - "Containerfile:42 (EXPOSE 3000)"
