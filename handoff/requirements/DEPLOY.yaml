  - id: UIR-DEPLOY-006
    title: "Plain HTTP on a LAN host loads all assets"
    statement: "The deployed UI renders over plain HTTP on a non-localhost host: asset URLs stay http (no upgrade-insecure-requests rewrite) and the page is not blank; HSTS still applies on HTTPS."
    status: implemented
    sources: ["uat: v1.20.1 (.planning/v1.20-ROADMAP.md:40ff, upgradeInsecureRequests disabled)", "manual: docs/Deployment.md:129"]
    evidence:
      - "server/index.ts:201-204 (upgradeInsecureRequests: null in the helmet CSP directives)"
      - "server/index.ts:191 (helmet() defaults keep Strict-Transport-Security, which browsers only honour over HTTPS)"
      - "scripts/container-smoke.sh:54-55 (CSP has no upgrade-insecure-requests check)"
      - "docs/Deployment.md:129"
    tests: []
    browser:
      route: "/login"
      steps:
        - "Open http://<lan-ip>:3000/login (not localhost) in a browser; open DevTools → Network."
        - "Run on the host: curl -sI http://<lan-ip>:3000/ | grep -i content-security-policy"
      expect: "The login page renders (not blank); every asset request in Network is http://<lan-ip>:3000/assets/...; the CSP header contains no upgrade-insecure-requests."
    notes: ""
  - id: UIR-DEPLOY-007
    title: "Production CSP header is strict and inline-script free"
    statement: "The production server sends a CSP with script-src 'self' (no inline/eval), style-src self + unsafe-inline, img-src self data: blob:, frame-ancestors self and no upgrade-insecure-requests."
    status: implemented
    sources: ["code: server/index.ts:191-208"]
    evidence:
      - "server/index.ts:191-208 (helmet contentSecurityPolicy: defaultSrc/scriptSrc 'self', styleSrc 'self' 'unsafe-inline', imgSrc 'self' data: blob:, connectSrc, frameAncestors 'self', baseUri 'self', upgradeInsecureRequests null)"
      - "server/index.ts:181-188 (connect-src gains the Keycloak issuer origin only when provider=keycloak)"
      - "scripts/container-smoke.sh:50-55 (no inline <script>, strict Plotly chunk, no upgrade-insecure-requests)"
    tests: []
    browser:
      route: "/"
      steps:
        - "Run: curl -sI http://<host>:3000/ | grep -i content-security-policy"
        - "Open http://<host>:3000, log in, open DevTools → Console."
      expect: "The header contains script-src 'self' (no 'unsafe-inline'/'unsafe-eval'), style-src 'self' 'unsafe-inline', img-src 'self' data: blob:, frame-ancestors 'self' and no upgrade-insecure-requests; the app loads with zero CSP violation messages."
    notes: "CSP is only active via the Express server (production/container); Vite dev sends no CSP."
  - id: UIR-DEPLOY-008
    title: "index.html has no inline script; theme via /theme-init.js"
    statement: "The production index.html contains no inline script; the theme is initialised from an external /theme-init.js and no stored theme counts as 'System'."
    status: implemented
    sources: ["uat: v1.20.1 (FOUC fix)", "manual: .planning/v1.20-ROADMAP.md:45 (FOUC script moved to public/theme-init.js)"]
    evidence:
      - "index.html:8-9,13 (only <script src=\"/theme-init.js\"> and the module entry; no inline body)"
      - "public/theme-init.js:4-9 (reads localStorage 'emd-theme'; null or 'system' → follows prefers-color-scheme)"
      - "src/context/ThemeContext.tsx:19-29 (STORAGE_KEY 'emd-theme'; missing/invalid value → 'system')"
      - "dist/index.html (built output: both <script> tags carry src=)"
      - "scripts/container-smoke.sh:50-51 (no inline <script> check against the running container)"
      - "src/components/Layout.tsx:121 + src/i18n/translations.ts:1032,1035 (ThemeToggle in the sidebar footer, button \"Design\", option \"System\")"
