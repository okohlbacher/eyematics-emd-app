      expect: "Every <script> tag has a src attribute (no inline script body); /theme-init.js is requested with status 200; the theme menu shows \"System\" as the checked option; the console shows 0 CSP violations."
    notes: "The cited test covers the 'System' default; no test inspects index.html for inline scripts (container-smoke.sh does)."
