# UI requirements registry — area DEPLOY. Generated 2026-10-08 by the ui-requirements-registry workflow;
# maintained by the uat-triage skill (promotion and amendment of tester-confirmed behaviour; see handoff/HANDOFF.md §4).
area: DEPLOY
requirements:
  - id: UIR-DEPLOY-001
    title: "Published image is public and multi-arch"
    statement: "The published image ghcr.io/okohlbacher/eyematics-emd-app:<version> is pullable anonymously for linux/amd64 and linux/arm64 and carries the same version tag as the app."
    status: implemented
    when: release
    sources: ["uat: v1.20 Phase 4–5 (.planning/v1.20-ROADMAP.md:25)", "code: .github/workflows/container.yml"]
    evidence:
      - ".github/workflows/container.yml:27-34 (docker/metadata-action: tag = version from the v* git tag + latest)"
      - ".github/workflows/container.yml:35-42 (docker/build-push-action platforms linux/amd64,linux/arm64; push only on refs/tags/)"
      - ".github/workflows/container.yml:20 (docker/setup-qemu-action for the arm64 leg)"
      - "Containerfile:7-21 (SPA built on $BUILDPLATFORM, per-arch runtime deps for better-sqlite3)"
      - "scripts/container-smoke.sh:7-8,29,32-36 (IMAGE=ghcr.io/… and PLATFORM=linux/amd64 modes exercise a published image per arch)"
      - "package.json:4 (version 1.20.2 — the image tag is derived from the git tag, so tag == package.json version is a release-process convention, not enforced in code)"
    tests: []
    browser:
      route: "/"
      steps:
        - "Without any GHCR login, from a shell: T=$(curl -s 'https://ghcr.io/token?scope=repository:okohlbacher/eyematics-emd-app:pull' | jq -r .token); test -n \"$T\" && echo token-ok"
        - "Run: H1=\"Authorization: Bearer $T\"; H2='Accept: application/vnd.oci.image.index.v1+json'; U=https://ghcr.io/v2/okohlbacher/eyematics-emd-app/manifests/<version>; curl -s -o /dev/null -w '%{http_code}\\n' -H \"$H1\" -H \"$H2\" $U; curl -s -H \"$H1\" -H \"$H2\" $U | jq '{mediaType, platforms: [.manifests[].platform]}' (manifest only — no layer download, no login state involved)."
        - "Run the published image on the spot-check port: docker run -d --name emd-release -p 127.0.0.1:3312:3000 -v emd-release-vol:/data ghcr.io/okohlbacher/eyematics-emd-app:<version>; until curl -fsS http://127.0.0.1:3312/healthz >/dev/null; do sleep 0.5; done"
        - "Open http://127.0.0.1:3312, log in, click the amber \"Problem melden\" tab at the right edge of the page; wait until role=dialog \"Problem melden\" exists (≥ 2 s) and read its \"Version\" line."
      expect: "Step 1 prints token-ok without credentials; step 2 answers HTTP 200 with an OCI image index (mediaType application/vnd.oci.image.index.v1+json) whose platforms include linux/amd64 and linux/arm64; the dialog's \"Version\" line reads v<version>, the same as the image tag."
    notes: "Public visibility of the GHCR package is a registry setting (.planning/v1.20-ROADMAP.md:4,25) not expressible in repo code; CI only proves multi-arch build/push. \"Problem melden\" is a right-edge tab (src/components/Layout.tsx:157), not a sidebar entry. when: release — the tag exists only after /uat-release pushes it, so the verify pass skips this entry pre-release (N/A) and uat-release §2 runs it on the published image (127.0.0.1:3312). The anonymous token + manifest GET replaces the former double pull (podman is not installed here, HANDOFF §7; docker pull of the tag works without login too). Clean up: docker rm -f emd-release; docker volume rm emd-release-vol."
  - id: UIR-DEPLOY-002
    title: "Container runs with no environment variables"
    statement: "The deployed container runs with no operator-supplied environment variables; all UI-visible configuration (e.g. auth.inactivityTimeoutMs, warningBeforeMs) comes from settings.yaml on the volume."
    status: implemented
    sources: ["manual: docs/Deployment.md:43 (keine EnvironmentFile); docs/Konfiguration.md", "code: deploy/settings.yaml:48-49; src/context/AuthContext.tsx:200-214"]
    evidence:
      - "deploy/EMD.container:7-28 (no EnvironmentFile=/Environment= lines; comment at :28 states it explicitly)"
      - "deploy/entrypoint.sh:11-12 (seeds /data/settings.yaml from the image copy; exec node with no env)"
      - "Containerfile:28,38-40 (only ENV is the image's own NODE_ENV=production; config/settings.yaml is a symlink to /data/settings.yaml)"
      - "server/index.ts:61-86 (all server config read from SETTINGS_FILE; grep process.env server/ finds nothing)"
      - "server/constants.ts:104 (SETTINGS_FILE = config/settings.yaml)"
      - "deploy/settings.yaml:48-49 (inactivityTimeoutMs / warningBeforeMs on the volume)"
      - "src/context/AuthContext.tsx:207-214 (idle timer takes s.auth.inactivityTimeoutMs / warningBeforeMs from settingsService.loadSettings())"
      - "docs/Deployment.md:43"
    tests:
      - file: tests/deploySettings.test.ts
        name: "carries exactly the container-specific values"
    browser:
      route: "/"
      steps:
        - "On the host, confirm: grep -i environment ~/.config/containers/systemd/EMD.container prints no EnvironmentFile=/Environment= line."
        - "Edit ~/EMD/settings.yaml: set auth.inactivityTimeoutMs: 60000 and auth.warningBeforeMs: 30000; run systemctl --user restart EMD."
        - "Open http://<host>:3000, log in (e.g. admin), then do not touch mouse or keyboard."
      expect: "After about 30 s an inactivity warning with a countdown appears; after 60 s the UI logs out and shows the login page."
    notes: "Statement sharpened to 'no operator-supplied environment variables': the image itself bakes ENV NODE_ENV=production (Containerfile:28). The previously cited settingsApi test 'auth.* operational params…' was dropped: it only asserts otpCode/maxLoginAttempts are stripped for non-admins (its mocked settings carry no auth sub-keys), so it does not prove inactivityTimeoutMs reaches the client."
  - id: UIR-DEPLOY-003
