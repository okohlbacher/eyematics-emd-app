    statement: "The deployed container on an empty volume seeds the 7 default users, 6 centres, settings.yaml and feedback/ so Verwaltung and Startseite are populated after first login."
    status: implemented
    sources: ["manual: docs/Deployment.md:45-56 (Erster Start)", "code: Containerfile:38-40; deploy/entrypoint.sh:5,11; deploy/settings.yaml:10"]
    evidence:
      - "deploy/entrypoint.sh:5,11 (mkdir -p /data/feedback; cp deploy/settings.yaml → /data/settings.yaml when absent)"
      - "server/index.ts:105-119 (writes users.json with 7 default users when missing)"
      - "server/constants.ts:30-52 (initCenters loads data/centers.json or writes the default 6-centre file)"
      - "server/index.ts:92-97,122,125,147-148,160 (DATA_DIR = /data from server.dataDir; initCenters, initAuth, audit.db, data.db, sessions.db created there)"
      - "Containerfile:38-40 (config/settings.yaml → /data/settings.yaml, feedback → /data/feedback symlinks)"
      - "deploy/settings.yaml:10 (dataDir: /data)"
      - "scripts/container-smoke.sh:46-47,60-62 (6 centers via /api/fhir/centers; volume seeded check)"
      - "src/i18n/translations.ts:50,403 (navHome \"Startseite\", navAdmin \"Verwaltung\")"
    tests: []
    browser:
      route: "/admin"
      steps:
        - "Stop the container and empty the volume: rm -rf ~/EMD/* ; systemctl --user start EMD."
        - "Open http://<host>:3000/login, sign in as admin / changeme2025! (\"Anmelden\")."
        - "Click \"Verwaltung\" in the sidebar and count the user rows."
        - "Click \"Startseite\" and count the centre cards."
