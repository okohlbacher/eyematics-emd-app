    status: implemented
    sources: ["uat: v1.12 QUAL-024 / Q-42 (tester confirmed in v1.13: works in Analyse)", "code: src/pages/AnalysisPage.tsx:188-215,351-359; src/components/common/CenterMultiSelect.tsx:52-96"]
    evidence:
      - "src/pages/AnalysisPage.tsx:188-193 — centerOptions = sorted distinct centerName of activeCases"
      - "src/pages/AnalysisPage.tsx:195-215 — selectedCenters state; centeredCohort / centeredCrossCohorts narrowing"
      - "src/pages/AnalysisPage.tsx:229-302 — centerDist, diagDist, visusTrend, crtDistribution, ageVisusScatter, medianVisus all derive from centeredCohort"
      - "src/pages/AnalysisPage.tsx:351-359 — chip row rendered only when centerOptions.length > 1 (data-testid analysis-center-filter)"
      - "src/components/common/CenterMultiSelect.tsx:54-76 — heading t('qualityFilterCenter') (CSS uppercase), count badge when selected.length > 0, 'Alle Zentren' text or 'Zurücksetzen' button"
      - "src/components/common/CenterMultiSelect.tsx:77-95 — one toggle button per centre name"
      - "src/i18n/translations.ts:541,547-548 — qualityFilterCenter 'Zentrum'; qualityFilterCentersAll 'Alle Zentren'; qualityFilterCentersClear 'Zurücksetzen'"
    tests:
      - file: tests/AnalysisPage.test.tsx
        name: "renders center filter widget when activeCases span multiple centers"
      - file: tests/AnalysisPage.test.tsx
        name: "does not render center filter widget when all activeCases share one center"
      - file: tests/AnalysisPage.test.tsx
        name: "client-side narrowing: clicking a center button narrows visible case count"
      - file: tests/CenterMultiSelect.test.tsx
        name: "shows count indicator when more than zero centers are selected"
      - file: tests/CenterMultiSelect.test.tsx
