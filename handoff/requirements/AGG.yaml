# UI requirements registry — area AGG. Generated 2026-10-08 by the ui-requirements-registry workflow;
# maintained by the uat-triage skill (promotion and amendment of tester-confirmed behaviour; see handoff/HANDOFF.md §4).
area: AGG
requirements:
  - id: UIR-AGG-001
    title: "Analyse page reachable with Aggregiert/Verläufe tabs"
    statement: "The Analyse page is reachable via the \"Analyse\" sidebar entry and shows a tablist with \"Aggregiert\" and \"Verläufe\"; \"Aggregiert\" is selected by default."
    status: implemented
    sources: ["manual: docs/Benutzerhandbuch.md §5", "code: src/pages/AnalysisPage.tsx:57-88,362-369"]
    evidence:
      - "src/App.tsx:57 — <Route path=\"/analysis\" element={<AnalysisPage />}>"
      - "src/components/Layout.tsx:17-23 — research nav array contains '/analysis' labelled t('navAnalysis') for every role"
      - "src/pages/AnalysisPage.tsx:57-61,73-77 — isAnalysisTab guard; tab falls back to 'aggregate' when ?tab= is absent or invalid"
      - "src/pages/AnalysisPage.tsx:311-330 — tabButton renders <button role=\"tab\" aria-selected={active}>"
      - "src/pages/AnalysisPage.tsx:362-369 — <div role=\"tablist\" aria-label={t('analysisTitle')}> with the two tabs"
      - "src/i18n/translations.ts:52,216-218 — navAnalysis 'Analyse'; analysisTitle 'Kohortenanalyse'; analysisTabAggregate 'Aggregiert'; analysisTabTrajectories 'Verläufe'"
    tests:
      - file: tests/AnalysisPage.test.tsx
        name: "single-cohort: renders aggregate tab without cross-mode elements"
    browser:
      route: "/analysis"
      steps:
        - "Log in as admin and click \"Analyse\" in the left sidebar."
        - "Read the page heading \"Kohortenanalyse\" and the tab bar beneath the header block."
        - "Inspect the tab bar (DevTools): role=tablist with aria-label \"Kohortenanalyse\" containing two role=tab buttons \"Aggregiert\" and \"Verläufe\"."
        - "Without clicking any tab, check which tab has aria-selected=true (blue text, blue underline)."
      expect: "Both tabs \"Aggregiert\" and \"Verläufe\" are present; \"Aggregiert\" is aria-selected=true, the five single-cohort chart cards are shown and the URL carries no ?tab= param."
    notes: "The h1 is \"Kohortenanalyse\" (analysisTitle) while the sidebar entry reads \"Analyse\". The cited test only asserts that data-testid analysis-tab-aggregate renders when ?tab= is absent; it does not query the tablist or aria-selected."
  - id: UIR-AGG-002
    title: "Tab selection is driven by ?tab= URL param"
    statement: "The UI drives the Analyse tab via ?tab=: selecting \"Verläufe\" sets ?tab=trajectories, selecting \"Aggregiert\" removes the param, and an unknown value falls back to \"Aggregiert\"."
    status: implemented
    sources: ["code: src/pages/AnalysisPage.tsx:57-88"]
    evidence:
      - "src/pages/AnalysisPage.tsx:57-61 — isAnalysisTab accepts only 'aggregate' | 'trajectories'"
      - "src/pages/AnalysisPage.tsx:73-77 — tab derived from searchParams.get('tab') with 'aggregate' fallback"
      - "src/pages/AnalysisPage.tsx:79-87 — selectTab deletes 'tab' for aggregate, sets 'tab'=next otherwise; setSearchParams(sp, { replace: true })"
      - "src/pages/AnalysisPage.tsx:371-396 — tab === 'trajectories' mounts OutcomesView, otherwise the aggregate section"
    tests: []
    browser:
      route: "/analysis"
      steps:
        - "Open /analysis (no query params) while logged in."
        - "Click the \"Verläufe\" tab and read the browser address bar."
        - "Click the \"Aggregiert\" tab and read the address bar again."
        - "Manually open /analysis?tab=bogus and check which tab is selected."
      expect: "After step 2 the URL is /analysis?tab=trajectories and the trajectory panels are shown; after step 3 the URL is /analysis without ?tab= and the aggregate charts return; in step 4 \"Aggregiert\" is selected."
    notes: "No automated test covers the URL round-trip: tests/AnalysisPage.test.tsx mocks useSearchParams with a no-op setter, so selectTab is never asserted."
  - id: UIR-AGG-003
    title: "?filters= applies cohort filters to the Analyse page"
    statement: "The Analyse page opened via ?filters=<json> (e.g. from \"Kohorte analysieren\") applies those filters, dropping unknown keys, so the header case count equals the Kohortenbildung count."
    status: implemented
    sources: ["EMDREQ-ANL-001 / N02.07 (docs/Anforderungsabgleich.md: Umgesetzt)", "manual: docs/Benutzerhandbuch.md §4.4", "code: src/pages/AnalysisPage.tsx:114-119,146-153"]
    evidence:
      - "src/pages/AnalysisPage.tsx:114-119 — filters = activeSavedSearch.filters, else parseCohortFilterJson(searchParams.get('filters'))"
      - "src/pages/AnalysisPage.tsx:146-153 — cohort = applyFilters(activeCases, filters, settings-derived options)"
      - "src/pages/CohortBuilderPage.tsx:318-323 — Kohortenbildung count uses applyFilters with the same getSettings() options"
      - "src/utils/cohortFilterSerialization.ts:27-50 — safePickCohortFilter whitelist: unknown keys dropped, preset/laterality literal-restricted"
      - "src/utils/cohortFilterSerialization.ts:56-63 — parseCohortFilterJson returns {} on malformed JSON"
      - "src/pages/CohortBuilderPage.tsx:991-999 — \"Kohorte analysieren\" button navigates to /analysis?filters=<JSON.stringify(filters)>"
      - "src/pages/AnalysisPage.tsx:341-342 — header count = centeredCohort.length"
      - "src/i18n/translations.ts:203 — analyzeCohort 'Kohorte analysieren'"
    tests: []
    browser:
      route: "/analysis?filters={\"gender\":[\"female\"]}"
      steps:
        - "Open \"Kohortenbildung\", under \"Geschlecht\" select \"Weiblich\" and note the case count shown in the results header."
        - "Click \"Kohorte analysieren\"."
        - "Read the address bar and the Analyse header line ending in \"Fälle in der aktuellen Kohorte\"."
        - "Separately open /analysis?filters={\"gender\":[\"female\"],\"__proto__\":{\"x\":1},\"foo\":1} and read the same header line."
      expect: "After step 2 the URL contains ?filters=%7B%22gender%22… and the Analyse case count equals the Kohortenbildung count from step 1; in step 4 the count is identical (unknown keys ignored) and no error is shown."
    notes: "tests/AnalysisPage.test.tsx stubs applyFilters to return all cases, so no test asserts the count equals the filtered cohort; the invalid-JSON test only checks that the derived name renders without crashing. The safePickCohortFilter whitelist is exercised in tests/qualityFlaggedCohortRoundTrip.test.tsx (flaggedCaseIds Set reconstruction), not for the ?filters= path."
  - id: UIR-AGG-004
    title: "Derived cohort name shown for ?filters= cohorts"
    statement: "The Analyse page opened via ?filters= shows a blue line \"Aktive Kohorte: Gefilterte Kohorte · <filter summary>\" under the title (summary capped at 80 characters); an optional ?name= replaces the cohort name with the supplied name. Without a cohort or filter the line reads \"Aktive Kohorte: Alle Patienten\" (amended per Z0 C4 after Z0-P17)."
    status: implemented
    sources: ["uat: v1.12 ANL-012", "code: src/pages/AnalysisPage.tsx:121-144,336-340"]
    evidence:
      - "src/pages/AnalysisPage.tsx:128-144 — displayCohortName: saved name → ?name= override → t('analysisFilteredCohort') + ' · ' + summarizeCohortFilter, sliced to 79 chars + '…'"
      - "src/pages/AnalysisPage.tsx:336-340 — blue <p> under the h1 rendered when displayCohortName !== null"
      - "src/utils/cohortFilterSerialization.ts:77-122 — summarizeCohortFilter: fixed field order, German literals, flaggedCaseIds as count only"
      - "src/i18n/translations.ts:1005 — analysisFilteredCohort 'Gefilterte Kohorte'"
    tests:
      - file: tests/AnalysisPage.test.tsx
        name: "?filters= without ?name=: header shows \"Filtered cohort\" (English locale)"
      - file: tests/AnalysisPage.test.tsx
        name: "?filters= with ?name=: header shows the supplied name"
      - file: tests/AnalysisPage.test.tsx
        name: "no ?cohort= and no ?filters=: no cohort name line rendered"
      - file: tests/AnalysisPage.test.tsx
        name: "returns summary for diagnosis + ageRange separated by ·"
      - file: tests/AnalysisPage.test.tsx
        name: "summarizes flaggedCaseIds as count only, not raw ids"
    browser:
      route: "/analysis?filters={\"gender\":[\"female\"],\"ageRange\":[60,80]}"
      steps:
        - "Open the route above while logged in."
        - "Read the blue line directly below the \"Kohortenanalyse\" heading."
        - "Open /analysis?filters={\"gender\":[\"female\"]}&name=Meine%20Kohorte and read the same line."
        - "Open /analysis (no params) and read the same line."
      expect: "Step 2 shows \"Aktive Kohorte: Gefilterte Kohorte · Geschlecht: female · Alter 60–80\"; step 3 shows \"Aktive Kohorte: Meine Kohorte\"; step 4 shows \"Aktive Kohorte: Alle Patienten\". A summary longer than 80 characters ends with \"…\"."
    notes: "The summary literals (\"Geschlecht:\", \"Alter\", \"Diagnose:\") stay German under the EN language switch and filter values are echoed raw (e.g. \"female\"). The last two cited tests are summarizeCohortFilter unit tests living in tests/AnalysisPage.test.tsx."
  - id: UIR-AGG-005
    title: "?cohort=<savedId> resolves saved search and shows its name"
    statement: "The Analyse page opened via ?cohort=<savedId> (e.g. via the \"Outcomes anzeigen\" icon of a saved search) applies the saved filters and shows the saved cohort name under the page title."
    status: implemented
    sources: ["uat: v1.10 A-04 / KOH-005", "code: src/pages/AnalysisPage.tsx:96-119,128-130"]
    evidence:
      - "src/pages/AnalysisPage.tsx:97-101 — activeSavedSearch = savedSearches.find(s.id === ?cohort)"
      - "src/pages/AnalysisPage.tsx:114-117 — filters = activeSavedSearch.filters when resolved"
      - "src/pages/AnalysisPage.tsx:130,336-340 — displayCohortName = activeSavedSearch.name rendered under the h1"
      - "src/pages/CohortBuilderPage.tsx:504-512 — per-saved-search icon button title/aria-label t('outcomesOpenForCohort') navigates to /analysis?tab=trajectories&cohort=<id>"
      - "src/i18n/translations.ts:142,836 — savedSearches 'Gespeicherte Suchen'; outcomesOpenForCohort 'Outcomes anzeigen'"
    tests:
      - file: tests/AnalysisPage.test.tsx
        name: "saved-search path: shows activeSavedSearch.name in header (unchanged)"
      - file: tests/cohortBuilderEntryPoints.test.tsx
        name: "per-row LineChart button navigates to /analysis?tab=trajectories&cohort=<id>"
    browser:
      route: "/analysis?cohort=<savedId>"
      steps:
        - "On \"Kohortenbildung\" set a filter (e.g. Diagnose AMD), note the case count, and save it under \"Gespeicherte Suchen\" as \"AMD-Test\"."
        - "In the saved-search row click the violet line-chart icon button titled \"Outcomes anzeigen\"."
        - "Read the address bar and the blue line under the \"Kohortenanalyse\" heading."
        - "Click the \"Aggregiert\" tab and read the \"… Fälle in der aktuellen Kohorte\" line."
      expect: "The URL contains ?tab=trajectories&cohort=<id>; the blue line reads \"AMD-Test\"; the case count equals the count noted in step 1; the name persists after switching to \"Aggregiert\"."
    notes: "The saved-search entry point is the icon button \"Outcomes anzeigen\" (no text link \"Analysieren\") and it lands on the \"Verläufe\" tab. Unknown ids leave activeSavedSearch null, so the page falls back to ?filters= (or all cases) without an error."
  - id: UIR-AGG-006
    title: "Header shows case count of current cohort"
    statement: "The Analyse header shows \"N Fälle in der aktuellen Kohorte\" where N is the case count of the current cohort after centre-chip narrowing."
    status: implemented
    sources: ["EMDREQ-ANL-001 / N02.07 (docs/Anforderungsabgleich.md: Umgesetzt)", "code: src/pages/AnalysisPage.tsx:341-348"]
    evidence:
      - "src/pages/AnalysisPage.tsx:341-342 — {centeredCohort.length} {t('casesInCohort')}"
      - "src/pages/AnalysisPage.tsx:146-153 — cohort = applyFilters(activeCases, filters, …)"
      - "src/pages/AnalysisPage.tsx:200-204 — centeredCohort = cohort narrowed by selected centre chips (empty selection = cohort)"
      - "src/i18n/translations.ts:219 — casesInCohort 'Fälle in der aktuellen Kohorte'"
    tests:
      - file: tests/AnalysisPage.test.tsx
        name: "client-side narrowing: clicking a center button narrows visible case count"
      - file: tests/AnalysisPage.test.tsx
        name: "empty center selection = all cases shown (no narrowing)"
    browser:
      route: "/analysis?cohort=<savedId>"
      steps:
        - "On \"Kohortenbildung\" apply a filter, note the displayed number of cases, and save the search."
        - "Open the saved search via the \"Outcomes anzeigen\" icon, then click \"Aggregiert\"."
        - "Read the grey line under the heading."
      expect: "The line reads \"<N> Fälle in der aktuellen Kohorte\" where N equals the Kohortenbildung count from step 1."
    notes: "German label is \"Fälle in der aktuellen Kohorte\" (EN: \"cases in current cohort\"). The cited tests assert the leading number via /^2 / and /^1 / text matches."
  - id: UIR-AGG-007
    title: "Header shows red critical-value count (CRT > 400 µm)"
    statement: "The Analyse header shows a red \"N Fälle mit kritischen Werten (CRT > 400 µm)\" segment after the case count when at least one case of the current cohort has any CRT measurement above 400 µm."
    status: implemented
    sources: ["EMDREQ-ANL-004 / N02.14 (docs/Anforderungsabgleich.md: Umgesetzt)", "manual: docs/Benutzerhandbuch.md §5.2", "code: src/pages/AnalysisPage.tsx:304-309,343-347"]
    evidence:
      - "src/pages/AnalysisPage.tsx:304-309 — criticalCount = centeredCohort cases with any LOINC_CRT observation value > 400"
      - "src/pages/AnalysisPage.tsx:343-347 — <span className=\"ml-3 text-red-600 …\"> rendered only when criticalCount > 0"
      - "src/i18n/translations.ts:220-223 — casesWithCritical 'Fälle mit kritischen Werten (CRT > 400 µm)'"
      - "scripts/generate-center-bundle.ts:209-230,521-523 — seed CRT baselines 280–650 µm (clamped 200–700), so critical cases exist in the demo data"
    tests: []
    browser:
      route: "/analysis"
      steps:
        - "Log in as admin and open \"Analyse\" (all centres, no filter)."
        - "Read the grey line under the \"Kohortenanalyse\" heading."
        - "Under the heading \"Zentrum\" click the chip \"Universitätsklinikum Aachen\" and re-read the line."
      expect: "Step 2 shows, in red after the case count, \"<N> Fälle mit kritischen Werten (CRT > 400 µm)\" with 0 < N ≤ case count; after step 3 both numbers change to the Aachen subset and the red N is still ≤ the new case count."
    notes: "The red segment is rendered inline in the same <p> as the case count, not on its own line. criticalCount checks ANY CRT observation of a case, whereas the Kohortenbildung CRT range filter checks only the LATEST CRT — so a cohort filtered to latest CRT ≤ 300 µm may still show a red count (previous step 3 of this procedure was invalid and has been replaced). tests/AnalysisPage.test.tsx stubs getObservationsByCode to [], so criticalCount is never asserted."
  - id: UIR-AGG-008
    title: "Critical count uses the CRT threshold from Einstellungen"
    statement: "The Analyse critical-value count and its label use the CRT threshold saved under \"Klinische Schwellenwerte\" in Einstellungen, so lowering the threshold increases the count after a reload."
    status: not_implemented
    sources: ["EMDREQ-ANL-004 / N02.14 (docs/Anforderungsabgleich.md: Umgesetzt — claims configurable thresholds)", "uat: v1.12 CFG-03 / Q-40-1 (no per-cohort snapshot by design)", "manual: docs/Benutzerhandbuch.md §5.2"]
    evidence:
      - "src/pages/AnalysisPage.tsx:303-308 — criticalCount compares against the literal 400 (line 306), not a settings value"
      - "src/pages/AnalysisPage.tsx:39 — only CHART_COLORS is imported from config/clinicalThresholds; CRITICAL_CRT_THRESHOLD() is unused on this page"
      - "src/config/clinicalThresholds.ts:15-17 — CRITICAL_CRT_THRESHOLD() reads getSettings().thresholds.criticalCrtUm (exists, used elsewhere)"
      - "src/hooks/useCaseData.ts:521-525; src/components/quality/QualityCaseDetail.tsx:154; src/components/case-detail/VisusCrtChart.tsx:304 — other pages DO use the configurable threshold"
      - "src/i18n/translations.ts:220-223 — label hardcodes 'CRT > 400 µm'"
      - "src/pages/SettingsPage.tsx:666-689; src/i18n/translations.ts:1149-1151 — \"Klinische Schwellenwerte\" form field \"CRT kritischer Schwellenwert (µm)\" saves thresholds.criticalCrtUm"
    tests: []
    browser:
      route: "/analysis"
      steps:
        - "Log in as admin, open \"Analyse\" and note the red \"N Fälle mit kritischen Werten (CRT > 400 µm)\" count."
        - "Open \"Einstellungen\", scroll to the card \"Klinische Schwellenwerte\", set \"CRT kritischer Schwellenwert (µm)\" to 250 and click the \"Speichern\" button at the bottom of THAT card; a green banner \"Einstellungen gespeichert\" appears at the top of the page."
        - "Reload the browser, open \"Analyse\" again and read the red count and its label."
        - "Restore the threshold to 400 afterwards."
      expect: "CURRENT BEHAVIOUR (gap): count and label \"(CRT > 400 µm)\" are unchanged after step 3. REQUIRED BEHAVIOUR: the count increases and the label reads \"(CRT > 250 µm)\"."
    notes: "Not implemented on the Analyse page: computation (literal 400 at AnalysisPage.tsx:306) and label are hardcoded although CRITICAL_CRT_THRESHOLD() is available and used by Fallansicht/Datenqualität. CFG-03 concerns server-side outcome aggregation options and Q-40-1 the no-snapshot decision — neither wires the Analyse critical count to thresholds.criticalCrtUm."
  - id: UIR-AGG-009
    title: "Centre multi-select chips narrow count and charts"
