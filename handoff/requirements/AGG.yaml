    browser:
      route: "/analysis"
      steps:
        - "Log in as admin (6 centres) and open \"Analyse\"; note the case count and that \"Verteilung über Zentren\" has 6 bars."
        - "Under the heading \"ZENTRUM\" click the chip \"Universitätsklinikum Aachen\"."
        - "Read the case count, the badge next to the heading, and the bar chart."
        - "Click \"Zurücksetzen\" at the right of the heading."
      expect: "After step 2 the count drops to the Aachen subset, the badge shows \"1\", the bar chart shows only the UKA bar and the other charts shrink accordingly; after step 4 the badge disappears, \"Alle Zentren\" is shown and the original count/charts return."
    notes: "Chip labels are full centre names (e.g. \"Universitätsklinikum Aachen\") while the bar chart uses shorthands (UKA). The heading is rendered uppercase by CSS. Chip selection is component state only — not persisted in the URL; it resets on navigation."
  - id: UIR-AGG-010
    title: "Centre chips never list unassigned centres"
    statement: "The Analyse centre chip row never lists a centre the user is not assigned to, and deselecting all chips shows all authorised centres."
    status: implemented
    sources: ["uat: v1.12 QUAL-024 / Q-42 (tester confirmed in v1.13: works in Analyse)", "code: src/pages/AnalysisPage.tsx:188-204; server/fhirApi.ts"]
    evidence:
      - "src/pages/AnalysisPage.tsx:188-193 — centerOptions derived solely from activeCases, which the server already restricted"
      - "src/pages/AnalysisPage.tsx:200-204 — empty selection → centeredCohort = cohort (all authorised cases)"
      - "src/components/common/CenterMultiSelect.tsx:6-10 — client-side narrowing only; never sends centres to the server"
      - "server/fhirApi.ts — filterBundlesByCenters applied by req.auth.centers (admin bypass only)"
      - "data/users.json — seed: forscher1 → org-uka only; epidemiologe → org-uka + org-ukc; admin/klinikleitung → all 6"
    tests:
      - file: tests/AnalysisPage.test.tsx
        name: "does not render center filter widget when all activeCases share one center"
      - file: tests/AnalysisPage.test.tsx
        name: "empty center selection = all cases shown (no narrowing)"
      - file: tests/fhirApi.test.ts
        name: "filterBundlesByCenters() with local bundles filters to user centers only"
      - file: tests/centerBypass.test.ts
        name: "non-admin never bypasses, even with all valid centers"
    browser:
      route: "/analysis"
      steps:
        - "Log in as \"epidemiologe\" (assigned Aachen + Chemnitz) and open \"Analyse\"."
        - "Read the chips under \"ZENTRUM\"."
        - "Click \"Universitätsklinikum Aachen\", then click it again to deselect; read the case count."
        - "Log out, log in as \"forscher1\" (Aachen only) and open \"Analyse\"."
      expect: "Step 2 shows exactly two chips (Aachen, Chemnitz); step 3 returns to the combined Aachen+Chemnitz count with \"Alle Zentren\" shown; step 4 shows no chip row at all (single centre) and only Aachen cases."
    notes: "Enforcement is server-side (bundles filtered by req.auth.centers); the chip list is a pure projection of the already-authorised activeCases. The two server tests cover the authorisation mechanism, not the chip row itself. With a single assigned centre the chip row is hidden entirely."
