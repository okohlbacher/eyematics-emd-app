  - id: UIR-DOCQ-009
    title: "Gesamtbewertung tooltip states 40/30/30 weighting"
    statement: "The \"Gesamtbewertung\" card weights Vollzähligkeit 40 %, Vollständigkeit 30 % and Plausibilität 30 %, and its ℹ tooltip states these weights."
    status: implemented
    sources: ["UAT v1.14 I5; confirmed v1.15", "manual: Benutzerhandbuch §8.1"]
    evidence:
      - "src/utils/qualityMetrics.ts:318-319 (overall = completeness*0.4 + dataCompleteness*0.3 + plausibility*0.3)"
      - "src/i18n/translations.ts:783-786 (tooltip text names 40 %/30 %/30 %)"
      - "src/pages/DocQualityPage.tsx:289-295 and src/components/doc-quality/CenterDetailPanel.tsx:108-114 (card wiring)"
    tests:
      - file: tests/docQualityVollzaehligkeit.test.tsx
        name: "the Gesamtbewertung tooltip documents the 40/30/30 weighting"
      - file: tests/docQualityVollzaehligkeit.test.tsx
        name: "renders an accessible info tooltip for Gesamtbewertung"
    browser:
      route: "/doc-quality"
      steps:
        - "Log in as admin, open /doc-quality and hover the ℹ next to \"Gesamtbewertung\"."
        - "Select one centre in the header dropdown to open its detail panel."
        - "Compute 0.4 × Vollzähligkeit + 0.3 × Vollständigkeit + 0.3 × Plausibilität from that centre's three card percentages."
      expect: "The tooltip reads \"Gesamtbewertung: gewichteter Gesamtscore aus Vollzähligkeit (40 %), Vollständigkeit (30 %) und Plausibilität (30 %).\"; the centre's Gesamtbewertung card equals the computed value within ±1 % (rounding)."
    notes: "Check the arithmetic in the centre detail, not the overview: the overview Gesamtbewertung is the unweighted mean of per-centre overall scores (DocQualityPage.tsx:291) while the overview Vollzähligkeit is a direct windowed ratio (lines 139-142), so the overview cards do not satisfy the 40/30/30 identity exactly. The cited tests only check the tooltip text; no test asserts the 0.4/0.3/0.3 arithmetic of computeMetrics (tests/qualityMetrics.test.ts:321 only checks overall is not NaN)."
