  - id: UIR-DOCQ-005
    title: "Always-visible centre select scopes KPIs (no chip filter)"
    statement: "The user can pick \"Alle Zentren\" or a single centre in an always-visible header select (no multi-centre chip filter), and the KPIs are scoped to that selection."
    status: implemented
    sources: ["EMDREQ-QUAL-011 / N07.01", "UAT v1.13 D1 (by decision); v1.10 QUAL-011", "code: src/pages/DocQualityPage.tsx:183-255"]
    evidence:
      - "src/pages/DocQualityPage.tsx:224-234 (header <select> with \"Alle Zentren\" + one option per centre, always rendered)"
      - "src/pages/DocQualityPage.tsx:253 (QualityFilterBar showCenterFilter={false} — no second centre control)"
      - "src/pages/DocQualityPage.tsx:144-150,328-333 (selected centre → CenterDetailPanel with that centre's metrics)"
    tests: []
    browser:
      route: "/doc-quality"
      steps:
        - "Log in as admin and open /doc-quality without clicking \"Zeitraum\"."
        - "Confirm the header shows a dropdown whose current value is \"Alle Zentren\" and that no chip/multi-select centre filter exists anywhere on the page."
        - "Note the row for one centre (e.g. UKT) in the comparison table."
        - "Choose that centre in the header dropdown."
      expect: "The page switches to the centre detail view; its four cards show exactly the percentages of that centre's table row (Vollzähligkeit, Vollständigkeit, Plausibilität, Gesamtbewertung) and the \"… Patienten\" chip equals the row's Patienten value."
    notes: "The 'scoped KPIs' are the centre detail panel's cards; the overview cards are not re-scoped in place."
  - id: UIR-DOCQ-006
    title: "Centres without cases in window are omitted"
    statement: "The Dokumentationsqualität page omits centres with no cases in the selected time window from the table, the chart and the centre select."
    status: implemented
    sources: ["code: src/pages/DocQualityPage.tsx:34-62"]
    evidence:
      - "src/pages/DocQualityPage.tsx:41-46 (buildCenterMetrics skips a centre whose filtered cases are empty)"
      - "src/pages/DocQualityPage.tsx:115-118 (centerOptions derived from centerMetrics → dropdown)"
      - "src/pages/DocQualityPage.tsx:306-318 (chart and table fed from centerMetrics)"
    tests: []
    browser:
      route: "/doc-quality"
      steps:
        - "Log in as admin, open /doc-quality, open the header centre dropdown and count the centre options with \"Gesamter Zeitraum\"."
        - "Click \"Zeitraum\" → \"Benutzerdefiniert\" and set \"Von\" and \"Bis\" to a narrow 7-day window in the past."
        - "Re-open the centre dropdown, and inspect the table rows and chart groups."
