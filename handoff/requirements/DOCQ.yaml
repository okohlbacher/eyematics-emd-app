# UI requirements registry — area DOCQ. Generated 2026-10-08 by the ui-requirements-registry workflow;
# maintained by the uat-triage skill (promotion and amendment of tester-confirmed behaviour; see handoff/HANDOFF.md §4).
area: DOCQ
requirements:
  - id: UIR-DOCQ-001
    title: "Header: Zeitraum toggle reveals time-range bar"
    statement: "The Dokumentationsqualität page header has a \"Zeitraum\" toggle that shows or hides the time-range preset bar."
    status: implemented
    sources: ["code: src/pages/DocQualityPage.tsx:183-255", "UAT v1.13 B1"]
    evidence:
      - "src/pages/DocQualityPage.tsx:81 (showFilters state, default false)"
      - "src/pages/DocQualityPage.tsx:213-223 (\"Zeitraum\" button toggles showFilters, highlighted blue when open)"
      - "src/pages/DocQualityPage.tsx:246-255 (QualityFilterBar rendered only while showFilters)"
      - "src/components/doc-quality/QualityFilterBar.tsx:72-103 (preset bar with \"Zeitraum:\" label)"
      - "src/i18n/translations.ts:653 (docQualityTimeRange = \"Zeitraum\")"
    tests: []
    browser:
      route: "/doc-quality"
      steps:
        - "Log in as admin (or diz_manager / klinikleitung) and open /doc-quality."
        - "Observe the header: no preset buttons are visible below it."
        - "Click the \"Zeitraum\" button in the header."
        - "Click \"Zeitraum\" again."
      expect: "After step 3 a bar labelled \"Zeitraum:\" with buttons \"Letzte 3 Monate\", \"Letzte 6 Monate\", \"Letztes Jahr\", \"Gesamter Zeitraum\", \"Benutzerdefiniert\" appears and the \"Zeitraum\" button is highlighted blue; after step 4 the bar disappears again."
    notes: "No test renders DocQualityPage. The shared QualityFilterBar is only exercised through tests/QualityPage.test.tsx ('time-range control (QualityFilterBar) renders on the page'), which targets /quality, so it is not cited here. The route is gated to roles admin/clinic_lead/data_manager (src/App.tsx:35-39,61; src/context/AuthContext.tsx:23)."
  - id: UIR-DOCQ-002
    title: "Time-range presets incl. Benutzerdefiniert with date picker"
    statement: "The user can choose \"Letzte 3 Monate\", \"Letzte 6 Monate\", \"Letztes Jahr\", \"Gesamter Zeitraum\" or \"Benutzerdefiniert\" with a from/to date picker whose upper bound is respected."
    status: implemented
    sources: ["EMDREQ-QUAL-011 / N07.02", "UAT v1.13 B1; confirmed v1.14", "manual: Benutzerhandbuch §8.2"]
    evidence:
      - "src/components/doc-quality/QualityFilterBar.tsx:41-46 (3m/6m/1y/all presets)"
      - "src/components/doc-quality/QualityFilterBar.tsx:53-62,92-101 (\"Benutzerdefiniert\" seeds last 30 days → today)"
      - "src/components/doc-quality/QualityFilterBar.tsx:106-126 (\"Von:\"/\"Bis:\" date inputs, Bis max=today and min=Von, Von max=Bis)"
      - "src/utils/qualityMetrics.ts:170-189 (timeRangeWindow: custom to = end of 'to' day, from>to rejected)"
      - "src/utils/qualityMetrics.ts:191-221 (filterCasesByTimeRange clips observations to both bounds)"
    tests:
      - file: tests/qualityMetrics.test.ts
        name: "custom range: clips to BOTH bounds (obs after `to` are excluded)"
      - file: tests/qualityMetrics.test.ts
        name: "custom range: both bounds applied (inclusive from start-of-day / to end-of-day)"
      - file: tests/qualityMetrics.test.ts
        name: "custom range with from>to is rejected (null → no window)"
      - file: tests/qualityMetrics.test.ts
        name: "3m preset: only cases with obs in the last 3 months survive"
    browser:
      route: "/doc-quality"
      steps:
        - "Log in as admin, open /doc-quality, click \"Zeitraum\"."
        - "Click each of \"Letzte 3 Monate\", \"Letzte 6 Monate\", \"Letztes Jahr\", \"Gesamter Zeitraum\" and note the \"Grundgesamtheit\" value after each."
        - "Click \"Benutzerdefiniert\"; \"Von:\" and \"Bis:\" date inputs appear pre-filled with the last 30 days."
        - "Set \"Von\" to a date two years ago and \"Bis\" to a date one year ago (end date in the past)."
        - "Compare \"Grundgesamtheit\" and the \"Beobachtungen\" column with the values for \"Gesamter Zeitraum\"."
      expect: "The clicked preset is highlighted blue; Grundgesamtheit changes per preset. In the custom range the counts are lower than for \"Gesamter Zeitraum\" and the \"Bis\" input cannot be set later than today; observations after the \"Bis\" date are not counted (Beobachtungen shrink when \"Bis\" is moved earlier)."
    notes: "Only the window logic is unit-tested; the picker UI itself has no test."
  - id: UIR-DOCQ-003
    title: "Metrics, Grundgesamtheit and counts recompute on time range"
    statement: "The Dokumentationsqualität metric cards, Grundgesamtheit label and per-centre counts recompute from windowed observations only when the time range changes."
    status: implemented
    sources: ["EMDREQ-QUAL-011 / N07.02", "UAT v1.13 A2/B1; confirmed v1.14", "manual: Benutzerhandbuch §8.2"]
    evidence:
      - "src/pages/DocQualityPage.tsx:34-62 (buildCenterMetrics filters each centre's cases by timeRange)"
      - "src/pages/DocQualityPage.tsx:105-113,127-142 (rawTotal, centerMetrics, distinctPatientCount, aggregateVollzaehligkeit all depend on timeRange)"
      - "src/utils/qualityMetrics.ts:191-221 (filterCasesByTimeRange trims observations and drops empty cases)"
      - "src/utils/qualityMetrics.ts:241-329 (computeMetrics on windowed cases)"
    tests:
      - file: tests/qualityMetrics.test.ts
        name: "range=\"6m\": case with obs ONLY outside window is excluded (A2 core fix)"
      - file: tests/qualityMetrics.test.ts
        name: "patientCount from computeMetrics reflects only windowed cases (not raw cases)"
      - file: tests/qualityMetrics.test.ts
        name: "does NOT collapse to ~100% as the window shrinks (numerator windowed, denominator full)"
    browser:
      route: "/doc-quality"
      steps:
        - "Log in as admin, open /doc-quality, click \"Zeitraum\"."
        - "With \"Gesamter Zeitraum\" active, note \"Grundgesamtheit\", the four card percentages and the \"Patienten\"/\"Beobachtungen\" columns of the table."
        - "Click \"Letztes Jahr\", then \"Letzte 6 Monate\", then \"Letzte 3 Monate\", noting the same values each time."
      expect: "Grundgesamtheit, the card patient counts and the table Patienten/Beobachtungen values decrease (or stay equal) with each shorter window; the Vollständigkeit and Plausibilität percentages remain meaningful (not 0 %) and the page never shows NaN."
    notes: "Page-level recomputation is untested; only the underlying utils are, and the 'does NOT collapse' test covers the per-centre computeMetrics rule (full per-centre denominator, DocQualityPage.tsx:51-58), not the aggregate card. Denominators differ by level: the aggregate Vollzähligkeit card uses the windowed registered count (N8, countRawPatientsInWindow), per-centre rows keep the full registered per-centre total (rawByCenter)."
