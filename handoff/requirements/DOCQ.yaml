  - id: UIR-DOCQ-011
    title: "Vollzähligkeit matches Startseite definition"
    statement: "The Vollzähligkeit card uses the Startseite definition: with \"Gesamter Zeitraum\" it equals the landing figure; with a filter both count and denominator follow the selected period."
    status: implemented
    sources: ["UAT v1.19 N8 (reverses v1.18 M14); v1.14 I5", "code: src/pages/DocQualityPage.tsx:105-142"]
    evidence:
      - "src/pages/DocQualityPage.tsx:105-108 (rawTotal = countRawPatientsInWindow when windowed, countRawPatients otherwise)"
      - "src/pages/DocQualityPage.tsx:127-142 (aggregateVollzaehligkeit = distinct in-window patients / rawTotal)"
      - "src/services/fhirLoader.ts:96-102,144-163 (countRawPatients, countRawPatientsInWindow)"
      - "src/pages/LandingPage.tsx:65-71,199-204 (landing: cases.length / countRawPatients, \"{n} / {m} Patienten\")"
      - "src/i18n/translations.ts:765-767 (tooltip: \"Zähler und Nenner folgen dem Zeitfilter\")"
      - "shared/patientCases.ts:65-95 (one PatientCase per clinical Patient → distinct pseudonyms == cases.length)"
    tests:
      - file: tests/qualityMetrics.test.ts
        name: "aggregate matches the landing definition when unfiltered (active==registered)"
      - file: tests/stubIsolation.test.ts
        name: "returns total Patient count including stubs (denominator)"
    browser:
      route: "/doc-quality"
      steps:
        - "Log in as admin, open / (Startseite) and note the DATENVOLLZÄHLIGKEIT percentage and its \"n / m Patienten\" sub-label."
        - "Open /doc-quality with \"Gesamter Zeitraum\"; read the \"Vollzähligkeit\" card percentage and its \"… Patienten\" count."
        - "Click \"Zeitraum\" → \"Letztes Jahr\" and read the card again; hover its ℹ icon."
      expect: "Step 2 percentage equals the landing percentage and the Patienten count equals the landing n; after step 3 the Patienten count is ≤ the step-2 count and the percentage rises to (about) 100 % because numerator and denominator are both the in-window active population; the tooltip states that Zähler und Nenner follow the time filter."
    notes: "With a window active the aggregate card reads ≈100 % by construction (N8 trade-off, DocQualityPage.tsx:97-104): countRawPatientsInWindow counts registered patients with ≥1 observation in the window, which is the same population as the numerator. No test covers countRawPatientsInWindow or the N8 windowed denominator; tests/docQualityVollzaehligkeit.test.tsx header still describes the superseded M14 rule."
  - id: UIR-DOCQ-012
    title: "Plausibilität reflects ranges set in Einstellungen"
    statement: "The Plausibilität metric reflects the plausibility ranges configured in Einstellungen."
    status: implemented
    sources: ["manual: Konfiguration.md (UI-set keys: outcomes)", "translations docQualityPlausibilityTooltip"]
    evidence:
      - "src/utils/qualityMetrics.ts:110-123 (isVisusInRange/isCrtInRange/isIopInRange read getSettings().plausibility at call time)"
      - "src/utils/qualityMetrics.ts:275-309 (plausibility = in-range / checkable Visus+CRT+IOP values)"
      - "src/services/settingsService.ts:115-152 (getSettings cache updated by updateSettings)"
      - "src/pages/SettingsPage.tsx:241-257,779-931 (Plausibilitätsbereiche form + Speichern → updateSettings({ plausibility }))"
      - "src/i18n/translations.ts:1160-1172 (settingsPlausibilityTitle = \"Plausibilitätsbereiche\", settingsPlausibilityCrtMax = \"CRT Maximum (µm)\"); translations.ts:6 (save = \"Speichern\")"
    tests: []
    browser:
      route: "/doc-quality"
      steps:
        - "Log in as admin, open /doc-quality with \"Gesamter Zeitraum\" and note the \"Plausibilität\" percentage."
        - "Open /settings, scroll to \"Plausibilitätsbereiche\", set \"CRT Maximum (µm)\" from 800 to 300 and click \"Speichern\" in that section."
        - "Open /doc-quality again (via the sidebar entry \"Dokumentationsqualität\")."
        - "Restore \"CRT Maximum (µm)\" to 800 in /settings afterwards."
      expect: "After step 3 the Plausibilität card percentage is lower than in step 1 (many CRT values above 300 µm now count as implausible) and the per-centre Plausibilität badges drop accordingly."
    notes: "The metrics memo does not depend on settings (DocQualityPage.tsx:110-113), so the new ranges take effect on the next mount of the page (navigation), not live while staying on the page. /settings is admin-only (src/App.tsx:64). No test feeds non-default plausibility settings into computeMetrics."
