    status: implemented
    sources: ["EMDREQ-PROT-001", "Benutzerhandbuch §11.3"]
    evidence:
      - "src/pages/AuditPage.tsx:29-39 (handleExportCsv: headers = Zeitpunkt/Nutzer/Aktion/Detail/Status; rows = filteredEntries)"
      - "src/pages/AuditPage.tsx:124-131 (button disabled={filteredEntries.length === 0})"
      - "src/utils/download.ts:22-35,50-52 (buildCsv with BOM, datedFilename 'audit-log-<date>.csv')"
      - "src/i18n/translations.ts:625 (CSV exportieren)"
    tests:
      - file: tests/auditPageCharacterization.test.tsx
        name: "admin-gated export buttons"
    browser:
      route: "/audit"
      steps:
        - "Log in as admin, open \"Protokoll\" and set \"Kategorie\" to \"Authentifizierung\"."
        - "Click \"CSV exportieren\" and open the downloaded file."
        - "Set \"Von\" to a future date so the table shows \"Keine Audit-Einträge entsprechen Ihren Filtern.\" and look at the button."
