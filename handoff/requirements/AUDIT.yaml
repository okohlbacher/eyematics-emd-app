  - id: UIR-AUDIT-017
    title: "Admin-only 'JSON exportieren' downloads the full log"
    statement: "The user can, when logged in as admin, download the complete audit log as audit-export-<date>.json ({entries,total,truncated}) via \"JSON exportieren\"; the button is not offered to non-admins."
    status: implemented
    sources: ["EMDREQ-PROT-001", "Benutzerhandbuch §11.3"]
    evidence:
      - "src/pages/AuditPage.tsx:41-53 (handleExportJson: authFetch('/api/audit/export') → downloadBlob 'audit-export-<date>.json')"
      - "src/pages/AuditPage.tsx:132-140 (button only when user.role === 'admin')"
      - "server/auditApi.ts:138-158 (403 for non-admin; JSON {entries,total,truncated}; Content-Disposition attachment)"
      - "server/auditDb.ts:217,224-235 (MAX_EXPORT_ROWS 100000, ordered timestamp DESC, uncapped total)"
      - "src/i18n/translations.ts:491 (JSON exportieren)"
    tests:
      - file: tests/auditPageCharacterization.test.tsx
        name: "admin-gated export buttons"
      - file: tests/auditApi.test.ts
        name: "returns 403 for non-admin"
      - file: tests/auditApi.test.ts
        name: "returns all entries for admin"
    browser:
      route: "/audit"
      steps:
        - "Log in as admin, open \"Protokoll\" and set \"Kategorie\" to \"Authentifizierung\" (to prove the export ignores filters)."
        - "Click \"JSON exportieren\" and open the downloaded file."
        - "Log in as a non-admin user and open <app-url>/audit."
      expect: "Step 2: a file audit-export-<today>.json downloads containing an object with keys entries (array of all rows incl. hidden GETs, with id/timestamp/method/path/user/status/duration_ms/body/query), total and truncated:false. Step 3: non-admin is redirected to Startseite; no \"JSON exportieren\" button exists."
    notes: "The payload is a wrapper object {entries, total, truncated}, not a bare array, and it is capped at 100,000 rows (truncated flag / X-Max-Export-Rows header). The export is unfiltered. A failed export is only logged to the console (AuditPage.tsx:45,51) — no visible error."

  - id: UIR-AUDIT-018
    title: "No edit or delete control for audit entries"
    statement: "The Protokoll page offers no control to edit or delete audit entries (no row actions, no bulk delete), and the API has no write route for existing entries."
    status: implemented
    sources: ["EMDREQ-PROT-001", "Benutzerhandbuch §1.3", "Benutzerhandbuch §11.1"]
    evidence:
      - "src/pages/AuditPage.tsx:123-141 (only CSV/JSON export buttons in the controls row)"
      - "src/pages/AuditPage.tsx:185-210 (rows have five data cells, no action cell/buttons)"
      - "src/i18n/translations.ts:485 (auditClear 'Protokoll löschen' key exists but is referenced by no component)"
      - "server/auditApi.ts (router defines GET /, GET /export, POST /events/view-open only; no PUT/PATCH/DELETE)"
      - "server/index.ts:301-304 (unmatched /api/* → 404 JSON {error:'Not found'})"
      - "server/auditDb.ts:103,132-142 (only deletion path is the server-side retention purge)"
    tests: []
    browser:
      route: "/audit"
      steps:
        - "Log in as admin and open \"Protokoll\"."
        - "Inspect the controls row above the table and hover over several rows."
        - "Right-click a row and check for any context/row menu."
        - "Open browser devtools and send DELETE <app-url>/api/audit/<id> with the session token."
      expect: "Steps 2-3: only \"CSV exportieren\" and \"JSON exportieren\" exist; rows have no buttons, checkboxes or menus. Step 4: the server answers 404 {\"error\":\"Not found\"} and the entry remains in the table after reload."
    notes: "Removed the citation of tests/ui-requirements.test.ts 'audit is server-side only' — it asserts a hardcoded literal list, not the router, so it does not test this behaviour. No automated test covers the absence of write routes; the evidence is the router definition in server/auditApi.ts. The unused 'auditClear' translation key is dead i18n, not a control."

