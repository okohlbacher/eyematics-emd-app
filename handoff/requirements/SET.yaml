# UI requirements registry — area SET. Generated 2026-10-08 by the ui-requirements-registry workflow;
# maintained by the uat-triage skill (promotion and amendment of tester-confirmed behaviour; see handoff/HANDOFF.md §4).
area: SET
requirements:
  - id: UIR-SET-001
    title: "Einstellungen reachable only by administrators"
    statement: "The UI shows the \"Einstellungen\" sidebar entry only to administrators and redirects non-admin users from /settings to the Startseite."
    status: implemented
    sources: ["manual: docs/Konfiguration.md — Änderung über die UI (als Administrator)"]
    evidence:
      - "src/App.tsx:28-33 (AdminRoute: no user → /login, role !== 'admin' → Navigate to '/')"
      - "src/App.tsx:64 (/settings wrapped in AdminRoute)"
      - "src/components/Layout.tsx:28-34 (admin nav group /audit, /admin, /settings only when user.role === 'admin')"
      - "server/settingsApi.ts:308-312 (PUT /api/settings 403 for non-admin — server-side backstop)"
      - "server/index.ts:110 and data/users.json:24 (seed user forscher1, role researcher)"
    tests:
      - file: tests/settingsApi.test.ts
        name: "returns 403 for non-admin"
    browser:
      route: "/settings"
      steps:
        - "Log in as forscher1 (non-admin)."
        - "Inspect the sidebar: there is no \"Einstellungen\" entry (and no \"Protokoll\"/\"Verwaltung\")."
        - "Type /settings into the address bar and press Enter."
        - "Log out, log in as admin and open /settings."
      expect: "As forscher1 the browser lands on the Startseite (/) without rendering the settings page; as admin the sidebar shows \"Einstellungen\" and /settings renders the page with the heading \"Einstellungen\"."
    notes: "No test covers the client-side AdminRoute/sidebar gating; only the server 403 on PUT /api/settings is tested."
  - id: UIR-SET-002
    title: "\"YAML exportieren\" downloads current settings.yaml"
    statement: "The user can download the current configuration as a settings.yaml file via \"YAML exportieren\"; the page footer states settings are loaded from and saved to settings.yaml."
    status: implemented
    sources: ["uat: v1.12 CFG-01/02 (settings.yaml single source); v1.20 (settings on volume)", "code: src/pages/SettingsPage.tsx:362-384", "manual: docs/Benutzerhandbuch.md §9.4"]
    evidence:
      - "src/pages/SettingsPage.tsx:362-365 (handleExportYaml → exportSettingsYaml() + downloadYaml(…, 'settings.yaml'))"
      - "src/pages/SettingsPage.tsx:378-384 (header button t('settingsExportYaml'))"
      - "src/pages/SettingsPage.tsx:1035-1038 (footer hint t('settingsFileHint'))"
      - "src/services/settingsService.ts:174-177 (exportSettingsYaml dumps the cached merged settings)"
      - "src/utils/download.ts:43-47 (downloadYaml → Blob text/yaml + anchor click)"
      - "src/i18n/translations.ts:720-721 ('YAML exportieren', 'Einstellungen werden in settings.yaml geladen und gespeichert.')"
    tests: []
    browser:
      route: "/settings"
      steps:
        - "Log in as an administrator and open /settings."
        - "Click \"YAML exportieren\" in the page header (top right)."
        - "Open the downloaded file."
        - "Scroll to the bottom of the page."
      expect: "A file named settings.yaml is downloaded containing keys such as twoFactorEnabled, therapyInterrupterDays, thresholds, plausibility, dataSource and auth with the currently displayed values; the page footer reads \"Einstellungen werden in settings.yaml geladen und gespeichert.\""
    notes: "Export serialises the client-side cached settings (merged defaults + server YAML), not the raw file bytes; comments from the server file are not preserved."
  - id: UIR-SET-003
    title: "Successful save shows \"Einstellungen gespeichert\" for 3 s"
    statement: "The Einstellungen page confirms a successful save with a green \"Einstellungen gespeichert\" banner that disappears after about 3 seconds."
    status: implemented
    sources: ["code: src/pages/SettingsPage.tsx:172-175,387-393", "manual: docs/Benutzerhandbuch.md §9, §15", "spec: EMDREQ-QUAL-009 / N06.01"]
    evidence:
      - "src/pages/SettingsPage.tsx:172-175 (showSaved: setSavedBanner(true) + setTimeout 3000 ms)"
      - "src/pages/SettingsPage.tsx:387-393 (green banner rendering t('settingsSaved'))"
      - "src/pages/SettingsPage.tsx:143,162,192,214,233,252,277,303,323,343 (every save path calls showSaved on success)"
      - "src/i18n/translations.ts:462 ('Einstellungen gespeichert')"
    tests: []
    browser:
      route: "/settings"
      steps:
        - "Log in as an administrator and open /settings."
        - "Under \"Therapieunterbrechung\" change \"Therapieunterbrecher-Schwellenwert (Tage)\" from 120 to 121."
        - "Click \"Speichern\" in that section and start a stopwatch."
      expect: "A green banner \"Einstellungen gespeichert\" appears directly below the page header and is gone again after roughly 3 seconds without any user action."
    notes: "The 3 s timer is not reset on repeated saves (each save schedules its own timeout). No component test exists for the banner."
  - id: UIR-SET-004
    title: "Failed save shows red error banner"
    statement: "The Einstellungen page shows a red role=alert banner with the error message when a save fails."
    status: implemented
    sources: ["code: src/pages/SettingsPage.tsx:395-400"]
    evidence:
      - "src/pages/SettingsPage.tsx:395-400 (div role=\"alert\" red banner: t('settingsSaveError') + ': ' + saveError)"
      - "src/pages/SettingsPage.tsx:193-194,215-216,234-235,253-254,278-279,304-306,324-326,344-345 (catch blocks set saveError from err.message)"
      - "src/services/settingsService.ts:121-131,139-151 (persistSettings throws 'Failed to persist settings: <status>'; updateSettings resyncs cache and rethrows)"
      - "src/i18n/translations.ts:463 ('Einstellungen konnten nicht gespeichert werden')"
    tests: []
    browser:
      route: "/settings"
      steps:
        - "Log in as an administrator and open /settings."
        - "Open the browser DevTools Network tab and enable request blocking for the URL pattern */api/settings (or stop the API container)."
        - "Change \"Therapieunterbrecher-Schwellenwert (Tage)\" to 121 and click \"Speichern\" under \"Therapieunterbrechung\"."
        - "Remove the block and click \"Speichern\" again."
      expect: "A red banner \"Einstellungen konnten nicht gespeichert werden: Failed to persist settings: …\" (or a fetch error message) appears below the header; after unblocking, the next save shows the green \"Einstellungen gespeichert\" banner and the red one disappears."
    notes: ""
  - id: UIR-SET-005
    title: "Saved settings persist across reload and browsers"
    statement: "The UI keeps saved settings values after a page reload and after a login from another browser, because they are stored server-side in settings.yaml."
    status: implemented
    sources: ["manual: docs/Benutzerhandbuch.md §9, §15; docs/Konfiguration.md (server-side settings.yaml)", "uat: v1.12 CFG-01 (ANL-004); D1 global scope locked"]
    evidence:
      - "src/services/settingsService.ts:94-109 (loadSettings GET /api/settings, merged over DEFAULTS)"
      - "src/services/settingsService.ts:121-131 (persistSettings PUT /api/settings as text/yaml)"
      - "server/settingsApi.ts:45-47,60-64 (readSettings/writeSettings on SETTINGS_FILE)"
      - "server/settingsApi.ts:282-306,308-346 (GET / PUT handlers)"
      - "src/pages/SettingsPage.tsx:85-101 (page re-reads server values on mount)"
      - "deploy/settings.yaml:10 (dataDir /data — settings on the persistent volume)"
    tests:
      - file: tests/settingsApi.test.ts
        name: "persists auth.refreshTokenTtlMs and auth.refreshAbsoluteCapMs (round-trip lock)"
      - file: tests/settingsApi.test.ts
        name: "accepts valid settings from admin"
    browser:
      route: "/settings"
      steps:
        - "Log in as an administrator and open /settings."
        - "Under \"Klinische Schwellenwerte\" change \"CRT kritischer Schwellenwert (µm)\" from 400 to 410 and click \"Speichern\" in that section; wait for \"Einstellungen gespeichert\"."
        - "Press F5 to reload and scroll to \"Klinische Schwellenwerte\"."
        - "On the server/host open settings.yaml (container: ~/EMD/settings.yaml) and search for criticalCrtUm."
        - "In a second browser (or private window) log in as an administrator and open /settings."
      expect: "After the reload the CRT field shows 410; settings.yaml contains criticalCrtUm: 410; the second browser also shows 410."
    notes: ""
  - id: UIR-SET-006
    title: "2FA switch is off by default and controls OTP step"
    statement: "The admin can switch \"OTP-Prüfung bei Anmeldung\" on or off (off on a fresh deployment); when on, login requires the OTP step, when off, login completes after the password step."
    status: implemented
    sources: ["spec: EMDREQ-USM-005 / N01.03 (Abgleich: Umgesetzt)", "manual: docs/Benutzerhandbuch.md §9.1; docs/Konfiguration.md twoFactorEnabled"]
    evidence:
      - "config/settings.yaml:1 and deploy/settings.yaml:6 (twoFactorEnabled: false)"
      - "src/services/settingsService.ts:44 (client DEFAULTS twoFactorEnabled: false)"
      - "src/pages/SettingsPage.tsx:297-308,408-427 (toggle + updateSettings({twoFactorEnabled}))"
      - "server/settingsApi.ts:329 (updateAuthConfig after PUT — takes effect without restart)"
      - "server/auth/loginApi.ts:114-128 (twoFactorEnabled || user.totpEnabled → challengeToken, else full session token)"
      - "src/pages/LoginPage.tsx:64-72 (otp_required → step 'otp')"
    tests: []
    browser:
      route: "/settings"
      steps:
        - "On a fresh deployment log in as an administrator (no OTP prompt appears) and open /settings."
        - "In \"Zwei-Faktor-Authentisierung\" check the switch next to \"OTP-Prüfung bei Anmeldung\": it is off (grey)."
        - "Click the switch to turn it on (blue); wait for \"Einstellungen gespeichert\"."
        - "Log out, log in again with username and password."
        - "Complete the OTP step, open /settings, turn the switch off, log out and log in again."
      expect: "Fresh deployment: switch off and login needs only password. With the switch on, after the password step a second screen asks for the OTP code; with the switch off again, login goes straight to the Startseite."
    notes: "Users with a personal TOTP enrolled are always asked for the OTP regardless of the global switch (loginApi.ts:116-118). No automated test asserts the on/off → challengeToken/token branch."
  - id: UIR-SET-007
    title: "2FA switch saves immediately, amber warning while off"
    statement: "The \"OTP-Prüfung bei Anmeldung\" switch (role=switch, aria-checked) saves immediately on toggle and shows an amber warning text while two-factor is off."
    status: implemented
    sources: ["code: src/pages/SettingsPage.tsx:297-308,402-433"]
    evidence:
      - "src/pages/SettingsPage.tsx:297-308 (handleTwoFactorToggle: optimistic set, updateSettings, showSaved; reverts on error)"
      - "src/pages/SettingsPage.tsx:413-426 (button role=\"switch\" aria-checked={twoFactorEnabled})"
      - "src/pages/SettingsPage.tsx:428-432 (amber text t('settings2faWarning') when !twoFactorEnabled)"
      - "src/i18n/translations.ts:669-671 (label, hint, '⚠ Zwei-Faktor-Authentisierung ist deaktiviert…')"
    tests: []
    browser:
      route: "/settings"
      steps:
        - "Log in as an administrator and open /settings."
        - "In \"Zwei-Faktor-Authentisierung\" click the switch next to \"OTP-Prüfung bei Anmeldung\" so it is off (grey)."
        - "Do not click any \"Speichern\" button."
        - "Inspect the switch element in DevTools."
      expect: "Immediately after the click the green \"Einstellungen gespeichert\" banner appears and an amber text \"⚠ Zwei-Faktor-Authentisierung ist deaktiviert. Anmeldung erfolgt nur mit Benutzername und Passwort.\" is shown under the switch; the element has role=\"switch\" and aria-checked=\"false\". Turning it on removes the amber text and shows aria-checked=\"true\"."
    notes: ""
  - id: UIR-SET-008
    title: "2FA setting change is recorded in the Protokoll"
    statement: "The UI records a change of the two-factor setting as a Protokoll row \"Einstellungen geändert\" for the acting admin, whose stored body is searchable for twoFactorEnabled."
    status: implemented
    sources: ["manual: docs/Benutzerhandbuch.md §9.1"]
    evidence:
      - "server/auditMiddleware.ts:42,55-56 (/api/settings listed for body redaction; YAML body stored with cohortHashSecret/otpCode redacted)"
      - "src/pages/audit/auditFormatters.ts:25 (PUT /api/settings → t('audit_action_update_settings'))"
      - "src/pages/audit/auditFormatters.ts:45-53 (describeDetail returns '' for PUT /api/settings — Detail column empty)"
      - "src/pages/AuditPage.tsx:66-72,100-104 (admin-only \"Benutzer\" dropdown and search box; useAuditData.ts:52 maps search → body_search)"
      - "server/auditDb.ts:292-294 (body_search LIKE filter on stored body)"
      - "src/i18n/translations.ts:596 ('Einstellungen geändert'), 1044 (search placeholder 'Kohorten-Hash suchen…')"
      - "src/pages/SettingsPage.tsx:302 (toggle triggers PUT /api/settings via updateSettings)"
    tests:
      - file: tests/auditPageReducer.test.ts
        name: "returns audit_action_update_settings for PUT /api/settings"
      - file: tests/auditMiddleware.test.ts
        name: "redacts cohortHashSecret/otpCode from YAML body on PUT /api/settings (H4)"
      - file: tests/auditMiddleware.test.ts
        name: "logs /api/ requests"
    browser:
      route: "/audit"
      steps:
        - "Log in as an administrator and open /settings."
        - "Click the \"OTP-Prüfung bei Anmeldung\" switch once; wait for \"Einstellungen gespeichert\"."
        - "Open \"Protokoll\" (/audit) from the sidebar."
        - "Select your username in the \"Benutzer\" dropdown and look at the newest rows."
        - "Type twoFactorEnabled into the search field (placeholder \"Kohorten-Hash suchen…\")."
      expect: "The newest row shows your admin username under \"Nutzer\", \"Einstellungen geändert\" under \"Aktion\", an empty \"Detail\" cell and status 200; with twoFactorEnabled in the search field the row is still listed (body search), while an unrelated term such as zzzz hides it."
    notes: "Statement sharpened: the Protokoll table has no method/path/body columns (Zeit, Nutzer, Aktion, Detail, Status only); the stored YAML body is observable only via the search box (body_search) or the JSON export. The row is generic for any settings change."
  - id: UIR-SET-009
    title: "Per-user TOTP enrollment with QR and recovery codes"
    statement: "The user can enroll a personal TOTP authenticator in the Einstellungen TOTP section: a QR code and recovery codes are shown and enrollment is confirmed with a 6-digit code."
    status: implemented
    sources: ["code: src/pages/SettingsPage.tsx:435-489"]
    evidence:
      - "src/pages/SettingsPage.tsx:116-147 (handleTotpEnroll POST /api/auth/totp/enroll → qrDataUrl + recoveryCodes; handleTotpConfirm requires exactly six digits, then POST /api/auth/totp/confirm)"
      - "src/pages/SettingsPage.tsx:448-489 (\"TOTP einrichten\" button, <img alt=\"TOTP QR\">, recovery code list, input placeholder 123456 maxLength 6, \"Bestätigen\")"
      - "server/auth/totpApi.ts:36-65 (enroll stores secret, returns otpauth/qrDataUrl/recoveryCodes)"
      - "server/auth/totpApi.ts:71-103 (confirm sets totpEnabled=true, bumps tokenVersion)"
      - "src/i18n/translations.ts:672-679 (section title 'Meine Authenticator-App (TOTP)', labels)"
    tests:
      - file: tests/credentialMutationInvalidation.test.ts
        name: "self TOTP confirm bumps tokenVersion + totpChangedAt"
    browser:
      route: "/settings"
      steps:
        - "Log in as an administrator (TOTP not yet enrolled) and open /settings."
        - "In \"Meine Authenticator-App (TOTP)\" verify the status text starts with \"TOTP ist nicht eingerichtet\"."
        - "Click \"TOTP einrichten\"."
        - "Scan the QR code with an authenticator app; note the \"Recovery-Codes (einmalig anzeigen)\" list."
        - "Enter the current 6-digit code into the input (placeholder 123456) and click \"Bestätigen\"."
      expect: "After step 3 a QR image, the scan hint and a two-column list of recovery codes in an amber box are shown; after step 5 the QR disappears, the status text changes to \"TOTP ist aktiv. Login erfordert einen 6-stelligen Code oder einen Recovery-Code.\" and the green \"Einstellungen gespeichert\" banner appears. A non-6-digit entry shows \"Ungültiger Code.\""
    notes: "The cited test asserts the server /totp/confirm side effect (tokenVersion bump), not the SettingsPage UI; no component test exists. Only the SettingsPage (admin-only) variant is covered here; a separate self-service TOTP section exists on the account page (NAV area)."
  - id: UIR-SET-010
    title: "Per-user TOTP can be disabled with a code"
    statement: "The user can disable an enrolled personal TOTP authenticator in the Einstellungen TOTP section by entering a valid code."
    status: implemented
    sources: ["code: src/pages/SettingsPage.tsx:491-507"]
    evidence:
      - "src/pages/SettingsPage.tsx:149-166 (handleTotpDisable: requires non-empty code, POST /api/auth/totp/disable, sets totpEnabled=false, showSaved)"
      - "src/pages/SettingsPage.tsx:491-507 (input placeholder t('totpDisablePlaceholder') 'Aktueller Code' + \"Deaktivieren\" button, rendered only when totpEnabled)"
      - "server/auth/totpApi.ts:105-148 (disable verifies OTP/recovery code, clears secret, bumps tokenVersion)"
      - "src/i18n/translations.ts:680-684 ('Deaktivieren', 'Aktueller Code', 'Ungültiger Code.', 'Bitte aktuellen Code eingeben.')"
    tests:
      - file: tests/credentialMutationInvalidation.test.ts
        name: "self TOTP disable bumps tokenVersion + totpChangedAt"
    browser:
      route: "/settings"
      steps:
        - "Log in as an administrator with TOTP enrolled and open /settings."
        - "In \"Meine Authenticator-App (TOTP)\" confirm the status reads \"TOTP ist aktiv…\"."
        - "Click \"Deaktivieren\" with the \"Aktueller Code\" field empty."
        - "Enter a wrong code (e.g. 000000) and click \"Deaktivieren\"."
        - "Enter the current code from the authenticator app and click \"Deaktivieren\"."
      expect: "Step 3 shows \"Bitte aktuellen Code eingeben.\"; step 4 shows \"Ungültiger Code.\"; step 5 shows \"Einstellungen gespeichert\", the status text returns to \"TOTP ist nicht eingerichtet…\" and the \"TOTP einrichten\" button is back."
    notes: "The cited test covers the server disable endpoint, not the SettingsPage UI."
  - id: UIR-SET-011
    title: "Session section shows token lifetime fields only"
    statement: "The \"Sitzungstoken-Gültigkeiten\" section shows only editable refresh token TTL and absolute cap (hours) with a Save button; no max-login-attempts, inactivity-timeout or warning fields."
    status: implemented
    sources: ["uat: v1.10 USM-008 / Phase 28", "manual: docs/Konfiguration.md UI-set key auth; settings.yaml auth.inactivityTimeoutMs/warningBeforeMs", "spec: EMDREQ-USM-008 / N01.11 ('konfigurierbare Zeit' — satisfied via settings.yaml)"]
    evidence:
      - "src/pages/SettingsPage.tsx:509-595 (section t('settingsSessionTitle') with only the refreshTtlHours and absoluteCapHours inputs + Save)"
      - "src/pages/SettingsPage.tsx (no occurrence of inactivityTimeoutMs/warningBeforeMs/maxLoginAttempts — grep returns nothing)"
      - "src/pages/SettingsPage.tsx:200-220 (handleSaveTtl writes only auth.refreshTokenTtlMs/refreshAbsoluteCapMs)"
      - "src/context/AuthContext.tsx:205-214 (inactivity/warning read from settings.yaml auth.* at load time — YAML-only)"
      - "src/i18n/translations.ts:1174-1176 ('Sitzungstoken-Gültigkeiten', 'Refresh-Token-Gültigkeit (Stunden)', 'Maximale Sitzungsdauer (Stunden)')"
    tests: []
    browser:
      route: "/settings"
      steps:
        - "Log in as an administrator and open /settings."
        - "Scroll to the sub-section \"Sitzungstoken-Gültigkeiten\" at the bottom of the \"Meine Authenticator-App (TOTP)\" card."
        - "List all input fields in that sub-section."
      expect: "Exactly two numeric fields are shown: \"Refresh-Token-Gültigkeit (Stunden)\" (default 8) and \"Maximale Sitzungsdauer (Stunden)\" (default 12), each with a hint, plus one \"Speichern\" button; there is no max-login-attempts field and no inactivity-timeout or warning-lead-time field."
    notes: "Status corrected to implemented: the statement describes the shipped UI exactly, and EMDREQ-USM-008 only requires a configurable inactivity time (settings.yaml auth.inactivityTimeoutMs / warningBeforeMs). Two earlier test mappings were dropped: loginLockout 'does NOT expose maxLoginAttempts' asserts GET /api/auth/config, and inactivitySettings asserts DEFAULTS constants — neither concerns this section."
