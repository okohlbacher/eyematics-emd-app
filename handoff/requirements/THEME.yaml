    evidence:
      - "src/pages/QualityPage.tsx (17 dark: classes), src/components/quality/QualityCaseList.tsx (21), src/components/quality/QualityCaseDetail.tsx (47, OctViewer mounted at :599), src/components/OctViewer.tsx (17)"
      - "src/pages/DocQualityPage.tsx (13 dark: classes)"
      - "src/components/doc-quality/CenterComparisonChart.tsx:37 and CenterDetailPanel.tsx:36 (caseChartColors(isDark))"
      - "src/components/doc-quality/CenterTable.tsx (9), PlausibilityRangesTable.tsx (12), QualityFilterBar.tsx (11), ScoreBadge.tsx (3), CustomTooltip.tsx (5)"
