# UI requirements registry — area THEME. Generated 2026-10-08 by the ui-requirements-registry workflow;
# maintained by the uat-triage skill (promotion and amendment of tester-confirmed behaviour; see handoff/HANDOFF.md §4).
area: THEME
requirements:
  - id: UIR-THEME-001
    title: "Theme menu offers Hell, Dunkel, System with active marked"
    statement: "The user can open the sidebar \"Design\" menu (role=menu) and sees three directly selectable entries \"Hell\", \"Dunkel\" and \"System\", the active one marked by aria-checked and a check icon."
    status: implemented
    sources: ["UAT v1.19 N7", "code: src/components/ThemeToggle.tsx", "manual: .planning/v1.20-ROADMAP.md v1.20.1"]
    evidence:
      - "src/components/ThemeToggle.tsx:18 (OPTIONS = light/dark/system)"
      - "src/components/ThemeToggle.tsx:56-72 (trigger button aria-haspopup=menu, aria-expanded, aria-controls, aria-label themeMenuLabel, chevron + current mode name)"
      - "src/components/ThemeToggle.tsx:74-100 (role=menu, role=menuitemradio, aria-checked, Check icon when active)"
      - "src/i18n/translations.ts:1032-1035 (themeMenuLabel de 'Design'/en 'Theme'; options 'Hell'/'Dunkel'/'System')"
      - "src/components/Layout.tsx:121 (ThemeToggle mounted in the sidebar footer below the language button)"
    tests:
      - file: tests/themeToggleCycle.test.tsx
        name: "opens the menu listing all three options when the trigger is clicked"
      - file: tests/themeToggleCycle.test.tsx
        name: "marks the active option (System by default) as checked"
      - file: tests/themeToggleCycle.test.tsx
        name: "selecting Light persists light, marks it active, and closes the menu"
      - file: tests/themeToggleCycle.test.tsx
        name: "starts closed (no menu in the DOM)"
    browser:
      route: "/"
      steps:
        - "Log in and stay on the Startseite."
        - "In the sidebar footer (below the \"English\" language button) click the \"Design\" button; it shows a chevron and the current mode name."
        - "Observe the popover that opens above the button."
        - "Click \"Dunkel\"."
        - "Click the \"Design\" trigger again and inspect the entries."
      expect: "The popover lists exactly three entries \"Hell\", \"Dunkel\", \"System\" (each a menuitemradio). After clicking \"Dunkel\" the page turns dark immediately, the menu closes, the trigger label reads \"Dunkel\" with a moon icon, and on reopening only \"Dunkel\" carries a check icon (aria-checked=true). There is no cycling button."
    notes: "Trigger button has aria-label/title 'Design' (DE) / 'Theme' (EN). Tests pin locale 'en' so they query the button by name 'Theme'."

  - id: UIR-THEME-002
    title: "Theme menu closes on outside click or Escape"
    statement: "The UI closes the open \"Design\" theme menu when the user clicks outside it or presses Escape, without changing the selected theme."
    status: implemented
    sources: ["UAT v1.19 N7", "code: src/components/ThemeToggle.tsx"]
    evidence:
      - "src/components/ThemeToggle.tsx:28-44 (document mousedown outside containerRef and keydown Escape both call setOpen(false); setTheme is not called)"
    tests:
      - file: tests/themeToggleCycle.test.tsx
        name: "closes on Escape"
      - file: tests/themeToggleCycle.test.tsx
        name: "closes on outside click"
    browser:
      route: "/"
      steps:
        - "Note the current trigger label of the sidebar \"Design\" button (e.g. \"System\")."
        - "Click \"Design\" to open the menu."
        - "Press Escape."
        - "Click \"Design\" again to open the menu."
        - "Click on the page heading in the main content area (outside the menu)."
      expect: "In both cases the popover disappears, the page colours do not change, and the trigger label still shows the same mode as before (no theme change)."
    notes: "The two tests assert only that the menu disappears; they do not assert that localStorage 'emd-theme' is unchanged (it is never written on close, see code)."

  - id: UIR-THEME-003
    title: "Theme defaults to System (prefers-color-scheme)"
    statement: "The UI defaults to the \"System\" theme when no theme is stored: a light OS appearance opens the app light and a dark OS appearance opens it dark."
    status: implemented
    sources: ["UAT v1.17 L11a", "UAT v1.18 (tester confirmed)", "code: src/context/ThemeContext.tsx", "manual: .planning/v1.20-ROADMAP.md v1.20.1 (no stored theme = system)"]
    evidence:
      - "src/context/ThemeContext.tsx:21-30 (readStored returns 'system' when localStorage 'emd-theme' is absent/invalid)"
      - "src/context/ThemeContext.tsx:34-37 (initial systemDark from matchMedia '(prefers-color-scheme: dark)')"
      - "src/context/ThemeContext.tsx:47 (effectiveTheme resolves 'system' via systemDark)"
      - "public/theme-init.js:4-9 (pre-paint: null or 'system' + OS dark adds .dark)"
    tests:
      - file: tests/themeToggleCycle.test.tsx
        name: "marks the active option (System by default) as checked"
    browser:
      route: "/"
      steps:
        - "In DevTools → Application → Local Storage delete the key 'emd-theme' (or clear site data) and keep the OS appearance set to Light."
        - "Reload the app and log in."
        - "Open the sidebar \"Design\" menu and note which entry is checked."
        - "Set the OS appearance to Dark (macOS: Systemeinstellungen → Erscheinungsbild), delete 'emd-theme' again, reload."
      expect: "With OS light the app opens light; with OS dark it opens dark. In both cases the \"Design\" menu shows \"System\" checked and the trigger reads \"System\"."
    notes: "The cited test only asserts that System is the default checked entry; the OS-appearance resolution (matchMedia) is not asserted by any test."

  - id: UIR-THEME-004
    title: "Chosen theme applies immediately and persists across reload"
    statement: "The user can choose \"Hell\", \"Dunkel\" or \"System\" and the UI applies the scheme immediately and keeps it after a reload (stored in localStorage 'emd-theme')."
    status: implemented
    sources: ["code: src/context/ThemeContext.tsx", "manual: .planning/v1.20-ROADMAP.md v1.20.1"]
    evidence:
      - "src/context/ThemeContext.tsx:49-56 (effect toggles .dark on <html> whenever effectiveTheme changes)"
      - "src/context/ThemeContext.tsx:58-61 (setTheme writes localStorage 'emd-theme')"
      - "src/context/ThemeContext.tsx:19-30 (STORAGE_KEY 'emd-theme'; readStored restores it on mount)"
      - "src/index.css:4,47 (@variant dark on .dark; .dark token block)"
      - "public/theme-init.js:4-9 (restores the stored choice before first paint)"
    tests:
      - file: tests/themeToggleCycle.test.tsx
        name: "selecting Light persists light, marks it active, and closes the menu"
      - file: tests/themeToggleCycle.test.tsx
        name: "each option selects its own theme value"
    browser:
      route: "/"
      steps:
        - "Open the sidebar \"Design\" menu and click \"Dunkel\"."
        - "Observe the page background at once."
        - "Reload the page (F5)."
        - "In DevTools → Application → Local Storage read the key 'emd-theme'."
        - "Repeat with \"Hell\" and \"System\"."
      expect: "The background turns dark immediately without reload; after reload the app is still dark and 'emd-theme' equals 'dark'. \"Hell\" stores 'light' and shows light; \"System\" stores 'system' and follows the OS appearance."
    notes: "Tests assert the localStorage write and the re-marked active entry; the .dark class on <html> is not asserted."

  - id: UIR-THEME-005
    title: "System mode follows OS appearance changes live"
    statement: "The UI in \"System\" mode follows OS appearance changes live, switching between light and dark without a reload."
    status: implemented
    sources: ["code: src/context/ThemeContext.tsx", "manual: .planning/v1.20-ROADMAP.md v1.20.1"]
    evidence:
      - "src/context/ThemeContext.tsx:39-45 (matchMedia 'change' listener updates systemDark while mounted)"
      - "src/context/ThemeContext.tsx:47-56 (effectiveTheme recomputed from systemDark when theme === 'system'; effect re-applies .dark)"
    tests: []
    browser:
      route: "/"
      steps:
        - "Open the sidebar \"Design\" menu and click \"System\"."
        - "With the app visible, switch the OS appearance to Dark (macOS: Systemeinstellungen → Erscheinungsbild → Dunkel)."
        - "Switch the OS appearance back to Hell."
        - "Open the \"Design\" menu again."
      expect: "The app turns dark the moment the OS switches to dark and back to light when the OS switches back, with no reload. The \"Design\" menu still shows \"System\" checked throughout."
    notes: "No test exercises the matchMedia change listener (ThemeContext.tsx:39-45)."

  - id: UIR-THEME-006
    title: "No light flash on reload in dark mode"
    statement: "The UI applies the dark class on <html> before first paint via the external /theme-init.js so no light flash (FOUC) occurs on reload in dark mode."
    status: implemented
    sources: ["code: public/theme-init.js; index.html", "manual: .planning/v1.20-ROADMAP.md v1.20.1 (theme-init.js)"]
    evidence:
      - "index.html:8-9 (<script src=\"/theme-init.js\"> in <head>, before the module bundle)"
      - "public/theme-init.js:4-9 (synchronous classic script: reads 'emd-theme' / prefers-color-scheme and adds .dark to document.documentElement)"
      - "server/index.ts:192-196 (CSP scriptSrc 'self' — external file allowed, inline would be blocked)"
      - "dist/theme-init.js (file is emitted into the production build)"
    tests: []
    browser:
      route: "/analysis"
      steps:
        - "At the bottom of the sidebar click the theme button (shows the current option, e.g. 'System'; title 'Design') and choose 'Dunkel'."
        - "Log out and on the login page press Cmd/Ctrl+Shift+R (hard reload) while watching the page."
        - "Log in, navigate to /analysis and hard-reload again."
        - "Optionally: DevTools → Network, confirm /theme-init.js is loaded before the main bundle and has status 200."
      expect: "The page paints dark from the first frame; no white/light background flashes before the login form or the Analyse page appears. /theme-init.js is served (200) and the <html> element already carries class \"dark\" when inspected immediately after load."
    notes: "Not testable in jsdom (no paint); production-only observation."

  - id: UIR-THEME-007
    title: "Dark mode restyles all Analyse charts and raw-data preview"
    statement: "In dark mode the Analyse page renders the distribution/IOD charts, the trajectory plots incl. \"Streuband (IQR)\", the \"Behandlungsintervall\"/\"Responder\" plots and the \"Rohdaten anzeigen\" table dark."
    status: implemented
    sources: ["UAT v1.17 L11b", "UAT v1.18 M12", "UAT v1.19 N6 (tester confirmed)"]
    evidence:
      - "src/pages/AnalysisPage.tsx:71-72 (useThemeSafe → rechartsTheme(isDark) for Aggregiert distribution/IOD charts; 31 dark:/isDark usages)"
      - "src/components/outcomes/palette.ts:88-100 (rechartsTheme dark/light token map)"
      - "src/components/outcomes/OutcomesPanel.tsx:101-125,304,337-338 (Plotly trajectory layout: dark grid/axis/legend tokens, DARK_EYE_COLORS, paper_bgcolor from chartColors so the dark card shows through)"
      - "src/components/outcomes/IntervalHistogram.tsx:71-72 and src/components/outcomes/ResponderView.tsx:127 (useThemeSafe → rechartsTheme)"
      - "src/components/outcomes/OutcomesDataPreview.tsx:198-239 (7 dark: classes on the Rohdaten <details>, table head and cells)"
    tests:
      - file: tests/rechartsDarkTheme.test.tsx
        name: "returns distinct dark vs light tokens"
      - file: tests/rechartsDarkTheme.test.tsx
        name: "IntervalHistogram renders inside a dark ThemeProvider"
      - file: tests/rechartsDarkTheme.test.tsx
        name: "ResponderView renders inside a dark ThemeProvider"
    browser:
      route: "/analysis?tab=trajectories"
      steps:
        - "Open the sidebar \"Design\" menu and click \"Dunkel\"."
        - "Go to Analyse → tab \"Aggregiert\": inspect the distribution charts and the IOD chart (grid lines, axis ticks, tooltip on hover)."
        - "Switch to tab \"Verläufe\": inspect the Visus/CRT trajectory panels and enable the display layer \"Streuband (IQR)\" to see the band."
        - "Open the metrics tabs \"Behandlungsintervall\" and \"Responder\"."
        - "Expand \"Rohdaten anzeigen\" at the bottom of the Verläufe tab."
      expect: "Every figure has a dark background with light grey grid/ticks/legend and dark tooltip boxes; the Rohdaten table has a dark header and rows. No chart, tooltip or table keeps a white/light background."
    notes: "Corrected: the Analyse trajectory band is the \"Streuband (IQR)\" display layer; \"Kohorten-Referenz anzeigen\" is a Fallansicht control (see UIR-THEME-008). Tests are smoke renders plus the token map; axis colours in rendered SVG are not asserted (jsdom limitation noted in the test file)."

  - id: UIR-THEME-008
    title: "Dark mode restyles case view header, charts and cards"
    statement: "In dark mode the Fallansicht renders the patient header/timeline, the clinical and distribution charts (grid, ticks, tooltips) and the Anamnese, Befunde, AE, Medikation and OCT cards dark."
    status: implemented
    sources: ["UAT v1.17 L11b", "UAT v1.18 M12", "UAT v1.19 N6", "code: src/components/case-detail/VisusCrtChart.tsx"]
    evidence:
      - "src/components/case-detail/chartTheme.ts:18-30 (caseChartColors: dark grid/tick/legend/tooltip tokens)"
      - "src/components/case-detail/VisusCrtChart.tsx:74 (caseChartColors(isDark))"
      - "src/components/case-detail/DistributionCharts.tsx:61 (caseChartColors(isDark)); ClinicalParametersRow.tsx (28 dark:/isDark usages)"
      - "src/components/case-detail/PatientHeader.tsx (25 dark: classes), AnamnesisFindings.tsx (23), MedicationCard.tsx (10)"
      - "src/components/OctViewer.tsx (17 dark: classes)"
      - "src/pages/CaseDetailPage.tsx (10 dark:/isDark usages: header, timeline, chart wrappers)"
    tests: []
    browser:
      route: "/case/:caseId"
      steps:
        - "Open the sidebar \"Design\" menu and click \"Dunkel\"."
        - "From Kohortenbildung or Datenqualität open any case (route /case/<caseId>)."
        - "Inspect the patient header and the visit timeline at the top."
        - "Hover a point in the Visus/CRT chart and in the distribution charts; check grid lines, tick labels and the tooltip box. Optionally toggle \"Kohorten-Referenz anzeigen\" and inspect the overlay band."
        - "Scroll to the \"Anamnese\", \"Befunde\", \"Unerwünschte Ereignisse\", \"Medikation\" and \"OCT-Aufnahmen\" cards."
      expect: "Header, timeline, chart grids/ticks (grey on dark), tooltip boxes (dark background, light text) and all listed cards are dark; no white card or white tooltip remains."
    notes: "No test asserts dark styling of case-detail components; CaseDetailRound5/7 tests render the components in light mode only."

