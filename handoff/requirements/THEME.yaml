  - id: UIR-THEME-010
    title: "Every page fully German by default, fully English after switch"
    statement: "The UI shows every page fully in German by default and switches all visible labels (headings, buttons, chart titles) to English immediately via the sidebar language button, without reload."
    status: implemented
    sources: ["UAT v1.13 live re-verification", "code: src/i18n/translations.ts; src/context/LanguageContext.tsx", "manual: Benutzerhandbuch §13; README i18n"]
    evidence:
      - "src/context/LanguageContext.tsx:15-18 (default locale 'de' unless 'emd-locale' stored)"
      - "src/context/LanguageContext.tsx:20-28 (setLocale updates state → t() re-renders consumers, no reload)"
      - "src/components/Layout.tsx:114-120 (sidebar button toggles de↔en, labelled 'English' when DE and 'Deutsch' when EN)"
      - "src/i18n/translations.ts:1262-1266 (single {de,en} table, t(key, locale))"
      - "src/i18n/translations.ts:648-651 (DocQuality card titles: 'Completeness', 'Data Completeness', 'Plausibility', 'Overall Score')"
    tests:
      - file: tests/outcomesI18n.test.ts
        name: "every outcomes* key has a non-empty de and en translation"
      - file: tests/outcomesI18n.test.ts
        name: "every metrics* key has a non-empty de and en translation"
      - file: tests/docQualityVollzaehligkeit.test.tsx
        name: "docQualityCompleteness label is \"Vollzähligkeit\" / \"Completeness\""
      - file: tests/inactivitySettings.test.ts
        name: "inactivityCountdown has non-empty de and en translations"
    browser:
      route: "/"
      steps:
        - "Clear localStorage key 'emd-locale', reload and log in — the UI must be German."
        - "Click the sidebar button \"English\" (globe icon above \"Design\")."
        - "Without reloading, visit Startseite, Kohortenbildung, Analyse (Aggregiert + Verläufe), a Fallansicht, Datenqualität, Dokumentationsqualität, Verwaltung, Protokoll, Einstellungen and Konto."
        - "On /doc-quality read the four score-card titles."
        - "Click the sidebar button \"Deutsch\" and revisit the same pages."
      expect: "After \"English\" every heading, button, nav label and chart title is English (on /doc-quality the cards read 'Completeness', 'Data Completeness', 'Plausibility', 'Overall Score'); after \"Deutsch\" they read 'Vollzähligkeit', 'Vollständigkeit', 'Plausibilität', 'Gesamtbewertung' and no English label remains. The switch happens instantly without reload."
    notes: "The EN card titles 'Documentation Completeness' / 'Measurement Completeness' quoted in older UAT notes no longer exist (reverted in v1.14 I5, see docQualityVollzaehligkeit.test.tsx). Test coverage is per-namespace (outcomes*, metrics*, selected keys), not an exhaustive every-page sweep; the Layout language button itself has no test."

  - id: UIR-THEME-011
    title: "Language switch keeps current page and state"
    statement: "The UI keeps the current route and page state (filters, selections) when the user switches between German and English."
    status: implemented
    sources: ["UAT v1.13 live re-verification", "code: src/context/LanguageContext.tsx"]
    evidence:
      - "src/context/LanguageContext.tsx:20-23 (setLocale only updates React state + localStorage 'emd-locale'; no navigation, no reload)"
      - "src/components/Layout.tsx:114-120 (switch button calls setLocale inside the persistent Layout shell; routed page components stay mounted)"
      - "src/pages/DocQualityPage.tsx:79-81 (timeRange/selectedCenter/showFilters are component state that survives the re-render)"
    tests: []
    browser:
      route: "/doc-quality"
      steps:
        - "Open Dokumentationsqualität, click the \"Zeitraum\" button to reveal the filter bar, choose a time range other than \"Gesamter Zeitraum\" and a specific centre in the \"Zentrum\" select."
        - "Click the sidebar button \"English\"."
        - "Check the browser address bar and the filter bar."
        - "Click \"Deutsch\" again."
      expect: "The URL stays /doc-quality, the chosen time range and centre remain selected (now labelled 'Time Range' / 'Center'), and only the labels change language in both directions."
    notes: "Corrected: DocQuality filters live in component state, not in query params, so no query-string expectation applies. The analogous check on /analysis?tab=trajectories&cohorts=… would also keep its query params (AnalysisPage uses useSearchParams)."

  - id: UIR-THEME-012
    title: "Dates and numbers formatted for the active locale"
    statement: "The UI formats dates and numbers for the active locale (de-DE vs en-US) on the landing, case, admin and audit pages."
    status: partial
    sources: ["code: src/utils/dateFormat.ts; src/pages/LandingPage.tsx; src/pages/AuditPage.tsx"]
    evidence:
      - "src/utils/dateFormat.ts:9-11 (getDateLocale: 'de' → 'de-DE', otherwise 'en-US')"
      - "src/pages/LandingPage.tsx:104,111 (toLocaleString(locale) for KPI numbers), 125-130 and 289-294 (toLocaleDateString(getDateLocale(locale), weekday long))"
      - "src/pages/AuditPage.tsx:20,32,188-191 (dateFmt = getDateLocale(locale) with dateStyle short / timeStyle medium)"
      - "src/pages/CaseDetailPage.tsx:78,310,380,411,439 (dateFmt for injection dates and chart ticks)"
      - "src/pages/AdminPage.tsx:93,817,871-875 (user table createdAt/lastLogin via dateFmt)"
      - "src/pages/AdminPage.tsx:1004-1006 (sessions sub-table uses toLocaleString() WITHOUT a locale → browser locale, not the app locale)"
    tests: []
    browser:
      route: "/"
      steps:
        - "On the Startseite with German active read the date line next to 'Klinischer Demonstrator' and the KPI numbers."
        - "Click the sidebar button \"English\" and read the same line and numbers."
        - "Open Protokoll (/audit) and compare the timestamp column in both languages."
        - "Open Verwaltung (/admin): compare the 'Angelegt' / 'Letzte Anmeldung' columns in both languages; then click a user's \"Sitzungen\" button and compare the timestamps of the sessions sub-table."
      expect: "German: 'Donnerstag, 8. Oktober 2026', numbers with thousands dot (e.g. 12.345), audit timestamps '08.10.26, 14:05:09'. English (en-US): 'Thursday, October 8, 2026', numbers 12,345, audit timestamps '10/8/26, 2:05:09 PM'. Known gap: the admin sessions sub-table follows the browser locale instead of the app language."
    notes: "Corrected the admin column labels to 'Angelegt' / 'Letzte Anmeldung' (adminCreated / adminLastLogin) — 'Erstellt' / 'Letzter Login' do not exist in translations.ts. Partial because AdminPage.tsx:1004-1006 (sessions sub-table) calls toLocaleString() without the app locale. No test covers locale formatting."

  - id: UIR-THEME-013
    title: "Text in Inter Variable, data numbers in JetBrains Mono"
    statement: "The UI renders body text in Inter Variable and data numbers (class font-data or font-mono, e.g. KPI values and the inactivity countdown) in JetBrains Mono Variable rather than a system fallback."
    status: implemented
    sources: ["UAT v1.20.1 fonts", "code: src/main.tsx; src/index.css", "manual: .planning/v1.20-ROADMAP.md v1.20.1 Fonts"]
    evidence:
      - "src/main.tsx:3-4 (imports @fontsource-variable/inter and @fontsource-variable/jetbrains-mono)"
      - "src/index.css:8-9 (--font-sans 'Inter Variable', --font-mono 'JetBrains Mono Variable' in @theme)"
      - "src/index.css:99 (.font-data → var(--font-mono) with tnum)"
      - "src/components/Layout.tsx:72 (inactivity countdown span uses Tailwind font-mono → --font-mono)"
      - "src/pages/LandingPage.tsx:163,196,282 (font-data on KPI values); src/pages/AdminPage.tsx:1003-1006 (font-data on session cells)"
      - "dist/assets/index-*.css contains 'Inter Variable' and 'JetBrains Mono Variable' @font-face"
    tests: []
    browser:
      route: "/"
      steps:
        - "Log in; in DevTools select the <body> element → Computed → font-family."
        - "On the Startseite select a KPI number (class font-data) and read its computed font-family."
        - "Stay idle until the inactivity warning banner appears (or shorten the timeout in Einstellungen) and inspect the mm:ss countdown span (class font-mono)."
        - "In DevTools → Rendered Fonts (Chrome: Computed → 'Rendered Fonts') confirm the actual font file used."
      expect: "body resolves to 'Inter Variable' and the rendered font is Inter Variable (not Helvetica/Arial/system-ui); the KPI value and the countdown resolve to 'JetBrains Mono Variable' (not Menlo/SF Mono)."
    notes: "The countdown uses the Tailwind class font-mono (Layout.tsx:72), not font-data; both map to --font-mono. No automated test covers fonts."

  - id: UIR-THEME-014
    title: "Fonts self-hosted from /assets, no third-party font requests"
    statement: "The UI loads its font files as woff2 subsets from /assets with zero requests to third-party font hosts such as fonts.googleapis.com."
    status: implemented
    sources: ["UAT v1.20.1 fonts", "manual: .planning/v1.20-ROADMAP.md v1.20.1 Fonts"]
    evidence:
      - "src/main.tsx:1-4 (fonts bundled via @fontsource-variable packages; comment documents removal of the Google Fonts request)"
      - "package.json:29-30 (@fontsource-variable/inter, @fontsource-variable/jetbrains-mono)"
      - "dist/assets/inter-*-wght-normal-*.woff2 and jetbrains-mono-*-wght-normal-*.woff2 (per-subset woff2 files emitted by Vite)"
