  - id: UIR-QUAL-010
    title: "Therapiestatus and CRT-Wert filters"
    statement: "The user can filter the Datenqualität list by \"Therapiestatus\" (Aktiv / Therapieunterbrecher / Therapieabbrecher) and by \"CRT-Wert\" (implausible only); the URL reflects the choice."
    status: partial
    sources: ["EMDREQ-QUAL-010 / N06.03", "manual: Benutzerhandbuch §7.6", "code: src/components/quality/QualityFilterPanel.tsx:124-149"]
    evidence:
      - "src/components/quality/QualityFilterPanel.tsx:124-149 (\"Therapiestatus\" select with Aktiv/Therapieunterbrecher/Therapieabbrecher; \"CRT-Wert\" select with \"Unplausibel (> 400 µm)\"; Z0-P16)"
      - "src/pages/QualityPage.tsx:220-226 (therapy and CRT filtering; CRT uses getSettings().crtImplausibleThresholdUm)"
      - "src/pages/QualityPage.tsx:74,84-98 (useSearchParams is read-only: filters are seeded from the URL but setSearchParams is never called)"
    tests:
      - file: tests/qualityPageDeepLink.test.tsx
        name: "shows only cases with CRT > threshold when filterCrt is implausible"
    browser:
      route: "/quality"
      steps:
        - "Open /quality, open the filter panel via the funnel icon."
        - "In \"Therapiestatus\" choose \"Therapieabbrecher\"; hover a grey (slate) \"AB\" badge."
        - "In \"CRT-Wert\" choose \"Unplausibel (> 400 µm)\"."
        - "Look at the browser address bar."
      expect: "Every listed case carries the grey (slate) AB badge whose tooltip reads \"Therapieabbrecher – <N> Tage ohne Behandlung\" (Z0-P25, C17); with the CRT filter only cases whose latest CRT exceeds the configured threshold remain. The address bar still shows /quality without ?therapy=breaker or ?crt=implausible (not reflected)."
    notes: "Filtering is implemented; URL reflection is one-way (URL → filter, see UIR-QUAL-012). The \"Unplausibel (> 400 µm)\" option label is a static string and does not follow the configured threshold. Sharpened statement if current behaviour is accepted: drop \"; the URL reflects the choice\"."

  - id: UIR-QUAL-011
    title: "Case list therapy badges in their own colour family"
    statement: "The Datenqualität case list marks therapy interrupters (UB badge, sky blue) and therapy breakers (AB badge, slate grey), a colour family distinct from the amber \"auffällig\" and red \"Kritisch\" value statuses and from each other, with tooltip \"<Therapieunterbrecher|Therapieabbrecher> – <N> Tage ohne Behandlung\" and the term as accessible name, according to the configured day thresholds (Z0-P25, C17, Q19; supersedes yellow/red)."
    status: implemented
    sources: ["manual: Benutzerhandbuch §7.1, §9.2", "code: src/components/quality/QualityCaseList.tsx:82-97"]
    evidence:
      - "src/components/quality/QualityCaseList.tsx:82-100 (therapyBadge: AB bg-slate-200 text-slate-800 / dark bg-slate-600 text-slate-100; UB bg-sky-200 text-sky-900 / dark bg-sky-900/60 text-sky-200; title \"<term> – <gapDays> Tage ohne Behandlung\", aria-label <term>; Z0-P25)"
      - "src/pages/QualityPage.tsx:199-208 (getTherapyStatus with settings.therapyInterrupterDays / therapyBreakerDays)"
      - "shared/qualityPredicates.ts:15-39 (max gap between injections or since last injection > thresholds)"
    tests: []
    browser:
      route: "/quality"
      steps:
        - "Open /quality (defaults: interrupter > 120 d, breaker > 365 d) and locate a case with a sky-blue \"UB\" badge and one with a grey \"AB\" badge; hover each."
        - "As admin, in /settings set \"Therapieunterbrecher-Schwellenwert (Tage)\" to 30, click \"Speichern\", return to /quality."
      expect: "The tooltip shows \"Therapieunterbrecher – <N> Tage ohne Behandlung\" / \"Therapieabbrecher – <N> Tage ohne Behandlung\"; UB is sky blue and AB slate grey, neither amber nor red (also in dark mode); after lowering the threshold additional cases show the UB badge."
    notes: "tests/ui-requirements.test.ts 'classifies patient by days since last injection' uses a local toy classifier and does not exercise the UI, so it is not cited. Cases with fewer than two injections are always \"Aktiv\" (qualityPredicates.ts:25). Colours changed by Z0-P25 (abaeb65); tests/acceptance/Z0/Z0-P25.spec.ts asserts the colour distances (vs. auffällig, red reference, AB vs. UB) and title/aria-label. UB uses sky-200/sky-900 instead of Q19's sky-100/sky-800 because sky-100 was too close to slate-200 (gate attempt 1). Open: blue is close to the OD colour in Verläufe (Q19 note); dark-mode contrast not asserted by a test."

  - id: UIR-QUAL-012
    title: "URL params seed filters and open the panel"
    statement: "The Datenqualität page seeds filters from URL params ?therapy=breaker|interrupter, ?crt=implausible and ?status=flagged (mapped to In Bearbeitung) and auto-opens the filter panel."
    status: implemented
    sources: ["code: src/pages/QualityPage.tsx:84-98,109-115"]
    evidence:
      - "src/pages/QualityPage.tsx:84-90 (status=flagged → in_progress)"
      - "src/pages/QualityPage.tsx:92-98 (therapy breaker|interrupter; crt implausible; unknown → all)"
      - "src/pages/QualityPage.tsx:109-115 (showFilters true when any of the three params is present)"
      - "src/pages/LandingPage.tsx:358,372 (Attention panel Review buttons navigate to /quality?therapy=breaker and /quality?crt=implausible; no UI link produces ?status=flagged — deep-link only)"
    tests:
      - file: tests/qualityPageDeepLink.test.tsx
        name: "seeds filterTherapy to \"breaker\" when ?therapy=breaker is in the URL"
      - file: tests/qualityPageDeepLink.test.tsx
        name: "seeds filterStatus to \"in_progress\" (not \"flagged\") when ?status=flagged is in the URL"
      - file: tests/qualityPageDeepLink.test.tsx
        name: "seeds filterCrt to \"implausible\" when ?crt=implausible is in the URL"
      - file: tests/qualityPageDeepLink.test.tsx
        name: "auto-opens the filter panel when ?crt=implausible is in the URL"
      - file: tests/qualityPageDeepLink.test.tsx
        name: "falls back to \"all\" for an unknown therapy param value"
      - file: tests/landingPageAlerts.test.tsx
        name: "therapy-breaker Review button navigates to /quality?therapy=breaker"
    browser:
      route: "/quality?crt=implausible"
      steps:
        - "Open /quality?crt=implausible directly."
        - "Observe the filter panel under the search box without clicking the funnel icon."
        - "Open /quality?status=flagged and /quality?therapy=breaker the same way."
      expect: "The panel is already open; \"CRT-Wert\" shows \"Unplausibel (> 400 µm)\"; with ?status=flagged \"Prüfstatus\" shows \"In Bearbeitung\"; with ?therapy=breaker \"Therapiestatus\" shows \"Therapieabbrecher\"."
    notes: "?status=flagged is reachable only by typing the URL (no UI link produces it). The filter funnel button's title is \"Filterkriterien\"."

  - id: UIR-QUAL-013
