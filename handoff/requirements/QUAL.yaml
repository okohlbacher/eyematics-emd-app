  - id: UIR-QUAL-019
    title: "Exclude / include a case from analyses"
    statement: "The user can exclude a case via \"Von Analysen ausschließen\"; it is marked \"Ausgeschlossen\", leaves the Kohortenbildung/Analyse counts, and \"In Analysen einschließen\" reverts it. On hover/focus the exclude button explains: \"Dieser Fall wird in Ihren Kohortenanalysen nicht mehr berücksichtigt. Der Ausschluss gilt nur für Ihr Benutzerkonto und ist jederzeit rückgängig zu machen über „In Analysen einschließen“.\" (Z0-P24)."
    status: implemented
    sources: ["EMDREQ-QUAL-008 / N04.04", "manual: Benutzerhandbuch §7.4", "code: src/components/quality/QualityCaseDetail.tsx:395-412"]
    evidence:
      - "src/components/quality/QualityCaseDetail.tsx:382-386 (badge), 425-443 (toggle button, Tooltip excludeFromAnalysisHint with aria-describedby only in the exclude state; Z0-P24)"
      - "src/i18n/translations.ts:529-532 (excludeFromAnalysisHint DE/EN)"
      - "src/pages/QualityPage.tsx:281,412 (toggleExcludeCase; \"Ausgeschlossene Fälle\" tile = excludedCases.length)"
      - "src/context/DataContext.tsx:150-154,244-254 (activeCases = cases minus excluded; PUT /api/data/excluded-cases)"
      - "src/pages/CohortBuilderPage.tsx:949 and src/pages/AnalysisPage.tsx:65,148 (use activeCases)"
      - "src/pages/LandingPage.tsx:52 (Startseite total uses raw cases — NOT reduced)"
    tests:
      - file: tests/dataDb.test.ts
        name: "stores and retrieves excluded cases"
    browser:
      route: "/quality"
      steps:
        - "Open /cohort (Kohortenbildung) and note the \"von N Gesamtfällen\" total; open /quality, click a case, click \"Von Analysen ausschließen\"."
        - "Observe the header badge, the button label and the \"Ausgeschlossene Fälle\" tile."
        - "Return to /cohort and read the total; then back on /quality click \"In Analysen einschließen\"."
      expect: "After exclusion the header shows the red \"Ausgeschlossen\" badge, the button reads \"In Analysen einschließen\", the \"Ausgeschlossene Fälle\" tile rises by one and the Kohortenbildung total drops by one; including again restores the total and the tile."
