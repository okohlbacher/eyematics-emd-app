# UI requirements registry — area QUAL. Generated 2026-10-08 by the ui-requirements-registry workflow;
# maintained by the uat-triage skill (promotion and amendment of tester-confirmed behaviour; see handoff/HANDOFF.md §4).
area: QUAL
requirements:
  - id: UIR-QUAL-001
    title: "Kohorte scope dropdown restricts the review set"
    statement: "The user can restrict the Datenqualität review set via the \"Kohorte\" dropdown to \"Alle Fälle\" or any saved search, and the case list and status tiles shrink to that scope."
    status: implemented
    sources: ["EMDREQ-QUAL-001 / N03.01", "code: src/pages/QualityPage.tsx:132-145,341-364"]
    evidence:
      - "src/pages/QualityPage.tsx:103 (selectedCohortId state)"
      - "src/pages/QualityPage.tsx:135-145 (scopedCases via applyFilters on the saved search)"
      - "src/pages/QualityPage.tsx:153-165,175-196 (timeScopedCases/caseStatus/statusCounts derive from the scoped set)"
      - "src/pages/QualityPage.tsx:334-353 (\"Kohorte\" <select> with associated label, \"Alle Fälle\" + savedSearches options, directly left of the region \"Filterkriterien\"; Z0-P16)"
      - "src/utils/cohortFilterSerialization.ts (safePickCohortFilter)"
    tests:
      - file: tests/qualityCohortScope.test.tsx
        name: "Selecting a cohort filtered to CENTER-A shows only MULTI-ANOMALY, hides OUTSIDER"
      - file: tests/qualityCohortScope.test.tsx
        name: "Switching back to \"All cases\" restores both cases"
      - file: tests/qualityCohortScope.test.tsx
        name: "cohort selector shows saved search names as options"
      - file: tests/qualityFlaggedCohortRoundTrip.test.tsx
        name: "scopes case list to flaggedCaseIds members when flaggedQuality cohort is selected"
    browser:
      route: "/quality"
      steps:
        - "Log in (e.g. as admin) and make sure at least one saved search exists in Kohortenbildung (/cohort) that matches fewer cases than the total."
        - "Open /quality and note the number next to \"Grundgesamtheit\" and the case-count line above the case list (\"N Fälle\")."
        - "In the single \"Kohorte\" dropdown (directly left of the region \"Filterkriterien\", \"CSV exportieren\" to the right) select the saved search."
        - "Observe the case list, the \"Grundgesamtheit\" number and the \"Ungeprüft\" / \"In Bearbeitung\" / \"Geprüft\" tiles."
        - "Select \"Alle Fälle\" again."
      expect: "After selecting the saved search the case list contains only that cohort's pseudonyms and Grundgesamtheit plus the tile totals drop to the cohort size; selecting \"Alle Fälle\" restores the original numbers."
    notes: "The dropdown lists only the signed-in user's own saved searches (per-user storage, see dataDb isolation tests). Changing the scope also clears the open case detail (QualityPage.tsx:353). Since Z0-P16 (135449d) the \"Kohorte\" select has an associated label and sits directly left of the region \"Filterkriterien\"."

  - id: UIR-QUAL-002
    title: "Per-cohort quality-check checklist persists"
    statement: "The user can, with a saved cohort selected in \"Kohorte\", tick the \"Qualitätsprüfungen für diese Kohorte\" checkboxes to choose which checks run; each toggle saves at once and persists across reload."
    status: implemented
    sources: ["EMDREQ-QUAL-001 / N03.01", "UAT v1.13 C2 / v1.12 QUAL-020/021 (confirmed v1.14)", "code: src/components/quality/QualityParamsChecklist.tsx:26-64"]
    evidence:
      - "src/pages/QualityPage.tsx:170-173 (activeQualityParams from the selected saved search)"
      - "src/pages/QualityPage.tsx:388-408 (card with hint for \"Alle Fälle\", checklist otherwise; onChange → updateSavedSearchQualityParams)"
      - "src/components/quality/QualityParamsChecklist.tsx:26-64 (one checkbox per QUALITY_PARAM_KEYS, labels via t(key))"
      - "shared/qualityParams.ts:16-23,37-78 (keys, sanitize, canonicalize, resolve)"
      - "src/context/DataContext.tsx:177-185 (updateSavedSearchQualityParams → PATCH /api/data/saved-searches/:id, server response adopted)"
      - "server/dataApi.ts:272 (PATCH /saved-searches/:id — qualityParams sanitised and persisted per user)"
      - "src/components/quality/QualityCaseDetail.tsx:140-186 (activeKeys gate every anomaly/missing check)"
    tests:
      - file: tests/qualityCohortScope.test.tsx
        name: "params (only missingVisus checked)"
      - file: tests/qualityCohortScope.test.tsx
        name: "toggling a check calls updateSavedSearchQualityParams with the canonical subset"
      - file: tests/qualityCohortScope.test.tsx
        name: "shows a select-a-cohort hint and no checkboxes in the \"all cases\" scope"
      - file: tests/qualityCohortScope.test.tsx
        name: "qualityParams=[\"missingVisus\"] also suppresses missingCrt and missingInjections"
      - file: tests/dataApiSavedSearch.test.ts
        name: "strips unknown qualityParams keys before persistence"
      - file: tests/dataApiSavedSearch.test.ts
        name: "all keys checked canonicalizes to NULL (back-compat)"
      - file: tests/qualityParams.test.ts
        name: "round-trips with resolveQualityParams"
    browser:
      route: "/quality"
      steps:
        - "Open /quality; with \"Kohorte\" = \"Alle Fälle\" the card \"Qualitätsprüfungen für diese Kohorte\" shows only the hint \"Wählen Sie oben eine Kohorte …\" and no checkboxes."
        - "Select a saved search in \"Kohorte\"; six checkboxes appear: \"Kein Visus dokumentiert\", \"Keine CRT dokumentiert\", \"Keine Injektionen dokumentiert\", \"CRT > 400 µm (kritisch)\", \"Visus < 0.1 (kritisch)\", \"Sprung > 0.3\"."
        - "Untick \"CRT > 400 µm (kritisch)\", then click a case in the list that has a CRT value above the critical threshold."
        - "Reload the page (F5), reselect the same cohort."
      expect: "The CRT check stays unticked after reload and the opened case's \"Zu prüfende Messwerte\" table shows no amber \"auffällig: CRT > 400 µm\" rows; re-ticking brings them back immediately."
    notes: "Checklist is hidden (hint only) for \"Alle Fälle\" since there is no cohort to attach the selection to. The persistence path is PATCH (not PUT); the cited dataApiSavedSearch tests exercise exactly that route."

  - id: UIR-QUAL-003
    title: "Cohort checks use live global thresholds"
    statement: "The Datenqualität anomaly evaluation uses the live global thresholds from Einstellungen for every cohort; no per-cohort threshold snapshot exists."
    status: implemented
    sources: ["UAT v1.12 Q-40-1 (confirmed by owner 2026-05-26)", "EMDREQ-QUAL-009 / N06.02", "manual: Benutzerhandbuch §7.1, §9.2"]
    evidence:
      - "src/config/clinicalThresholds.ts:15-32 (CRITICAL_CRT/VISUS/VISUS_JUMP read getSettings() on every call)"
      - "src/services/settingsService.ts:115-144 (getSettings() returns the in-memory cache that updateSettings() replaces)"
      - "src/components/quality/QualityCaseDetail.tsx:163-181 (anomaly checks call the threshold accessors)"
      - "src/pages/QualityPage.tsx:139-144,199-208,224 (getSettings() for therapy days and CRT-implausible threshold; cohort applyFilters gets the same settings)"
      - "shared/qualityParams.ts (SavedSearch stores only check keys, never threshold values)"
    tests:
      - file: tests/ui-requirements.test.ts
        name: "clinical thresholds are imported from config, not hardcoded"
    browser:
      route: "/settings"
      steps:
        - "As admin open /settings, set \"Visus kritischer Schwellenwert\" to 0.5 and \"Therapieabbrecher-Schwellenwert (Tage)\" to 60, click \"Speichern\"."
        - "Navigate to /quality, select a saved search in \"Kohorte\", open a case with a Visus between 0.1 and 0.5."
        - "Inspect the \"Zu prüfende Messwerte\" table and the header line \"Therapieabbruch/-unterbrechung\"."
        - "Restore the original values in /settings and repeat."
      expect: "With the lowered thresholds the Visus rows show the amber \"auffällig\" pill and more cases/headers read \"Therapieabbrecher (Nd)\"; restoring the settings removes them again, for every cohort alike."
    notes: "Therapy statuses are memoised on the case set (QualityPage.tsx:199-208), so a settings change takes effect after navigating back to /quality (remount). The annotation texts \"CRT > 400 µm\" / \"Visus < 0.1\" and the checklist labels are static strings and do not follow the configured value. The cited test only asserts the accessors return the config defaults; no test covers a live settings change."

  - id: UIR-QUAL-004
    title: "Time-range bar scopes the population"
    statement: "The Datenqualität page has a \"Zeitraum\" bar (\"Letzte 3 Monate\" / \"Letzte 6 Monate\" / \"Letztes Jahr\" / \"Gesamter Zeitraum\" / \"Benutzerdefiniert\" with Von/Bis) that scopes the population and the tiles."
    status: implemented
    sources: ["code: src/pages/QualityPage.tsx:147-165,329-339,401-405", "code: src/components/doc-quality/QualityFilterBar.tsx:72-126"]
    evidence:
      - "src/pages/QualityPage.tsx:105,153-165 (timeScopedCases: a case stays when it has ≥1 observation inside the window)"
      - "src/components/quality/QualityFilterPanel.tsx:62-71 (QualityFilterBar embedded in the region \"Filterkriterien\", without centre filter; Z0-P16)"
      - "src/pages/QualityPage.tsx:401-413 (Grundgesamtheit + tiles use timeScopedCases)"
      - "src/components/doc-quality/QualityFilterBar.tsx:41-46,78-126 (preset buttons, custom from/to date inputs)"
      - "src/utils/qualityMetrics.ts:170-189 (timeRangeWindow)"
    tests:
      - file: tests/QualityPage.test.tsx
        name: "switching to \"6m\" reduces denominator"
      - file: tests/QualityPage.test.tsx
        name: "time-range control (QualityFilterBar) renders on the page"
      - file: tests/qualityMetrics.test.ts
        name: "custom range: both bounds applied"
      - file: tests/qualityMetrics.test.ts
        name: "timeRangeWindow(preset) has from=cutoff and to≈now"
    browser:
      route: "/quality"
      steps:
        - "Open /quality and note \"Grundgesamtheit: N\" and the \"Ungeprüft\" tile's \"n / N\" line."
        - "In the \"Zeitraum\" bar inside the region \"Filterkriterien\" click \"Letzte 3 Monate\"."
        - "Click \"Benutzerdefiniert\"; set \"Von\" and \"Bis\" to a one-month window in the past with data."
        - "Click \"Gesamter Zeitraum\"."
      expect: "\"Letzte 3 Monate\" lowers Grundgesamtheit and every tile denominator; the custom window changes them again; \"Gesamter Zeitraum\" restores the original N."
    notes: "Statement uses the actual German preset labels. The QualityPage.test \"6m\" test clicks the real button but only asserts the population label is still present, not the reduced number; the qualityMetrics tests cover the windowing maths."

  - id: UIR-QUAL-005
    title: "Grundgesamtheit label counts distinct patients"
    statement: "The Datenqualität page shows a \"Grundgesamtheit: N\" label counting distinct patients without double-counting across centres."
    status: partial
    sources: ["UAT v1.12 QUAL-023", "code: src/pages/QualityPage.tsx:401-405"]
    evidence:
      - "src/pages/QualityPage.tsx:401-405 (renders timeScopedCases.length — a case count)"
      - "shared/patientCases.ts:65-90 (one PatientCase per Patient resource per centre bundle)"
      - "src/pages/DocQualityPage.tsx:120-129 (the distinct-pseudonym count lives on Dokumentationsqualität, not here)"
    tests:
      - file: tests/QualityPage.test.tsx
        name: "shows qualityPopulationLabel near summary cards"
      - file: tests/QualityPage.test.tsx
        name: "default \"all\" shows Grundgesamtheit = 2"
    browser:
      route: "/quality"
      steps:
        - "Open /quality with \"Kohorte\" = \"Alle Fälle\" and \"Zeitraum\" = \"Gesamter Zeitraum\"."
        - "Read \"Grundgesamtheit: N\"."
        - "Compare N with the \"N Fälle\" line above the case list and, if the data set has a pseudonym at two centres, with the number of distinct pseudonyms in the list."
      expect: "Today N equals the case count (a pseudonym present at two centres would be counted twice); the requirement expects N to equal the number of distinct pseudonyms."
    notes: "Label is implemented; the distinct-patient semantics are not — QualityPage counts cases. If the registry should match current behaviour, sharpen to: \"shows a Grundgesamtheit: N label with the number of cases in the current cohort/time scope\"."

  - id: UIR-QUAL-006
    title: "Centre chip multi-select narrows the view"
    statement: "The Datenqualität page has a multi-select \"Zentrum\" chip filter that narrows the client view and never widens beyond the user's authorised centres."
    status: implemented
    sources: ["UAT v1.12 QUAL-024 (confirmed v1.13)", "code: src/components/quality/QualityFilterPanel.tsx:117-122"]
    evidence:
      - "src/components/quality/QualityFilterPanel.tsx:117-122 (CenterMultiSelect in the collapsible part of the region \"Filterkriterien\"; Z0-P16)"
      - "src/components/common/CenterMultiSelect.tsx:40-95 (toggle chips, count badge, \"Zurücksetzen\", \"Alle Zentren\")"
      - "src/pages/QualityPage.tsx:210-213,219 (centerNames from the loaded cases; selectedCenters narrows filteredCases)"
      - "server/fhirApi.ts:110,404 (filterBundlesByCenters — server only returns authorised centres; client cannot widen)"
    tests:
      - file: tests/CenterMultiSelect.test.tsx
        name: "clicking an unselected option calls onChange with it added"
      - file: tests/CenterMultiSelect.test.tsx
        name: "clear affordance calls onChange with empty array"
      - file: tests/CenterMultiSelect.test.tsx
        name: "with empty selected shows all-centers label"
      - file: tests/fhirApi.test.ts
        name: "filterBundlesByCenters() with local bundles filters to user centers only"
    browser:
      route: "/quality"
      steps:
        - "Open /quality as a non-admin user assigned to two or more centres; click the funnel icon (title \"Filterkriterien\") next to the search box in the region \"Filterkriterien\"."
        - "Under \"Zentrum\" click one centre chip, then a second one; note the blue count badge."
        - "Click \"Zurücksetzen\"."
      expect: "With two chips active only cases of those two centres are listed and the count line reads \"N gefiltert / M Fälle\"; after \"Zurücksetzen\" the label \"Alle Zentren\" shows and all cases of the user's authorised centres (never others) are listed."
    notes: " Since Z0-P16 (135449d) all case-list filters sit in one region \"Filterkriterien\" (role=region; Zeitraum, search and toggle always visible; Prüfstatus, Zentrum, Therapiestatus, CRT-Wert, \"Ausgeschlossene anzeigen\" collapsible, Q14 a/b); the toggle keeps title \"Filterkriterien\" (C13). tests/acceptance/Z0/Z0-P16.spec.ts asserts the region contents and the single adjacent \"Kohorte\" control (\"directly next to\" read as a gap ≤ 32 px, team to confirm). Open: the filter labels are not associated with their selects (htmlFor missing, pre-existing)."

  - id: UIR-QUAL-007
    title: "Summary tiles with counts, n/total and percentage"
    statement: "The Datenqualität page shows summary tiles \"Ungeprüft\", \"In Bearbeitung\", \"Geprüft\" and \"Ausgeschlossene Fälle\", each with count / total and a percentage for the current scope."
    status: partial
    sources: ["EMDREQ-QUAL-002 / N03.02", "UAT v1.10 QUAL-011; v1.12 QUAL-023", "code: src/pages/QualityPage.tsx:35-53,416-421"]
    evidence:
      - "src/pages/QualityPage.tsx:35-53 (SummaryCard shows \"n / total\" and % only when total is passed)"
      - "src/pages/QualityPage.tsx:409-411 (three status tiles receive total=timeScopedCases.length)"
      - "src/pages/QualityPage.tsx:412 (\"Ausgeschlossene Fälle\" tile = excludedCases.length — global, no total)"
      - "src/pages/QualityPage.tsx:175-196 (caseStatus / statusCounts)"
    tests:
      - file: tests/QualityPage.test.tsx
        name: "summary cards render count + percentage without hover"
    browser:
      route: "/quality"
      steps:
        - "Open /quality."
        - "Read the four tiles under the Grundgesamtheit line."
        - "Add the big numbers of \"Ungeprüft\", \"In Bearbeitung\" and \"Geprüft\"."
        - "Select a saved search in \"Kohorte\" that contains no excluded case and re-read the \"Ausgeschlossene Fälle\" tile."
      expect: "The first three tiles each show the count, a \"n / N\" line and a percentage; the sum of their counts equals Grundgesamtheit N. The \"Ausgeschlossene Fälle\" tile shows the count only (no n / N, no %) and does not change with the cohort/time scope."
    notes: "Two deviations from the statement: the \"Ausgeschlossene Fälle\" tile has no n/N and no %, and it counts ALL of the user's excluded cases regardless of the cohort/time scope. The three status counts include excluded cases. The cited test only asserts that the three status labels render."

  - id: UIR-QUAL-008
    title: "Pseudonym search narrows the case list"
    statement: "The user can search the Datenqualität case list by pseudonym (\"Pseudonym suchen...\") and the list narrows with a \"x gefiltert / n Fälle\" count line."
    status: implemented
    sources: ["EMDREQ-QUAL-003 / N03.07", "code: src/components/quality/QualityFilterPanel.tsx:75-81", "code: src/components/quality/QualityCaseList.tsx:74-78"]
    evidence:
      - "src/components/quality/QualityFilterPanel.tsx:75-81 (search input, placeholder \"Pseudonym suchen...\", in the region \"Filterkriterien\"; Z0-P16)"
      - "src/pages/QualityPage.tsx:217 (case-insensitive substring match on pseudonym)"
      - "src/components/quality/QualityCaseList.tsx:74-78 (count line \"N gefiltert / M Fälle\" vs \"M Fälle\")"
    tests: []
    browser:
      route: "/quality"
      steps:
        - "Open /quality; note the \"M Fälle\" line above the list."
        - "Type the first three characters of a visible pseudonym into the \"Pseudonym suchen...\" box."
