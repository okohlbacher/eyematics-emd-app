  - id: UIR-QUAL-032
    title: "Multiple flags on one parameter are independent"
    statement: "The UI treats several flags on one parameter independently: changing one flag's status affects only that flag."
    status: implemented
    sources: ["UAT v1.10 QUAL-006", "code: src/context/DataContext.tsx:215-231"]
    evidence:
      - "src/context/DataContext.tsx:215-231 (updateQualityFlag matches caseId + flaggedAt → one flag)"
      - "src/pages/QualityPage.tsx:250-269 (setRowVerdict updates the first flag of the parameter, otherwise creates one)"
