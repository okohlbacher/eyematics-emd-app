# UI requirements registry — area COH. Generated 2026-10-08 by the ui-requirements-registry workflow;
# maintained by the uat-triage skill (promotion and amendment of tester-confirmed behaviour; see handoff/HANDOFF.md §4).
area: COH
requirements:
  - id: UIR-COH-001
    title: "Non-admin users see only their assigned centres"
    statement: "The UI shows a non-admin user only cases from that user's assigned centres: the Kohortenbildung case count and \"Zentren\" filter contain no other centre."
    status: implemented
    sources: ["spec: EMDREQ-USM-004 / N10.02", "manual: Benutzerhandbuch §4.1"]
    evidence:
      - "server/fhirApi.ts:81-83 (isBypass: only role === 'admin' bypasses)"
      - "server/fhirApi.ts:396-410 (GET /bundles filtered by req.auth.centers via filterBundlesByCenters)"
      - "src/context/DataContext.tsx:124-126 (centers = extractCenters(filtered bundles); cases = extractPatientCases(filtered bundles))"
      - "src/services/fhirLoader.ts:51-75 (centre name = Organization.name of the loaded bundle)"
      - "src/pages/CohortBuilderPage.tsx:658-680 (\"Zentren\" checkboxes map over centers from context)"
      - "src/pages/CohortBuilderPage.tsx:945-950 (count from activeCases)"
      - "data/users.json:24-30 (forscher1 → centers [org-uka])"
    tests:
      - file: tests/fhirApi.test.ts
        name: "Test 1: filterBundlesByCenters() with local bundles filters to user centers only"
      - file: tests/fhirApi.test.ts
        name: "Test 4: isBypass() returns false for non-admin even with all 6 org-* centers"
      - file: tests/centerBypass.test.ts
        name: "non-admin never bypasses, even with all valid centers"
    browser:
      route: "/cohort"
      steps:
        - "Log in as forscher1 (single-centre user) and open /cohort."
        - "Under \"Filterkriterien\" > \"Zentren\" read the listed centre checkboxes."
        - "Read the header \"Kohorte: N Fälle\" / \"von M Gesamtfällen\" with no filter set."
        - "Open the Startseite and read the case count of that centre's card."
        - "Log out, log in as admin, open /cohort and count the \"Zentren\" checkboxes."
      expect: "forscher1 sees exactly one checkbox \"Universitätsklinikum Aachen\" under \"Zentren\" and M equals the Aachen (UKA) case count on the Startseite; admin sees six centre checkboxes."
    notes: "Centre list is derived client-side from the server-filtered bundles, so no other centre can appear. The checkbox label is Organization.name (\"Universitätsklinikum Aachen\"), not the shorthand UKA."
  - id: UIR-COH-002
    title: "Filter panel offers six filter groups"
    statement: "The Kohortenbildung page offers the filter groups \"Diagnose\", \"Geschlecht\", \"Zentren\", \"Alter (Jahre)\", \"Visus (0.0 – 1.0)\" and \"Netzhautdicke (µm)\" under \"Filterkriterien\"."
    status: implemented
    sources: ["spec: EMDREQ-KOH-001 / N02.01", "code: src/pages/CohortBuilderPage.tsx:597-853", "manual: Benutzerhandbuch §4.1"]
    evidence:
      - "src/pages/CohortBuilderPage.tsx:597-853 (six labelled groups: t('diagnosis') 600, t('gender') 629, t('centers') 658, t('ageYears') 687, t('visusDecimal') 744, t('retinalThickness') 801)"
      - "src/i18n/translations.ts:40,43,153-156 (German labels)"
    tests: []
    browser:
      route: "/cohort"
      steps:
        - "Log in as admin and open /cohort."
        - "In the left panel titled \"Filterkriterien\" scroll through all groups."
      expect: "The six group labels \"Diagnose\", \"Geschlecht\", \"Zentren\", \"Alter (Jahre)\", \"Visus (0.0 – 1.0)\" and \"Netzhautdicke (µm)\" are rendered in that order below the \"Schnellauswahl\" presets."
    notes: "No test asserts the presence of all six groups; the RTL tests only touch age/visus/CRT inputs and preset buttons."
  - id: UIR-COH-003
    title: "Diagnosis checkboxes AMD / DR filter the case list"
    statement: "The user can tick the diagnosis checkboxes \"AMD (Altersbedingte Makuladegeneration)\" and \"Diabetische Retinopathie\" (multi-select) and the case list narrows to cases with a ticked diagnosis."
    status: implemented
    sources: ["spec: EMDREQ-KOH-002 / N02.02", "manual: Benutzerhandbuch §4.1"]
    evidence:
      - "src/pages/CohortBuilderPage.tsx:598-626 (two checkboxes for SNOMED_AMD / SNOMED_DR, array toggle)"
      - "src/i18n/translations.ts:148-152 (labels 'AMD (Altersbedingte Makuladegeneration)', 'Diabetische Retinopathie')"
      - "shared/patientCases.ts:139-142 (applyFilters: diagnosis OR within group)"
    tests: []
    browser:
      route: "/cohort"
      steps:
        - "Open /cohort, click \"Detailansicht\" and note the count in \"Kohorte: N Fälle\"."
        - "Under \"Diagnose\" tick only \"AMD (Altersbedingte Makuladegeneration)\" (first checkbox)."
        - "Read the \"Diagnose\" column of every table row and the new count."
        - "Additionally tick \"Diabetische Retinopathie\"."
      expect: "After step 2 the count drops and every row shows an AMD diagnosis; after step 4 the count rises again (OR within diagnosis) and rows show AMD or DR."
    notes: "Statement sharpened: the first checkbox label is the full \"AMD (Altersbedingte Makuladegeneration)\". tests/ui-requirements.test.ts 'KOH-001/002' re-implements the filter inline and does not exercise the real applyFilters, so it is not cited."
  - id: UIR-COH-004
    title: "Gender checkboxes filter the case list"
    statement: "The user can tick the gender checkboxes (\"Weiblich\", \"Männlich\") and the case list narrows to the selected genders."
    status: implemented
    sources: ["spec: EMDREQ-KOH-002 / N02.02", "manual: Benutzerhandbuch §4.1"]
    evidence:
      - "src/pages/CohortBuilderPage.tsx:627-655 (checkboxes for 'female','male' labelled t('female')/t('male'))"
      - "src/i18n/translations.ts:34,36 ('Weiblich','Männlich')"
      - "src/pages/CohortBuilderPage.tsx:1083-1085 (table cell shows femaleShort 'W' / maleShort 'M')"
      - "shared/patientCases.ts:138 (applyFilters gender predicate)"
    tests: []
    browser:
      route: "/cohort"
      steps:
        - "Open /cohort and click \"Detailansicht\"."
        - "Under \"Geschlecht\" tick only \"Weiblich\"."
        - "Read the \"Geschlecht\" column of all rows."
      expect: "Every row shows the female short label \"W\" and the count in \"Kohorte: N Fälle\" is below the unfiltered count."
    notes: "Labels are capitalised \"Weiblich\" / \"Männlich\" (female listed first). The only gender-filter test (ui-requirements) uses an inline copy of the predicate, not the real code."
  - id: UIR-COH-005
    title: "Centre checkboxes filter the case list"
    statement: "The user can multi-select centres under \"Zentren\" and the case list narrows to cases from the ticked centres."
    status: implemented
    sources: ["spec: EMDREQ-KOH-002 / N02.02", "manual: Benutzerhandbuch §4.1"]
    evidence:
      - "src/pages/CohortBuilderPage.tsx:656-684 (one checkbox per centers entry, filters.centers array)"
      - "shared/patientCases.ts:137 (applyFilters centers predicate)"
