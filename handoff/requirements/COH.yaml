    notes: ""
  - id: UIR-COH-006
    title: "Age range filter (min–max years)"
    statement: "The user can enter a minimum and maximum age in years and the case list narrows to cases whose age lies within the range."
    status: implemented
    sources: ["spec: EMDREQ-KOH-002 / N02.02", "manual: Benutzerhandbuch §4.1"]
    evidence:
      - "src/pages/CohortBuilderPage.tsx:685-740 (number inputs Min/Max; ageRange [min, max ?? 120] / [min ?? 0, max])"
      - "shared/patientCases.ts:143-146 (applyFilters age predicate via getAge)"
    tests: []
    browser:
      route: "/cohort"
      steps:
        - "Open /cohort and click \"Detailansicht\"."
        - "Under \"Alter (Jahre)\" type 60 into \"Min\" and 70 into \"Max\"."
        - "Read the \"Alter\" column of every row and the count line."
      expect: "\"Kohorte: N Fälle\" drops and every row shows an age between 60 and 70 inclusive."
    notes: "tests/cohortFilterPersistence.test.tsx 'typing an age filter writes JSON…' asserts the input binds to ageRange but not the narrowing of the list. Default upper bound when only Min is set is 120."
  - id: UIR-COH-007
    title: "Visus range filter accepts comma or dot decimals"
    statement: "The user can enter a visus range (0.0–1.0, decimal with comma or dot; placeholders \"0,0\" and \"1,0\") and the case list narrows accordingly."
    status: implemented
    sources: ["spec: EMDREQ-KOH-002 / N02.02", "code: src/pages/CohortBuilderPage.tsx:742-797", "manual: Benutzerhandbuch §4.1"]
    evidence:
      - "src/pages/CohortBuilderPage.tsx:742-797 (text inputs inputMode=decimal, placeholders \"0,0\"/\"1,0\", parseFloat(raw.replace(',', '.')))"
      - "src/pages/CohortBuilderPage.tsx:182-197 (visus text state)"
      - "shared/patientCases.ts:147-152 (applyFilters visus predicate on latest LOINC_VISUS)"
    tests:
      - file: tests/cohortFilterPersistence.test.tsx
        name: "Reset button also clears visusMinText and visusMaxText"
    browser:
      route: "/cohort"
      steps:
        - "Open /cohort and click \"Detailansicht\"; note the count."
        - "Under \"Visus (0.0 – 1.0)\" type 0,5 into the field with placeholder \"0,0\"."
        - "Then type 0.3 into the field with placeholder \"1,0\"."
      expect: "After step 2 the count drops and all rows show Visus ≥ 0.50; after step 3 the red alert \"Untergrenze darf die Obergrenze nicht überschreiten\" appears and the count returns to the unfiltered value (invalid range ignored)."
    notes: "The cited test types a dot decimal into the \"0,0\" input and asserts the value is accepted; narrowing of the list is not asserted by any test. Cases without a visus observation are excluded whenever a visus range is active."
  - id: UIR-COH-008
    title: "CRT (retinal thickness) range filter"
    statement: "The user can enter a minimum and maximum retinal thickness (µm) under \"Netzhautdicke (µm)\" and the case list narrows to cases within the range."
    status: implemented
    sources: ["spec: EMDREQ-KOH-002 / N02.02", "manual: Benutzerhandbuch §4.1"]
    evidence:
      - "src/pages/CohortBuilderPage.tsx:799-854 (number inputs; crtRange [min, max ?? 800] / [min ?? 0, max])"
      - "shared/patientCases.ts:153-158 (applyFilters CRT predicate on latest LOINC_CRT)"
    tests: []
    browser:
      route: "/cohort"
      steps:
        - "Open /cohort and click \"Detailansicht\"; note the count."
        - "Under \"Netzhautdicke (µm)\" type 400 into \"Min\"."
        - "Read the \"CRT (µm)\" column of every row."
      expect: "The count decreases and every row shows a CRT value ≥ 400 (no \"—\" rows, since cases without CRT are excluded)."
    notes: "Default upper bound when only Min is set is 800 µm, so values above 800 are also excluded."
  - id: UIR-COH-009
    title: "All active filters combine; no filter shows all cases"
    statement: "The Kohortenbildung page combines all active categorical and range filters (AND) and shows every case of the assigned centres when no filter is set."
    status: implemented
    sources: ["spec: EMDREQ-KOH-002 / N02.02", "manual: Benutzerhandbuch §4.1, §14"]
    evidence:
      - "shared/patientCases.ts:136-230 (applyFilters: sequential guard clauses, any failing predicate excludes the case)"
      - "src/pages/CohortBuilderPage.tsx:317-325 (filteredCases = applyFilters(activeCases, validFilters))"
    tests:
      - file: tests/cohortPresets.test.ts
        name: "passes all cases when filters is empty"
    browser:
      route: "/cohort"
      steps:
        - "Open /cohort, click \"Zurücksetzen\" and read \"Kohorte: N Fälle\"."
        - "Open the Startseite and read \"Pseudonymisierte Fälle\"."
        - "Back on /cohort tick \"AMD (Altersbedingte Makuladegeneration)\" and note N1; untick, tick \"Weiblich\" and note N2; untick, tick one centre and note N3."
        - "Tick all three together."
      expect: "Step 1 N equals the Startseite count (when no case is excluded on Datenqualität); the combined count in step 4 is ≤ min(N1, N2, N3)."
    notes: "Startseite \"Pseudonymisierte Fälle\" uses cases.length (src/pages/LandingPage.tsx:52) whereas the cohort total uses activeCases (excluded cases removed), so the two differ by the number of excluded cases."
  - id: UIR-COH-010
    title: "Live case count \"Kohorte: N Fälle von M\""
    statement: "The Kohortenbildung results header shows \"Kohorte: <n> Fälle\" and \"von <total> Gesamtfällen\" and the count and list update live as filters change, with no apply button."
    status: implemented
    sources: ["spec: EMDREQ-KOH-003 / N02.03", "code: src/pages/CohortBuilderPage.tsx:943-951"]
    evidence:
      - "src/pages/CohortBuilderPage.tsx:945-950 (header: t('cohortCases'): {filteredCases.length} t('cases'); t('of') {activeCases.length} t('totalCases'))"
      - "src/i18n/translations.ts:200-202 ('Kohorte', 'Gesamtfällen', 'von')"
      - "src/pages/CohortBuilderPage.tsx:317-325 (useMemo recomputes on every filter change)"
    tests:
      - file: tests/advancedFilterDialog.test.tsx
        name: "flaggedQuality preset builds flaggedCaseIds from open qualityFlags"
    browser:
      route: "/cohort"
      steps:
        - "Open /cohort and click \"Detailansicht\"."
        - "Tick one centre checkbox under \"Zentren\" and do not click anything else."
      expect: "The header line \"Kohorte: N Fälle\" and the sub-line \"von M Gesamtfällen\" are visible; N and the table rows change immediately on the tick; there is no apply button anywhere in the filter panel."
    notes: "The sub-line reads \"von <total> Gesamtfällen\". The cited test (tests/advancedFilterDialog.test.tsx:414-462) asserts the result count text shows 2 after a preset click without any apply step."
  - id: UIR-COH-011
    title: "Inline validation for invalid numeric ranges"
    statement: "The Kohortenbildung page shows a red role=alert under an age, visus or CRT field whose value is negative, non-numeric, min > max or visus > 1, and ignores that invalid range for the live results."
    status: implemented
    sources: ["spec: EMDREQ-KOH-002 / N02.02", "code: src/pages/CohortBuilderPage.tsx:247-278,309-315,730-738,787-795,844-852", "uat: v1.10 A-03 / KOH-002"]
    evidence:
      - "src/pages/CohortBuilderPage.tsx:247-278 (ageError / visusError / crtError derivations)"
      - "src/pages/CohortBuilderPage.tsx:309-315 (validFilters strips invalid ranges)"
      - "src/pages/CohortBuilderPage.tsx:730-740,787-797,844-854 (role=\"alert\" red messages)"
      - "src/pages/CohortBuilderPage.tsx:917 (\"Kohorte speichern\" disabled while hasAnyFilterError)"
      - "src/i18n/translations.ts:1101-1106 (German messages)"
    tests:
      - file: tests/cohortBuilderValidation.test.tsx
        name: "age min above age max shows cohortValidationAgeLowerExceedsUpper error and disables Save"
      - file: tests/cohortBuilderValidation.test.tsx
        name: "negative age min shows cohortValidationAgeNonNumeric and disables Save"
      - file: tests/cohortBuilderValidation.test.tsx
        name: "visus min above 1 shows cohortValidationVisusOutOfRange and disables Save"
      - file: tests/cohortBuilderValidation.test.tsx
        name: "CRT min above CRT max shows cohortValidationCrtLowerExceedsUpper and disables Save"
      - file: tests/cohortBuilderValidation.test.tsx
        name: "clearing invalid input removes the error"
    browser:
      route: "/cohort"
      steps:
        - "Open /cohort and note the unfiltered count."
        - "Under \"Alter (Jahre)\" type 80 into \"Min\" and 20 into \"Max\"."
        - "Clear both, then type -5 into \"Min\"."
        - "Under \"Visus (0.0 – 1.0)\" type 1,5 into the \"0,0\" field."
      expect: "Step 2: red text \"Untergrenze darf die Obergrenze nicht überschreiten\" under the age fields and the count equals the unfiltered count. Step 3: red \"Ungültige Eingabe: nur Zahlen ≥ 0 erlaubt\". Step 4: red \"Visus muss im Bereich 0–1 liegen\"; \"Kohorte speichern\" is disabled while any alert is shown."
    notes: "Non-numeric text such as 'abc' cannot be entered into the type=number age/CRT inputs in a browser; the visus text input accepts letters but then simply leaves the range unset (no alert). The cited tests assert the message, role=alert and the disabled save button, not that the live count ignores the invalid range."
  - id: UIR-COH-012
    title: "Plausibility warning for out-of-range filter values"
    statement: "The Kohortenbildung page validates filter values against the configured plausibility ranges and shows a warning for implausible values such as CRT 5000."
    status: not_implemented
    sources: ["uat: v1.12 roadmap (plausibility validation, closed by v1.11 Phase 33)"]
    evidence:
      - "src/pages/CohortBuilderPage.tsx:247-278 (only rules: ≥ 0, min ≤ max, visus ≤ 1; no upper bound for age/CRT)"
      - "src/pages/CohortBuilderPage.tsx:318-322 (getSettings() is only read for therapy/CRT-implausibility thresholds; settings.plausibility is never referenced on this page)"
      - "src/services/settingsService.ts:39-40 (plausibility config exists but is only consumed by SettingsPage/DocQualityPage)"
    tests: []
    browser:
      route: "/cohort"
      steps:
        - "Open /cohort."
        - "Under \"Netzhautdicke (µm)\" type 5000 into \"Max\"."
        - "Under \"Alter (Jahre)\" type 300 into \"Max\"."
      expect: "Currently no warning appears for either value; the requirement expects a plausibility warning under the field."
    notes: "The Phase 33 'plausibility validation' materialised as the structural rules of UIR-COH-011 only. The CFG-02 plausibility ranges (shared/thresholdConfig.ts) are not referenced by the cohort builder."
  - id: UIR-COH-013
    title: "\"Zurücksetzen\" clears all filters"
    statement: "The \"Zurücksetzen\" button clears all filter criteria (including an active preset and advanced filters), restores the full case count and removes the stored filter state."
    status: implemented
    sources: ["spec: EMDREQ-KOH-002 / N02.02", "code: src/pages/CohortBuilderPage.tsx:68-76,91-104,180-197,856-866"]
    evidence:
      - "src/pages/CohortBuilderPage.tsx:856-866 (setFilters({}), clears visus texts, sessionStorage.removeItem('emd-cohort-filters'))"
      - "src/pages/CohortBuilderPage.tsx:91-104 (empty filter object removes the storage key)"
    tests:
      - file: tests/cohortFilterPersistence.test.tsx
        name: "Reset button clears filters and removes sessionStorage key"
      - file: tests/cohortFilterPersistence.test.tsx
        name: "Reset button also clears visusMinText and visusMaxText"
    browser:
      route: "/cohort"
      steps:
        - "Open /cohort; click \"Therapie-Abbrecher\", tick \"AMD (Altersbedingte Makuladegeneration)\", type 60 into age \"Min\", open \"Erweiterte Filter\", choose \"OD (rechtes Auge)\" and click \"Filter anwenden\"."
        - "Click \"Zurücksetzen\"."
        - "Reload the page."
      expect: "After step 2 all checkboxes are unticked, all inputs empty, no preset has aria-pressed=true, the \"Erweiterte Filter\" button shows no badge and the count equals the unfiltered total; after reload the page is still empty."
    notes: "Clicking \"Therapie-Abbrecher\" first and then ticking AMD clears the preset again (UIR-COH-016); the reset still covers every field. The unfiltered total equals Startseite \"Pseudonymisierte Fälle\" only when no case is excluded on Datenqualität (see UIR-COH-009)."
  - id: UIR-COH-014
    title: "Filter state survives reload and navigation"
    statement: "The Kohortenbildung filter state (including visus text) is preserved across a page reload and when the user navigates to Analyse and back."
    status: implemented
    sources: ["code: src/pages/CohortBuilderPage.tsx:68-76,91-104,180-197 (sessionStorage 'emd-cohort-filters')", "uat: v1.12 roadmap (filter persistence, closed by v1.11 Phase 33); v1.10 KOH-003 backlog"]
    evidence:
      - "src/pages/CohortBuilderPage.tsx:68-76 (lazy init from sessionStorage via safePickCohortFilter)"
      - "src/pages/CohortBuilderPage.tsx:91-104 (write on every change; Set→array)"
      - "src/pages/CohortBuilderPage.tsx:182-197 (visus text inputs seeded from restored visusRange)"
    tests:
      - file: tests/cohortFilterPersistence.test.tsx
        name: "on mount, filters initialize from sessionStorage (round-trip)"
      - file: tests/cohortFilterPersistence.test.tsx
        name: "typing an age filter writes JSON to sessionStorage under emd-cohort-filters"
    browser:
      route: "/cohort"
      steps:
        - "Open /cohort; tick \"AMD (Altersbedingte Makuladegeneration)\", type 60/70 into age, type 0,5 into the visus \"0,0\" field."
        - "Reload the page."
        - "Click \"Kohorte analysieren\", then use the browser Back button."
      expect: "After step 2 and after step 3 the same checkbox, age and visus values (0.5 shown in the visus field) are still set and the count is unchanged."
    notes: "Persistence is per browser tab (sessionStorage); clearing on logout is UIR-COH-043."
  - id: UIR-COH-015
    title: "\"Schnellauswahl\" presets filter with one click"
    statement: "The Kohortenbildung presets \"Therapie-Abbrecher\", \"Unplausible CRT-Werte\", \"Markierte Qualitätsfälle\" and \"Implausible Visus\" filter with one click (aria-pressed); clicking the active one clears it."
    status: implemented
    sources: ["spec: EMDREQ-QUAL-010 / N06.03", "code: src/pages/CohortBuilderPage.tsx:559-595,205-224", "uat: v1.12 roadmap (cohort presets)"]
    evidence:
      - "src/pages/CohortBuilderPage.tsx:559-595 (four Buttons, aria-pressed, ring highlight, toggle via applyPreset/clearPreset)"
      - "src/pages/CohortBuilderPage.tsx:205-224 (applyPreset / clearPreset)"
      - "shared/patientCases.ts:160-183 (preset predicates incl. therapy-breaker thresholds from settings)"
      - "src/i18n/translations.ts:1109-1113 (labels)"
    tests:
      - file: tests/advancedFilterDialog.test.tsx
        name: "renders all four preset buttons"
      - file: tests/advancedFilterDialog.test.tsx
        name: "clicking a preset sets aria-pressed=true on that button"
      - file: tests/advancedFilterDialog.test.tsx
        name: "clicking the active preset again clears it (toggle off)"
      - file: tests/cohortPresets.test.ts
        name: "returns only breaker cases"
    browser:
      route: "/cohort"
      steps:
        - "Open /cohort and note the unfiltered count."
        - "Click \"Therapie-Abbrecher\" under \"Schnellauswahl\"."
        - "Open /quality?therapy=breaker and count the listed cases."
        - "Back on /cohort click \"Therapie-Abbrecher\" again."
      expect: "Step 2: button has aria-pressed=\"true\" with a teal ring and the count drops to the number of breaker cases seen in step 3; step 4: aria-pressed=\"false\" and the count returns to the unfiltered total."
    notes: "The Startseite attention item \"Therapie-Abbrecher\" links to /quality?therapy=breaker (src/pages/QualityPage.tsx:92-95). That list is built from all cases incl. excluded ones (QualityPage.tsx:133-145), so the counts match only when no case is excluded."
  - id: UIR-COH-016
    title: "Editing a manual filter clears the active preset"
    statement: "The Kohortenbildung page clears an active preset whenever the user edits any manual filter (diagnosis, gender, centre, age, visus, CRT)."
    status: implemented
    sources: ["code: src/pages/CohortBuilderPage.tsx:280-290"]
    evidence:
      - "src/pages/CohortBuilderPage.tsx:281-291 (clearPresetOnManualEdit strips preset + flaggedCaseIds)"
      - "src/pages/CohortBuilderPage.tsx:608,637,666,700,710,756,776,812,826 (every manual filter onChange routes through clearPresetOnManualEdit)"
    tests:
      - file: tests/advancedFilterDialog.test.tsx
        name: "editing a manual filter field (diagnosis checkbox) clears the active preset"
    browser:
      route: "/cohort"
      steps:
        - "Open /cohort and click \"Unplausible CRT-Werte\"."
        - "Tick \"AMD (Altersbedingte Makuladegeneration)\" under \"Diagnose\"."
      expect: "Immediately after step 2 the \"Unplausible CRT-Werte\" button has aria-pressed=\"false\" and no ring; only the AMD filter is applied."
