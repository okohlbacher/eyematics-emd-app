      - "src/pages/CohortBuilderPage.tsx:513-519 (Play button title 'Ausführen')"
      - "src/pages/CohortBuilderPage.tsx:182-197 (visus text state only seeded from sessionStorage on mount)"
      - "server/dataApi.ts:157-189 + shared/savedSearchSanitize.ts:59-62 (server returns flaggedCaseIds as string[] wire form)"
      - "shared/patientCases.ts:174 (applyFilters calls filters.flaggedCaseIds?.has → TypeError on an array; probe-verified: 'filters.flaggedCaseIds?.has is not a function')"
      - "src/pages/QualityPage.tsx:140 (contrast: QualityPage rehydrates via safePickCohortFilter before applyFilters)"
    tests: []
    browser:
      route: "/cohort"
      steps:
        - "Save a search \"Visus Test\" with \"AMD (Altersbedingte Makuladegeneration)\" ticked and visus 0,2–0,6."
        - "Click \"Zurücksetzen\"."
        - "Open \"Gespeicherte Suchen (n)\" and click the \"Ausführen\" (play) icon on \"Visus Test\"."
        - "Click \"Zurücksetzen\", click \"Markierte Qualitätsfälle\" (≥1 open flag), save as \"Flag Test\", click \"Zurücksetzen\", then \"Ausführen\" on \"Flag Test\"."
      expect: "Step 3 expected: AMD ticked, visus fields show 0.2 and 0.6 and the count matches. Observed: AMD ticked and the count matches, but both visus fields stay empty although the range is applied. Step 4 expected: preset active with the flagged count. Observed: the page crashes (error boundary) with a TypeError."
    notes: "Two defects: (1) handleLoadSearch does not update visusMinText/visusMaxText; (2) it passes the server's wire-form filters (flaggedCaseIds as array) straight into applyFilters, which calls Set.has — a saved \"Markierte Qualitätsfälle\" search cannot be re-executed. Checkbox, age and CRT inputs populate correctly."
