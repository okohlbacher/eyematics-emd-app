    notes: "The same banner (same headline text) is reused after \"Passwort zurücksetzen\"."
  - id: UIR-ADMIN-014
    title: "\"Kopieren\" copies password and shows \"Kopiert!\""
    statement: "The user can click \"Kopieren\" in the generated-password banner to copy the password to the clipboard, and the link reads \"Kopiert!\" for about 2 seconds."
    status: implemented
    sources: ["uat: v1.10 USM-001", "code: src/pages/AdminPage.tsx:500-513"]
    evidence:
      - "src/pages/AdminPage.tsx:500-513 — navigator.clipboard.writeText, copyFeedback true for 2000 ms; on rejection a retry without feedback"
      - "src/i18n/translations.ts:19,24 — copy 'Kopieren', copied 'Kopiert!'"
    tests: []
    browser:
      route: "/admin"
      steps:
        - "Log in as admin, open \"Verwaltung\", create a user or click the key icon \"Passwort zurücksetzen\" on a test user and confirm."
        - "Click \"Kopieren\" in the green banner."
        - "Paste into the \"Nutzer suchen…\" field."
      expect: "The link text changes to 'Kopiert!' and reverts to 'Kopieren' after ~2 s; the pasted text equals the displayed password."
    notes: "Requires a secure context (HTTPS or localhost) for navigator.clipboard; if the clipboard call is rejected the link stays 'Kopieren' with no error shown."
  - id: UIR-ADMIN-015
    title: "Password banner dismisses and is never re-shown"
    statement: "The generated-password banner can be dismissed with \"Schließen\" and auto-dismisses after 30 seconds, after which no control re-displays the password."
    status: implemented
    sources: ["manual: Benutzerhandbuch §12.1", "code: src/pages/AdminPage.tsx:138-143,516-521", "spec: EMDREQ-USM-001 / N10.03"]
    evidence:
      - "src/pages/AdminPage.tsx:138-143 — setTimeout 30_000 clears generatedPassword"
      - "src/pages/AdminPage.tsx:516-521 — t('dismiss') = 'Schließen' sets generatedPassword null"
      - "server/auth/userAdminApi.ts:133-135,373-375 — password returned once with Cache-Control: no-store; only the bcrypt hash is stored"
    tests: []
    browser:
      route: "/admin"
