  - id: UIR-ADMIN-023
    title: "Password reset invalidates old password and sessions"
    statement: "The Verwaltung page's password reset makes the user's old password stop working immediately and makes that user's refresh sessions fail at their next refresh, so they must log in again."
    status: partial
    sources: ["manual: Deployment.md Erster Start (Administration → Benutzer)", "code: server/auth/userAdminApi.ts:349-371"]
    evidence:
      - "server/auth/userAdminApi.ts:349-371 — new bcrypt hash + tokenVersion bump + passwordChangedAt in one write"
      - "server/auth/loginApi.ts:314-319 — refresh rejects stale tokenVersion → revokeSession(jti) + 401"
      - "server/auth/loginApi.ts:326 — access token TTL 10 min; authMiddleware does not re-check tokenVersion"
      - "server/auth/userAdminApi.ts:339-376 — no revokeByUsername call on password reset, unlike delete (:176) and deactivate (:259)"
    tests:
      - file: tests/credentialMutationInvalidation.test.ts
        name: "admin password reset bumps tokenVersion + passwordChangedAt; old refresh → 401"
    browser:
      route: "/admin"
      steps:
        - "Log in as forscher2 in a private window and open the Startseite."
        - "As admin, open \"Verwaltung\", expand \"Sitzungen\" on forscher2 (1 session), click the key icon on forscher2 and confirm."
        - "Re-open \"Sitzungen\" on forscher2 immediately."
        - "In the private window keep using the app for up to 10 minutes, then try to navigate."
        - "Log out there and log in as forscher2 with the OLD password."
      expect: "Step 3 still lists the session as active; within ≤10 min the forscher2 window is sent to the login page (refresh refused); the old password is rejected at login; the new password from the banner works."
    notes: "Marked partial: invalidation is effective at the next refresh (access tokens live up to 10 min), and the reset does not revoke session rows, so the \"Sitzungen\" panel keeps listing them as active until the client's next refresh attempt (which revokes that jti) or until expiry if the client is closed. The confirm text promises 'bestehende Sitzungen werden ungültig', which the panel does not reflect immediately. Note corrected: a stale-version refresh does call revokeSession(jti), so rows do not necessarily persist 'until expiry'."
