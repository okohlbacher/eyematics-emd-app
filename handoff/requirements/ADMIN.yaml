  - id: UIR-ADMIN-017
    title: "Create/update/reset errors show dismissible red banner"
    statement: "The Verwaltung page shows create, update and password-reset failures as a dismissible red banner with \"Schließen\" at the top of the page instead of a blocking alert."
    status: implemented
    sources: ["code: src/pages/AdminPage.tsx:479-490", "uat: v1.10 USM-002"]
    evidence:
      - "src/pages/AdminPage.tsx:479-490 — actionError banner with t('dismiss') = 'Schließen'"
      - "src/pages/AdminPage.tsx:321-328 (create), 423-430 (update), 355-362 (password reset) — set actionError"
      - "src/pages/AdminPage.tsx:331-342,365-377 — delete and TOTP reset only console.error on failure, no banner"
      - "src/pages/AdminPage.tsx:1022-1024 — session revoke failures show inline text inside the sessions panel, not the banner"
    tests: []
    browser:
      route: "/admin"
      steps:
        - "Log in as admin, open \"Verwaltung\"."
        - "Trigger a create failure as in UIR-ADMIN-016."
        - "Click \"Schließen\" on the red banner."
      expect: "Red banner with the server message appears above the \"Nutzer anlegen\" card without any browser alert dialog; clicking \"Schließen\" removes it."
    notes: "Delete and TOTP-reset failures are swallowed (console only); session-revoke failures use an inline red line in the panel ('Sitzung konnte nicht beendet werden.')."
