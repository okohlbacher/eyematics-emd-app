    evidence:
      - "src/pages/AdminPage.tsx:528-541 — Nutzer anlegen button toggles showForm"
      - "src/pages/AdminPage.tsx:543-603 — username, first name, last name inputs, role select (default researcher)"
      - "src/pages/AdminPage.tsx:605-627 — centre toggle buttons from centerOptions, highlighted when selected"
      - "src/pages/AdminPage.tsx:629-652 — Speichern / Abbrechen buttons"
      - "src/i18n/translations.ts:6-7,60,410,411,428,439-440 — labels"
