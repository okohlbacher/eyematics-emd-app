    tests: []
    browser:
      route: "/admin"
      steps:
        - "Log in as admin, open \"Verwaltung\", click \"Nutzer anlegen\"."
        - "Fill Benutzerkennung, Vorname, Nachname; leave all centre buttons unselected."
        - "Click \"Speichern\"."
      expect: "Red text 'Mindestens ein Standort muss zugewiesen werden' appears under the centre buttons; the form stays open and no new row is added."
