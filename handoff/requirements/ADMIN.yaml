# UI requirements registry — area ADMIN. Generated 2026-10-08 by the ui-requirements-registry workflow;
# maintained by the uat-triage skill (promotion and amendment of tester-confirmed behaviour; see handoff/HANDOFF.md §4).
area: ADMIN
requirements:
  - id: UIR-ADMIN-001
    title: "Non-admin never sees the user table on /admin"
    statement: "The UI redirects a non-admin user who opens /admin to the Startseite (\"/\") and never shows the Verwaltung user table; the page's own admin-only hint card is a second guard."
    status: implemented
    sources: ["code: src/App.tsx:28-32,62", "code: src/pages/AdminPage.tsx:257-267"]
    evidence:
      - "src/App.tsx:28-32 — AdminRoute: no user → Navigate /login; user.role !== 'admin' → Navigate '/' replace"
      - "src/App.tsx:62 — /admin route wrapped in AdminRoute"
      - "src/pages/AdminPage.tsx:257-267 — early return with Shield icon + t('adminOnlyHint') when !user || user.role !== 'admin' (defence in depth, unreachable behind the guard)"
      - "src/i18n/translations.ts:419-422 — adminOnlyHint: 'Diese Seite ist nur für Administratoren zugänglich.'"
    tests: []
    browser:
      route: "/admin"
      steps:
        - "Log in as forscher1 (role Forscher/in)."
        - "Type /admin into the address bar and press Enter."
        - "Observe where the app lands and check the sidebar."
      expect: "The app lands on the Startseite ('/'); no user table and no \"Verwaltung\" entry is shown. The hint card 'Diese Seite ist nur für Administratoren zugänglich.' is only reachable when AdminPage is rendered outside the guard (component test)."
    notes: "Statement rewritten to the behaviour that is observable in the deployed app (route-guard redirect); the previous wording described the in-component hint card, which AdminRoute makes unreachable. No test asserts either the redirect or the hint card."
  - id: UIR-ADMIN-002
    title: "User list columns: username, name, role, centres, dates, sessions"
    statement: "The Verwaltung page lists all users in a table with \"Benutzerkennung\", \"Name\", \"Rolle\", \"Zugewiesene Zentren\", \"Angelegt\", \"Letzte Anmeldung\" and \"Sitzungen\" columns."
    status: implemented
    sources: ["manual: Benutzerhandbuch §12.3", "code: src/pages/AdminPage.tsx:710-722"]
    evidence:
      - "src/pages/AdminPage.tsx:710-722 — table header: loginUsername, adminFullName, adminRole, adminAssignedCenters, adminCreated, adminLastLogin, adminSessions + unlabelled action column"
      - "src/pages/AdminPage.tsx:836-880 — row cells incl. centre chips, createdAt date, lastLogin date+time or '—'"
      - "server/auth/userAdminApi.ts:52-62 — GET /api/auth/users projection incl. lastLogin, active"
      - "server/auth/loginApi.ts:123-125 — touchLastLogin on successful login"
      - "src/i18n/translations.ts:60,409-429,441,1135 — column labels"
    tests:
      - file: tests/userCrud.test.ts
        name: "returns 200 with user list for admin — no passwordHash fields"
    browser:
      route: "/admin"
      steps:
        - "Log in as admin."
        - "Click \"Verwaltung\" in the sidebar."
        - "Read the header row of the \"Registrierte Nutzer\" table."
      expect: "Header shows Benutzerkennung, Name, Rolle, Zugewiesene Zentren, Angelegt, Letzte Anmeldung, Sitzungen; every user has a row; admin's row shows today's date/time under Letzte Anmeldung, users who never logged in show '—'."
    notes: "The table has seven labelled columns plus an unlabelled action column. The cited test asserts only that the list endpoint returns users without passwordHash; no test asserts the column set. tests/adminCenterFilter.test.tsx was removed from this mapping because its assertions concern the centre filter (see UIR-ADMIN-006)."
  - id: UIR-ADMIN-003
    title: "Fresh deployment lists the seven seeded users"
    statement: "The Verwaltung page on a fresh deployment lists the seven seeded users (admin, forscher1, forscher2, epidemiologe, kliniker, diz_manager, klinikleitung) with their centres."
    status: implemented
    sources: ["manual: Benutzerhandbuch §12.3; Konfiguration.md Standardbenutzer", "code: server/index.ts:105-121"]
    evidence:
      - "server/index.ts:107-120 — defaultUsers seeded into data/users.json only when the file is absent: admin all 6, forscher1 UKA, forscher2 UKC, epidemiologe UKA/UKC/UKG, kliniker UKT, diz_manager UKM, klinikleitung all 6"
      - "docs/Konfiguration.md:170-177 — Standardbenutzer table"
      - "docs/Deployment.md:52 — 7 Standardbenutzer, Passwort changeme2025!"
    tests: []
    browser:
      route: "/admin"
      steps:
        - "Deploy the container with an empty data volume (no users.json)."
        - "Log in as admin with the documented initial password."
        - "Open \"Verwaltung\" and read the \"Zugewiesene Zentren\" column."
      expect: "Exactly 7 rows: admin (UKA UKC UKG UKL UKM UKT), forscher1 (UKA), forscher2 (UKC), epidemiologe (UKA UKC UKG), kliniker (UKT), diz_manager (UKM), klinikleitung (UKA UKC UKG UKL UKM UKT); header count reads '7 Nutzer'."
    notes: "Seeding happens only if data/users.json is missing; an existing volume keeps its users. tests/initAuthMigration.test.ts uses forscher1 as a fixture but does not assert the seed set."
  - id: UIR-ADMIN-004
    title: "Full-text search filters users by name, centre, role key"
    statement: "The user can filter the user list via the \"Nutzer suchen…\" field by username, centre shorthand or internal role key, and only matching rows remain visible."
    status: implemented
    sources: ["manual: Benutzerhandbuch §12.3", "code: src/pages/AdminPage.tsx:210-221"]
    evidence:
      - "src/pages/AdminPage.tsx:213-221 — case-insensitive match on username, getCentersDisplay(u) shorthand list, u.role key"
      - "src/pages/AdminPage.tsx:668-677 — search input with adminSearchPlaceholder"
      - "src/pages/AdminPage.tsx:659-663 — counter `${filtered} ${t('auditFilteredOf')} ${total}`"
      - "src/i18n/translations.ts:425,634 — adminSearchPlaceholder 'Nutzer suchen…'; auditFilteredOf 'von'"
    tests: []
    browser:
      route: "/admin"
      steps:
        - "Log in as admin, open \"Verwaltung\"."
        - "Type UKT into the \"Nutzer suchen…\" field."
        - "Clear it and type researcher."
      expect: "After 'UKT' only kliniker, admin and klinikleitung remain (all have UKT); after 'researcher' only forscher1 and forscher2 remain; counter reads e.g. '2 von 7'."
    notes: "Role matching uses the internal key (admin, researcher, clinician, …), not the German label, so typing 'Forscher' matches only usernames containing it (forscher1/forscher2), not the role. Counter text corrected: the filtered counter reads 'n von m' (auditFilteredOf = 'von'), not 'n gefiltert von m'."
