    notes: "Centres are selectable chip buttons, not checkboxes. tests/adminUserDialog.test.tsx opens this form but its assertion is about validation (see UIR-ADMIN-010)."
  - id: UIR-ADMIN-009
    title: "Role select offers exactly six German role names"
    statement: "The user can assign exactly one of six roles (\"IT-Administrator\", \"Forscher/in\", \"Epidemiolog/in\", \"Kliniker/in\", \"DIZ Data Manager\", \"Klinikleitung\") in the create and edit forms."
    status: implemented
    sources: ["spec: EMDREQ-USM-004 / N10.01", "manual: Benutzerhandbuch §12.1"]
    evidence:
      - "src/pages/AdminPage.tsx:589-600 — create-form role select, six options"
      - "src/pages/AdminPage.tsx:768-779 — edit-row role select, six options"
      - "src/i18n/translations.ts:432-437 — German role labels"
      - "src/pages/AdminPage.tsx:36-46 — getRoleLabel for table display"
      - "server/auth/authHelpers.ts:31 VALID_ROLES; server/auth/userAdminApi.ts:86-90,199-202 — server allowlist"
    tests:
      - file: tests/ui-requirements.test.ts
        name: "all 6 roles are defined"
    browser:
      route: "/admin"
      steps:
        - "Log in as admin, open \"Verwaltung\", click \"Nutzer anlegen\"."
        - "Open the \"Rolle\" select and read the options."
        - "Click the pencil icon on forscher2's row and open its role select."
      expect: "Both selects list exactly, in this order: Forscher/in, IT-Administrator, Epidemiolog/in, Kliniker/in, DIZ Data Manager, Klinikleitung. After saving, the table's Rolle cell shows the chosen German label with its icon."
    notes: "The cited test only asserts that a local six-entry role array has length 6 (tests/ui-requirements.test.ts:64-70); it does not read the shared constant or the German labels. Kept as the only test touching the role set; a DOM test of the select options is missing."
  - id: UIR-ADMIN-010
    title: "Create form shows \"Pflichtfeld\" errors for empty fields"
    statement: "The \"Nutzer anlegen\" form refuses to save when username, first name or last name is empty, marks the field with a red border and shows a red \"Pflichtfeld\" hint beneath it."
    status: implemented
    sources: ["spec: EMDREQ-USM-001 / N10.02", "uat: v1.10 USM-001; v1.12 roadmap (all-fields-mandatory)", "code: src/pages/AdminPage.tsx:284-296,543-603"]
    evidence:
      - "src/pages/AdminPage.tsx:284-296 — handleAdd validation, returns before POST"
      - "src/pages/AdminPage.tsx:546-554,558-568,572-582,586-601 — red asterisk in label, border-red-400 on error, red text hint"
      - "src/i18n/translations.ts:25 — fieldRequired 'Pflichtfeld'"
    tests:
      - file: tests/adminUserDialog.test.tsx
        name: "blocks submit and shows error when firstName is empty"
    browser:
      route: "/admin"
      steps:
        - "Log in as admin, open \"Verwaltung\", click \"Nutzer anlegen\"."
        - "Leave all fields empty and click \"Speichern\"."
      expect: "Red 'Pflichtfeld' appears under Benutzerkennung, Vorname and Nachname (role has a default so no error), 'Mindestens ein Standort muss zugewiesen werden' under the centre row, inputs get a red border, no user is created and no green banner appears."
    notes: "The label text itself is not red; it carries a red asterisk and the input border and hint turn red. Role can never be empty in the UI (defaults to Forscher/in), so 'role' was dropped from the statement. The cited test's assertion is weak (errors shown OR no POST made) but concerns this form."
