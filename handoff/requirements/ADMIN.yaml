  - id: UIR-ADMIN-006
    title: "Centre filter restricts the user list"
    statement: "The user can restrict the user list to one centre via the \"Alle Zentren\" filter (data-testid admin-center-filter), which lists exactly the six sites UKA, UKC, UKG, UKL, UKM, UKT."
    status: implemented
    sources: ["code: src/pages/AdminPage.tsx:227-230,694-707", "code: data/centers.json"]
    evidence:
      - "src/pages/AdminPage.tsx:227-230 — centerFilter: u.centers.includes(centerFilter)"
      - "src/pages/AdminPage.tsx:694-707 — select data-testid admin-center-filter, options from centerOptions"
      - "src/pages/AdminPage.tsx:178-195 — centre options loaded from /api/fhir/centers"
      - "data/centers.json:2-7 — roster UKA, UKC, UKG, UKL, UKM, UKT in that order"
      - "src/i18n/translations.ts:427 — adminFilterAllCenters 'Alle Zentren'"
    tests:
      - file: tests/adminCenterFilter.test.tsx
        name: "renders exactly 7 <option> elements: All centers + 6 sites in roster order"
      - file: tests/adminCenterFilter.test.tsx
        name: "narrows the user table to only users belonging to the selected center"
    browser:
      route: "/admin"
      steps:
        - "Log in as admin, open \"Verwaltung\"."
        - "Open the centre dropdown (default \"Alle Zentren\") and read its options."
        - "Select UKM."
      expect: "Options are Alle Zentren, UKA, UKC, UKG, UKL, UKM, UKT; after selecting UKM only diz_manager, admin and klinikleitung remain."
    notes: "Both cited tests verified: the first asserts the exact option labels and values in roster order, the second asserts rows appear/disappear by username when the select changes."
  - id: UIR-ADMIN-007
    title: "Column headers sort the user list asc/desc"
    statement: "The user can sort the user list by clicking the headers \"Benutzerkennung\", \"Rolle\", \"Zugewiesene Zentren\", \"Angelegt\" and \"Letzte Anmeldung\", and a second click reverses the order."
    status: implemented
    sources: ["manual: Benutzerhandbuch §12.3", "code: src/pages/AdminPage.tsx:60-87,232-252,269-276,714-719"]
    evidence:
      - "src/pages/AdminPage.tsx:60-87 — SortHeader with ArrowUpDown icon, text-blue-600 when active"
      - "src/pages/AdminPage.tsx:232-252 — sort comparator per field, asc/desc"
      - "src/pages/AdminPage.tsx:269-276 — handleSort toggles direction on repeated click, resets to asc on a new field"
      - "src/pages/AdminPage.tsx:714-719 — five sortable headers; Name and Sitzungen are plain <th>"
    tests: []
    browser:
      route: "/admin"
      steps:
        - "Log in as admin, open \"Verwaltung\"."
        - "Click the \"Rolle\" header once; note the first row."
        - "Click \"Rolle\" again."
      expect: "First click sorts by role key ascending (admin first), arrow icon on Rolle turns blue; second click reverses so admin is last. Default order is by Benutzerkennung ascending."
    notes: "Role sort uses the internal role key (admin < clinic_lead < clinician < data_manager < epidemiologist < researcher), not the German label."
  - id: UIR-ADMIN-008
    title: "\"Nutzer anlegen\" opens form with name, role, centre fields"
