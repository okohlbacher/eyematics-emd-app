  - id: UIR-LAND-011
    title: "One centre row per visible centre"
    statement: "The Startseite \"Angeschlossene Zentren und Standorte\" tile shows one row per visible centre with its shorthand badge (UKA, UKC, …), the centre name and \"<Stadt>, <Bundesland>\"."
    status: implemented
    sources: ["spec: EMDREQ-DAT-002 / N11.01 (Anforderungsabgleich: Umgesetzt)", "manual: docs/Benutzerhandbuch.md §3", "code: src/pages/LandingPage.tsx:235-301"]
    evidence:
      - "src/pages/LandingPage.tsx:247-277 (centers.map → badge getCenterShorthand, name, city/state)"
      - "src/services/fhirLoader.ts:51-87 (extractCenters from Organization resources: id, name, city, state)"
      - "src/services/fhirLoader.ts:181-200 (loadCenterShorthands from /api/fhir/centers, getCenterShorthand)"
      - "data/centers.json (six centres with shorthands UKA..UKT)"
    tests:
      - file: tests/generatedBundles.test.ts
        name: "loads via fhirLoader and yields extractable centers/cases"
      - file: tests/constants.test.ts
        name: "getCenterShorthands returns id→shorthand map"
    browser:
      route: "/"
      steps:
        - "Log in as admin."
        - "Count the rows in the \"Angeschlossene Zentren und Standorte\" tile below the Datenvollzähligkeit card and read each badge, name and location."
      expect: "Six rows: UKA Universitätsklinikum Aachen, UKC Chemnitz, UKG Greifswald, UKL Leipzig, UKM Münster, UKT Tübingen, each with '<Stadt>, <Bundesland>' under the name, matching data/centers.json."
    notes: "Rows are role=button rows inside one Tile, not separate cards. Both tests are indirect: generatedBundles asserts extractCenters on 4 of the 6 shipped bundles (Aachen/Tübingen not covered); constants.test covers the server-side shorthand map behind /api/fhir/centers, not the rendered badge."
  - id: UIR-LAND-012
    title: "Centre rows limited to the user's centres"
    statement: "The Startseite shows only the centres assigned to the logged-in user (server-filtered bundles); admins and users assigned all six centres see all six rows."
    status: implemented
    sources: ["manual: docs/Benutzerhandbuch.md §3, §15", "code: server/fhirApi.ts:396-410"]
    evidence:
      - "server/fhirApi.ts:396-410 (GET /api/fhir/bundles: admin bypass, else filterBundlesByCenters(req.auth.centers))"
      - "src/context/DataContext.tsx:122-129 (centers = extractCenters(filtered bundles))"
      - "src/pages/LandingPage.tsx:89-94,247 (KPI centers.length; rows rendered as delivered)"
      - "server/index.ts:109-115 (seed: forscher1 → org-uka; epidemiologe → uka/ukc/ukg; admin + klinikleitung → all six)"
    tests:
      - file: tests/fhirApi.test.ts
        name: "Test 1: filterBundlesByCenters() with local bundles filters to user centers only"
      - file: tests/fhirApi.test.ts
        name: "Test 3: isBypass() returns true for role=admin regardless of centers"
      - file: tests/centerBypass.test.ts
        name: "admin always bypasses regardless of centers"
      - file: tests/centerBypass.test.ts
        name: "non-admin never bypasses, even with all valid centers"
    browser:
      route: "/"
      steps:
        - "Log in as forscher1 and count the centre rows; log out."
        - "Log in as epidemiologe and count; log out."
        - "Log in as klinikleitung and count; log out."
        - "Log in as admin and count."
      expect: "forscher1: 1 row (UKA); epidemiologe: 3 rows (UKA, UKC, UKG); klinikleitung and admin: 6 rows. The 'Angeschlossene Zentren' KPI shows the same number as rows."
    notes: "Enforcement is server-side; the landing page has no own filter. The cited tests cover the server filter and bypass logic, not the rendered row count."
  - id: UIR-LAND-013
    title: "Centre row case count from local data"
    statement: "The Startseite shows per centre row the number of non-stub cases (\"Fälle\") from local bundles, equal to the Kohortenbildung count filtered on that centre while none of its cases is excluded."
    status: partial
    sources: ["spec: EMDREQ-DAT-003 / N11.02 (Anforderungsabgleich: Abweichend)", "manual: docs/Benutzerhandbuch.md §3"]
    evidence:
      - "src/pages/LandingPage.tsx:278-285 (label t('cases') + center.patientCount)"
      - "src/services/fhirLoader.ts:79-83 (patientCount = patients of the org with >= 1 Observation, D-04)"
      - "shared/patientCases.ts:81 (same stub rule for extractPatientCases, D-03)"
      - "src/pages/CohortBuilderPage.tsx:63,655-680 (centre checkboxes under 'Zentren' labelled with the full centre name; filters applied to activeCases)"
      - "src/context/DataContext.tsx:149-151 (activeCases = cases minus excludedCases)"
    tests:
      - file: tests/stubIsolation.test.ts
        name: "patientCount reflects only clinical (non-stub) patients"
      - file: tests/generatedBundles.test.ts
        name: "loads via fhirLoader and yields extractable centers/cases"
    browser:
      route: "/"
      steps:
        - "Log in as admin with no excluded cases; note the \"Fälle\" number on the UKA row."
        - "Open \"Kohortenbildung\" and, under the \"Zentren\" heading in the filter panel, tick only the checkbox \"Universitätsklinikum Aachen\"; read the \"Kohorte: N Fälle\" heading."
        - "Compare the two numbers."
      expect: "Both numbers are equal (e.g. 50). If a UKA case was excluded in Datenqualität (\"Von Analysen ausschließen\"), the cohort count is lower by that number (documented deviation)."
    notes: "Partial for the same reason as LAND-006: patientCount ignores the Datenqualität exclusion list, the cohort builder respects it. The cohort centre filter is a checkbox list of full names, not a 'UKA' selector."
  - id: UIR-LAND-014
    title: "Centre row last-update date in locale format"
    statement: "The Startseite shows on each centre row a clock icon with the bundle's last-update date in short numeric form for the active locale (dd.mm.yy in DE, mm/dd/yy in EN) or \"—\" when none."
    status: implemented
    sources: ["spec: EMDREQ-DAT-004 / N07.06 (Anforderungsabgleich: Teilweise)", "manual: docs/Benutzerhandbuch.md §3", "code: src/pages/LandingPage.tsx:286-295"]
    evidence:
      - "src/pages/LandingPage.tsx:286-295 (Clock icon + toLocaleDateString(getDateLocale(locale), {day:'2-digit', month:'2-digit', year:'2-digit'}) or '—')"
      - "src/services/fhirLoader.ts:84 (lastUpdated = bundle.meta.lastUpdated ?? '')"
      - "src/utils/dateFormat.ts:9-11 (getDateLocale)"
      - "public/data/center-*.json meta.lastUpdated (all six bundles carry a timestamp, e.g. Aachen 2026-04-08T06:00:00Z)"
    tests: []
