    evidence:
      - "src/pages/LandingPage.tsx:143-146 (Button disabled title=\"Funktion noch nicht verfügbar\", no onClick)"
      - "src/components/primitives/Button.tsx:36-37 (spreads props; disabled:opacity-50 disabled:cursor-not-allowed)"
      - "src/i18n/translations.ts:1057 (export: 'Export')"
