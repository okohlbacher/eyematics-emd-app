# UI requirements registry — area LAND. Generated 2026-10-08 by the ui-requirements-registry workflow;
# maintained by the uat-triage skill (promotion and amendment of tester-confirmed behaviour; see handoff/HANDOFF.md §4).
area: LAND
requirements:
  - id: UIR-LAND-001
    title: "Startseite is the post-login landing page"
    statement: "The UI lands on the Startseite (/) automatically after a successful login (password step or 2FA step), and any unknown route redirects to /."
    status: implemented
    sources: ["spec: EMDREQ-DAT-001 / N11.01 (Anforderungsabgleich: Umgesetzt)", "manual: docs/Benutzerhandbuch.md §2, §3"]
    evidence:
      - "src/pages/LoginPage.tsx:66 (navigate('/') after credential login)"
      - "src/pages/LoginPage.tsx:114 (navigate('/') after OTP login)"
      - "src/App.tsx:55 (route / → LandingPage inside ProtectedRoute + Layout)"
      - "src/App.tsx:66 (catch-all * → Navigate to / replace)"
    tests: []
    browser:
      route: "/login"
      steps:
        - "Open /login and log in as admin (password step; enter the OTP if the account has 2FA enabled)."
        - "Read the address bar and the page heading."
        - "While logged in, open /does-not-exist in the address bar."
      expect: "After step 2 the URL is exactly / and the heading starts with \"Willkommen,\" followed by the user's name. Step 3 lands on / again with the same heading."
    notes: "No unit test renders LoginPage and asserts navigate('/'); tests/sessionTimers.test.tsx only covers the reverse redirect to /login. Unknown routes while logged out go / → /login."
  - id: UIR-LAND-002
    title: "Loading text while FHIR bundles load"
    statement: "The Startseite content area shows only the centred loading text \"Daten werden geladen...\" while the FHIR bundles load; no KPI tiles, centre rows or right rail render before that."
    status: implemented
    sources: ["code: src/pages/LandingPage.tsx:44-50"]
    evidence:
      - "src/pages/LandingPage.tsx:44-50 (early return with t('dataLoading') while loading)"
      - "src/context/DataContext.tsx:97 (loading initialised true) and :107-137 (set false after Promise.all of bundles + data endpoints)"
      - "src/i18n/translations.ts:134 (dataLoading: 'Daten werden geladen...' / 'Loading data...')"
    tests: []
    browser:
      route: "/"
      steps:
        - "Log in as admin, open DevTools → Network and set throttling to 'Slow 3G'."
        - "Reload /."
        - "Watch the content area right of the sidebar during the first seconds."
      expect: "A single centred grey line \"Daten werden geladen...\" is shown in the content area with no KPI tiles, centre rows or right rail (the sidebar itself stays visible); once the bundles arrive the full page replaces it."
    notes: "Layout (sidebar) is rendered by App.tsx around the page, so only the <main> content is replaced by the loading text. German text carries a trailing three-dot ellipsis. No test mocks loading:true for LandingPage."
  - id: UIR-LAND-003
    title: "Greeting by display name from the server"
    statement: "The Startseite greets the user with \"Willkommen, <Vorname Nachname>.\" using the name loaded from /api/auth/users/me; only when no name is stored (or the call fails) does it fall back to the username."
    status: implemented
    sources: ["code: src/pages/LandingPage.tsx:132-137; src/context/AuthContext.tsx:116-142", "manual: docs/Benutzerhandbuch.md §3", "spec: EMDREQ-DAT-001 / N11.01"]
    evidence:
      - "src/pages/LandingPage.tsx:39 (displayName from useAuth) and :132-134 (h1 '{t('welcome')}, {displayName}.')"
      - "src/pages/LandingPage.tsx:135-137 (subtitle t('landingSubtitle') directly under the h1)"
      - "src/context/AuthContext.tsx:116-142 (fetch /api/auth/users/me, join firstName+lastName, fallback to username when both missing or on fetch error)"
      - "server/index.ts:109-115 (seed users carry firstName/lastName, e.g. forscher1 = Anna Müller, admin = System Administrator)"
      - "src/i18n/translations.ts:115-118 (welcome: 'Willkommen'; landingSubtitle: 'Klinischer Demonstrator — Datenübersicht')"
    tests: []
    browser:
      route: "/"
      steps:
        - "Log in as forscher1 (seeded with Vorname 'Anna', Nachname 'Müller')."
        - "Read the h1 heading on the Startseite and the line directly below it."
      expect: "The heading reads \"Willkommen, Anna Müller.\" (not 'forscher1'); the line below reads \"Klinischer Demonstrator — Datenübersicht\"."
    notes: "The username fallback is not reachable through the UI: the Verwaltung create and edit forms validate Vorname and Nachname as Pflichtfeld (src/pages/AdminPage.tsx:288-289, 397-398). It only triggers for a users.json entry without names or when /users/me fails. tests/userCrud.test.ts covers the endpoint but no test asserts the greeting."
  - id: UIR-LAND-004
    title: "Today's date in the active locale"
    statement: "The Startseite shows today's date in the uppercase caption line above the greeting as a long date with weekday for the active locale (de-DE or en-US)."
    status: implemented
    sources: ["code: src/pages/LandingPage.tsx:121-131"]
    evidence:
      - "src/pages/LandingPage.tsx:123-131 (caption: t('clinicalDemonstrator') · toLocaleDateString(getDateLocale(locale), {weekday:'long', day:'numeric', month:'long', year:'numeric'}))"
      - "src/utils/dateFormat.ts:9-11 (getDateLocale: de → 'de-DE', else 'en-US')"
      - "src/i18n/translations.ts:55 (clinicalDemonstrator: 'Klinischer Demonstrator' / 'Clinical Demonstrator')"
      - "src/components/Layout.tsx:115 (language switch button toggles de/en)"
    tests: []
    browser:
      route: "/"
      steps:
        - "Log in as admin with language DE."
        - "Read the small uppercase caption line above the \"Willkommen\" heading."
        - "Switch the language to EN via the DE/EN switch at the bottom of the sidebar and read the line again."
      expect: "DE shows e.g. 'KLINISCHER DEMONSTRATOR · Donnerstag, 8. Oktober 2026'; EN shows 'CLINICAL DEMONSTRATOR · Thursday, October 8, 2026' for the same day."
    notes: "The caption is uppercased by CSS (class uppercase); the DOM text is mixed case. No test asserts the date formatting."
  - id: UIR-LAND-005
    title: "Four KPI tiles for the user's visible data"
    statement: "The Startseite shows four KPI tiles: \"Angeschlossene Zentren\", \"Pseudonymisierte Fälle\", \"Messwerte gesamt\" and \"OCT-Aufnahmen\" (last two locale-formatted), computed from the user's visible data."
    status: implemented
    sources: ["spec: EMDREQ-DAT-003 / N11.02 (Anforderungsabgleich: Abweichend)", "code: src/pages/LandingPage.tsx:52-116,151-173"]
    evidence:
      - "src/pages/LandingPage.tsx:52-63 (totalPatients, totalObservations, totalOctImages derived from cases)"
      - "src/pages/LandingPage.tsx:81-116 (stats array; measurements and OCT use toLocaleString(locale), centres/cases are raw numbers; sub-captions '<n> online', 'FHIR-Bundles', 'LOINC-Beobachtungen', 'modalitätenübergreifend')"
      - "src/pages/LandingPage.tsx:151-173 (grid of 4 Tiles)"
      - "src/i18n/translations.ts:120-123 (tile labels) and :1053-1056 (sub-captions)"
      - "server/fhirApi.ts:396-410 (bundles already filtered per user, so 'visible data')"
    tests: []
    browser:
      route: "/"
      steps:
        - "Log in as admin (DE)."
        - "Count the tiles in the row directly below the header and read their labels, values and small right-hand sub-captions."
        - "Switch to EN and read the \"Messwerte gesamt\" / \"Total Measurements\" value again."
      expect: "Exactly four tiles: Angeschlossene Zentren = 6 (sub '6 online'), Pseudonymisierte Fälle > 0 (sub 'FHIR-Bundles'), Messwerte gesamt (sub 'LOINC-Beobachtungen') and OCT-Aufnahmen (sub 'modalitätenübergreifend') > 0. Thousands separator is '.' in DE (12.345) and ',' in EN (12,345)."
    notes: "Only 'Messwerte gesamt' and 'OCT-Aufnahmen' are locale-formatted; the two count tiles render the raw number. tests/datenvollstaendigkeitCard.test.tsx only smoke-renders the page and does not assert the tiles."
  - id: UIR-LAND-006
    title: "Fälle KPI equals unfiltered cohort count"
    statement: "The Startseite \"Pseudonymisierte Fälle\" KPI shows the number of loaded non-stub cases and equals the unfiltered Kohortenbildung total only while no case is excluded in Datenqualität."
    status: partial
    sources: ["uat: v1.10 DAT-003", "spec: EMDREQ-DAT-003 / N11.02"]
    evidence:
      - "src/pages/LandingPage.tsx:52 (totalPatients = cases.length) and :95-101 (tile)"
      - "src/context/DataContext.tsx:149-151 (activeCases = cases minus excludedCases)"
      - "src/pages/CohortBuilderPage.tsx:63-64 (uses activeCases) and :945-950 (header '{t('cohortCases')}: N {t('cases')}', footer '{t('of')} {activeCases.length} {t('totalCases')}')"
      - "src/i18n/translations.ts:200-202 (cohortCases: 'Kohorte', totalCases: 'Gesamtfällen', of: 'von')"
      - "src/components/quality/QualityCaseDetail.tsx:410 (\"Von Analysen ausschließen\" button adds a case to excludedCases)"
      - "shared/patientCases.ts:81 (stubs excluded from cases)"
    tests: []
    browser:
      route: "/"
      steps:
        - "Log in as admin; in \"Datenqualität\" check that the \"Ausgeschlossene Fälle\" summary card shows 0."
        - "Note the \"Pseudonymisierte Fälle\" value on the Startseite."
        - "Click \"Kohortenbildung\" and, with no filters set, read the grey line under the \"Kohorte: N Fälle\" heading ('von N Gesamtfällen')."
        - "In Datenqualität open one case and click \"Von Analysen ausschließen\"; repeat steps 2-3."
      expect: "Steps 2 and 3 show the same number. After step 4 the cohort total ('von N Gesamtfällen') is one lower than the KPI (documented deviation)."
    notes: "Partial: the landing KPI uses cases.length while the cohort builder total uses activeCases.length (cases excluded via Datenqualität removed). The two numbers diverge by the number of excluded cases. No test asserts the parity."
  - id: UIR-LAND-007
    title: "Datenvollzähligkeit card with % and n / m"
    statement: "The Startseite \"DATENVOLLZÄHLIGKEIT\" card shows the completeness percentage (cases / all Patients incl. stubs), \"n / m Patienten\" and a colour-coded role=progressbar with aria-valuenow."
    status: implemented
    sources: ["uat: v1.14 I5; v1.12 roadmap (two-number completeness, Phase 34); confirmed by tester in v1.15", "code: src/pages/LandingPage.tsx:31-35,175-228", "spec: EMDREQ-DAT-003 / N11.02"]
    evidence:
      - "src/pages/LandingPage.tsx:31-35 (completenessColor: sage >= 0.5, amber >= 0.25, coral below)"
      - "src/pages/LandingPage.tsx:65-71 (fraction = cases.length / countRawPatients(bundles))"
      - "src/pages/LandingPage.tsx:175-228 (card, '{pct} %', '{n} / {m} Patienten', progressbar with aria-valuenow/min/max)"
      - "src/services/fhirLoader.ts:96-102 (countRawPatients includes stubs)"
      - "src/i18n/translations.ts:1091-1098 (caption, patients, aria-label keys)"
    tests:
      - file: tests/datenvollstaendigkeitCard.test.tsx
        name: "renders the completeness percentage (70 % for 7 of 10 patients)"
      - file: tests/datenvollstaendigkeitCard.test.tsx
        name: "renders the n / m patients sub-label"
      - file: tests/datenvollstaendigkeitCard.test.tsx
        name: "renders progressbar with correct aria-valuenow"
      - file: tests/datenvollstaendigkeitCard.test.tsx
        name: "renders the DATENVOLLZÄHLIGKEIT caption"
      - file: tests/stubIsolation.test.ts
        name: "returns total Patient count including stubs (denominator)"
    browser:
      route: "/"
      steps:
        - "Log in as admin."
        - "Locate the full-width card between the KPI row and the centre list, headed \"DATENVOLLZÄHLIGKEIT\"."
        - "Read the large percentage and the small text next to it; inspect the bar (DevTools: role=progressbar, aria-valuenow)."
      expect: "The card shows e.g. '83 %' and '415 / 500 Patienten'; aria-valuenow equals the shown percentage; the bar and percentage are green (sage) at >= 50 %, amber at 25-49 %, coral below 25 %."
    notes: "Rendered as '{n} / {m} Patienten', not 'n von m'. The SKIP_REASON comments in the test file are stale: all card assertions are plain it() and pass (verified 2026-10-08, 84/84 in the cited files)."
  - id: UIR-LAND-008
    title: "Completeness info tooltip"
    statement: "The user can hover (or Tab-focus) the info icon next to \"DATENVOLLZÄHLIGKEIT\" and sees a native title tooltip explaining the completeness metric; the text is also exposed as aria-label."
    status: implemented
    sources: ["spec: EMDREQ-DAT-003 / N11.02", "code: src/pages/LandingPage.tsx:190-193"]
    evidence:
      - "src/pages/LandingPage.tsx:190-193 (<InfoTooltip text={t('datenvollstaendigkeitTooltip')} /> next to the caption)"
      - "src/components/primitives/InfoTooltip.tsx:17-25 (span role=img, title + aria-label = text, tabIndex 0, Info icon)"
      - "src/i18n/translations.ts:1095-1098 (tooltip text DE/EN)"
    tests:
      - file: tests/datenvollstaendigkeitCard.test.tsx
        name: "renders the definition tooltip as an accessible info icon"
    browser:
      route: "/"
      steps:
        - "Log in as admin (DE)."
        - "Hover the small (i) icon right of the \"DATENVOLLZÄHLIGKEIT\" caption for about one second."
      expect: "A native tooltip appears starting with 'Vollzähligkeit: Anteil der Patient:innen mit Daten im System an allen registrierten Patient:innen (inkl. noch ohne Messwerte).'"
    notes: "Native browser title tooltip (usual ~1 s hover delay), not a custom popover; keyboard focus shows the ring but browsers do not open title tooltips on focus."
