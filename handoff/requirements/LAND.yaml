  - id: UIR-LAND-015
    title: "Centre row opens Dokumentationsqualität"
    statement: "The user can, with a quality role (admin, clinic_lead, data_manager), click or Tab+Enter any centre row on the Startseite and is navigated to /doc-quality; other roles are bounced back to /."
    status: partial
    sources: ["uat: v1.10 A-01", "code: src/pages/LandingPage.tsx:251-256"]
    evidence:
      - "src/pages/LandingPage.tsx:251-256 (role=button, tabIndex 0, onClick and Enter → navigate('/doc-quality'))"
      - "src/App.tsx:35-40,61 (QualityRoute redirects non-QUALITY_ROLES users to /)"
      - "src/context/AuthContext.tsx:23 (QUALITY_ROLES = admin, clinic_lead, data_manager)"
      - "src/i18n/translations.ts:646 (docQualityTitle: 'Dokumentationsqualität')"
    tests: []
    browser:
      route: "/"
      steps:
        - "Log in as admin and click the UKA centre row."
        - "Go back to /, press Tab until a centre row has the focus ring and press Enter."
        - "Log in as forscher1 and click the UKA row."
      expect: "Steps 1 and 2: URL is /doc-quality and the \"Dokumentationsqualität\" page renders. Step 3: the URL stays / (redirected back) and nothing else happens."
    notes: "Partial against the original 'any user' wording: every row navigates to /doc-quality, but for researcher/epidemiologist/clinician the QualityRoute immediately redirects back to /, so the click is a visible no-op. Only Enter (not Space) activates the row. No it() clicks a row."
