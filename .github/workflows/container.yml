# v1.20 — build the EMD container image and publish it to GHCR on every v* tag.
# Image: ghcr.io/okohlbacher/eyematics-emd-app  (tags: <version from the git tag> + dev)
# UseAVibe release channel (harness decision O-37, owner consent 2026-10-28): a tag push publishes a release
# candidate as :<version> and :dev only. :latest moves only by promotion of the version the team accepted (after
# the cycle close or the defect phase): workflow_dispatch with promote_version + promote_digest re-points :latest
# at exactly that digest — no rebuild, so the promoted image is byte-identical to the tested one.
# workflow_dispatch without inputs = build-only dry run (no push).
name: container

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      promote_version:
        description: 'Promote this published version to :latest (UseAVibe hand-over)'
        required: false
        default: ''
      promote_digest:
        description: 'Expected sha256:<64 hex> of that version (useavibe release-record)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event_name == 'push' || inputs.promote_version == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4          # linux/arm64 leg
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Tags are not strict semver (v1.19, v1.19.1) → plain match instead of type=semver.
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=dev,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No provenance attestation → no unknown/unknown rows in the index / on the GHCR page.
          # (BuildKit pushes an OCI index; Podman ignores HEALTHCHECK on OCI images, which is why
          # deploy/EMD.container carries its own HealthCmd. Docker reads it from the config regardless.)
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_version != ''
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.promote_version }}
      DIGEST: ${{ inputs.promote_digest }}
      REPO: ${{ github.repository }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-point latest at the accepted digest (verified before and after)
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "promote_digest must be sha256:<64 hex>"; exit 1; }
          T=$(curl -s "https://ghcr.io/token?scope=repository:${REPO}:pull" | jq -r .token)
          dig() { curl -s -o /dev/null -w '%header{docker-content-digest}' -H "Authorization: Bearer $T" \
            -H "Accept: application/vnd.oci.image.index.v1+json" "https://ghcr.io/v2/${REPO}/manifests/$1"; }
          got=$(dig "$VERSION")
          [ "$got" = "$DIGEST" ] || { echo ":$VERSION is $got, not the accepted $DIGEST"; exit 1; }
          docker buildx imagetools create -t "ghcr.io/${REPO}:latest" "ghcr.io/${REPO}@${DIGEST}"
          now=$(dig latest)
          [ "$now" = "$DIGEST" ] || { echo ":latest is now $now, expected $DIGEST"; exit 1; }
          echo ":latest → $VERSION @ $DIGEST"
