# v1.20 — build the EMD container image and publish it to GHCR on every v* tag.
# Image: ghcr.io/okohlbacher/eyematics-emd-app  (tags: <version from the git tag> + latest)
# workflow_dispatch = build-only dry run (no push).
name: container

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4          # linux/arm64 leg
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Tags are not strict semver (v1.19, v1.19.1) → plain match instead of type=semver.
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Docker-format manifest list: Podman only honours HEALTHCHECK on non-OCI images,
          # and it keeps the unknown/unknown attestation rows off the GHCR package page.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
